  const wrap=el('div','steps-strip');wrap.style.borderColor='rgba(244,114,182,.3)';
  const top=el('div','ss-top');
  const lw=latest&&latest.fields.weight?latest.fields.weight+'kg':'\u2014';
  const ld=latest?' \u00b7 '+fmtShort(latest.date):'';
  top.innerHTML='<span class="ss-ico">\ud83d\udccf</span><span class="ss-lbl mf">MEASUREMENTS</span><span class="ss-tgt mf">'+lw+ld+'</span>';
  wrap.appendChild(top);
  if(S._expMeas){
    const info=el('div');info.style.cssText='font-size:.625rem;color:var(--t3);margin:.5rem 0 .3rem';
    const todayBody=S.log.find(a=>a.group==='body'&&a.date===iso);
    info.textContent=todayBody?('Editing '+fmtShort(iso)):('New entry for '+fmtShort(iso)+' \u00b7 weekly is fine');
    wrap.appendChild(info);
    const grid=el('div','nutgrid');grid.style.marginLeft='0';grid.style.marginRight='0';
    const mf=(lbl,key,unit)=>{
      const fl=el('div','nutfld');fl.innerHTML='<div class="flbl mf">'+lbl+'</div>';
      const ip=el('input');ip.type='text';ip.inputMode='decimal';
      // read straight from today's entry (if any) — NOT from any previous date
      const existing=S.log.find(a=>a.group==='body'&&a.date===iso);
      ip.value=(existing&&existing.fields[key])||'';ip.placeholder=unit;
      ip.oninput=e=>{
        let body=S.log.find(a=>a.group==='body'&&a.date===iso);
        if(!body){body=makeActivity(S,'body',iso);body.done=true;body.date=iso;upsertActivity(body);}
        body.fields[key]=e.target.value;upsertActivity(body);
      };
      fl.appendChild(ip);grid.appendChild(fl);
    };
    mf('WEIGHT (kg)','weight','kg');mf('WAIST (in)','waist','in');mf('BODY FAT %','bodyFat','%');mf('MUSCLE (kg)','muscle','kg');
    wrap.appendChild(grid);
  }
  top.onclick=()=>{S._expMeas=!S._expMeas;save();render();};
  return wrap;
}

function isActiveDay(S,iso){
  // active if any workout logged that day (gym/run/golf/etc), else rest
  return S.log.some(a=>a.date===iso&&a.done&&['strength','cardio'].indexOf(a.group)>=0);
}
function mkStepsStrip(iso){
  S.steps=S.steps||{};
  const val=S.steps[iso]||'';
  const tgt=stepTarget(iso);
  const n=parseInt(String(val).replace(/,/g,''))||0;
  const hit=n>=tgt;
  const pct=Math.min(100,Math.round((n/tgt)*100));
  const wrap=el('div','steps-strip'+(hit?' hit':''));
  const top=el('div','ss-top');
  top.innerHTML='<span class="ss-ico">👟</span><span class="ss-lbl mf">STEPS</span><span class="ss-tgt mf">'+(n?n.toLocaleString():'—')+' / '+tgt.toLocaleString()+(hit?' ✓':'')+'</span>';
  wrap.appendChild(top);
  const inp=el('input','ss-inp');inp.type='text';inp.inputMode='numeric';inp.value=val;inp.placeholder='Enter steps for '+fmtShort(iso).split(' ').slice(0,1)+'…';
  inp.oninput=e=>{S.steps[iso]=e.target.value;save();};
  inp.onblur=()=>render();
  wrap.appendChild(inp);
  const bar=el('div','ss-bar');const fill=el('div','ss-fill');fill.style.width=pct+'%';fill.style.background=hit?'#4ade80':'#60a5fa';bar.appendChild(fill);wrap.appendChild(bar);
  return wrap;
}

function mkToday(){
  const wrap=el('div');wrap.appendChild(mkDayNav());
  const acts=activitiesOn(S,S.cursor);
  if(!acts.length)wrap.appendChild(el('div','empty','No activities logged for this day yet.<br>Tap ➕ Add activity to begin.'));
  else{const byG={};acts.forEach(a=>{(byG[a.group]=byG[a.group]||[]).push(a);});GROUP_ORDER.forEach(g=>{if(!byG[g])return;const gm=GROUP_META[g];wrap.appendChild(mkSH(gm.label,gm.color));byG[g].forEach(a=>wrap.appendChild(mkActivityCard(a)));});}
  const add=el('button','addbtn','➕  Add activity');add.onclick=openPicker;wrap.appendChild(add);
  wrap.appendChild(mkSH('Daily log','#60a5fa'));
  wrap.appendChild(mkStepsStrip(S.cursor));
  wrap.appendChild(mkNutritionStrip(S.cursor));
  wrap.appendChild(mkDrinkStrip(S.cursor));
  wrap.appendChild(mkMeasureStrip(S.cursor));
  return wrap;
}

/* ===== WEEK ===== */
function mkDayBlock(iso){
  const acts=activitiesOn(S,iso);const block=el('div','dayblock');const hd=el('div','dayblock-hd');const t=iso===todayISO();
  const left=el('div');left.innerHTML='<span class="db-date'+(t?' today':'')+'">'+fmtShort(iso)+(t?' · today':'')+'</span>';
  const right=el('div');right.style.cssText='display:flex;align-items:center;gap:.6rem';
  if(acts.length){const dots=el('div','db-dots');acts.slice(0,6).forEach(a=>{const gm=GROUP_META[a.group]||GROUP_META.other;const d=el('div','db-dot');d.style.background=a.done?gm.color:gm.color+'44';dots.appendChild(d);});right.appendChild(dots);right.appendChild(el('span','db-count',acts.filter(a=>a.done).length+'/'+acts.length));}else right.appendChild(el('span','db-count','—'));
  hd.append(left,right);hd.onclick=()=>{S.view='today';S.cursor=iso;save();render();};block.appendChild(hd);
  acts.forEach(a=>{const m=el('div','mini-act');const gm=GROUP_META[a.group]||GROUP_META.other;m.innerHTML='<span>'+gm.icon+' '+a.name+'</span><span class="'+(a.done?'ma-done':'')+'">'+(a.done?'✓':'·')+'</span>';m.onclick=()=>{S.view='today';S.cursor=iso;S._open=a.id;save();render();};block.appendChild(m);});
  return block;
}
function mkWeek(){
  const wrap=el('div');const mon=weekOf(S.cursor);
  const nav=el('div','daynav');const pv=el('button','arrow','‹');pv.onclick=()=>{S.cursor=addDays(mon,-7);save();render();};const nx=el('button','arrow','›');nx.onclick=()=>{S.cursor=addDays(mon,7);save();render();};
  const dc=el('div','dc');dc.innerHTML='<div class="d1">'+fmtNice(mon).replace(/ \d{4}$/,'')+' – '+fmtNice(addDays(mon,6)).replace(/ \d{4}$/,'')+'</div><div class="d2 mf">WEEK OF</div>';nav.append(pv,dc,nx);wrap.appendChild(nav);
  weekDates(mon).forEach(iso=>wrap.appendChild(mkDayBlock(iso)));
  const add=el('button','addbtn','➕  Add activity to '+fmtShort(S.cursor));add.onclick=openPicker;wrap.appendChild(add);
  return wrap;
}

/* ===== MONTH — grouped by activity ===== */
function monthBounds(iso){
  const d=parseISO(iso);const y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  return {first:isoOf(first),last:isoOf(last),days:last.getDate(),y:y,m:m};
}
function daysElapsedInMonth(iso){
  const b=monthBounds(iso);const today=todayISO();
  if(today<b.first)return 0;
  if(today>b.last)return b.days;             // past month: full
  return parseISO(today).getDate();          // current month: day-of-month
}
function monthStats(S,iso){
  const b=monthBounds(iso);
  const inM=a=>a.date>=b.first&&a.date<=b.last;
  const done=S.log.filter(a=>a.done&&inM(a));
  const elapsed=Math.max(1,daysElapsedInMonth(iso));
  // active days
  const activeSet={};done.forEach(a=>activeSet[a.date]=1);
  Object.keys(S.steps||{}).forEach(d=>{if(d>=b.first&&d<=b.last&&parseInt(S.steps[d])>0)activeSet[d]=1;});
  const activeDays=Object.keys(activeSet).length;
  // totals
  let weight=0;done.filter(a=>a.group==='strength'&&a.fields.ex).forEach(a=>Object.values(a.fields.ex).forEach(ex=>{if(!ex||ex.chosen===false||!ex.sets)return;ex.sets.forEach(s=>{const w=effectiveWeight(S,ex.name,s.weight),r=parseFloat(s.reps);if(!isNaN(w)&&!isNaN(r))weight+=w*r;});}));
  const sumD=(keys)=>{let s=0;done.filter(a=>keys.indexOf(a.defKey)>=0).forEach(a=>{const v=parseFloat(a.fields.distance);if(!isNaN(v))s+=v;});return s;};
  const runKm=sumD(['run']),walkKm=sumD(['walk']),golfKm=sumD(['golf']);
  let steps=0;Object.keys(S.steps||{}).forEach(d=>{if(d>=b.first&&d<=b.last){const v=parseInt(String(S.steps[d]).replace(/,/g,''));if(!isNaN(v))steps+=v;}});
  // counts by type
  const counts={};done.forEach(a=>{const k=a.group==='strength'?'gym':a.defKey;counts[k]=(counts[k]||0)+1;});
  // streaks within month
  let longest=0,cur2=0;const bd=[];for(let dd=1;dd<=daysElapsedInMonth(iso);dd++){bd.push(isoOf(new Date(b.y,b.m,dd)));}
  bd.forEach(d=>{if(activeSet[d]){cur2++;if(cur2>longest)longest=cur2;}else cur2=0;});
  // strength volume per training day + cardio pace@HR
  const gymDays=done.filter(a=>a.group==='strength').length||0;
  const volPerTrain=gymDays?weight/gymDays:0;
  // cardio: avg (pace/HR) — lower pace and lower HR both good; use pace normalised by HR
  const runs=done.filter(a=>a.defKey==='run');
  let paceHR=null,n=0,acc=0;runs.forEach(a=>{const d=parseFloat(a.fields.distance),t=parseFloat(a.fields.time),h=parseFloat(a.fields.avgHR);if(d>0&&t>0&&h>0){acc+=(t/d)/h*100;n++;}});
  if(n)paceHR=acc/n; // lower = fitter (less time per km per HR)
  return {b:b,elapsed:elapsed,activeDays:activeDays,weight:weight,runKm:runKm,walkKm:walkKm,golfKm:golfKm,steps:steps,counts:counts,longest:longest,activeSet:activeSet,volPerTrain:volPerTrain,paceHR:paceHR,gymDays:gymDays};
}
function trajArrow(cur,base,goodIsUp){
  if(cur==null||base==null||base===0)return {a:'\u2192',c:'#a3a3a3',t:'flat'};
  const chg=(cur-base)/base;
  const better=goodIsUp?chg>0.03:chg<-0.03;
  const worse=goodIsUp?chg<-0.03:chg>0.03;
  if(better)return {a:'\u2191',c:'#4ade80',t:'up'};
  if(worse)return {a:'\u2193',c:'#f87171',t:'down'};
  return {a:'\u2192',c:'#a3a3a3',t:'flat'};
}

function mkMonth(){
  const wrap=el('div');wrap.style.paddingBottom='2rem';
  const cur=parseISO(S.cursor);
  const prevM=isoOf(new Date(cur.getFullYear(),cur.getMonth()-1,15));
  const nextM=isoOf(new Date(cur.getFullYear(),cur.getMonth()+1,15));
  const nav=el('div','daynav');
  const pv=el('button','arrow','\u2039');pv.onclick=()=>{S.cursor=prevM;save();render();};
  const nx=el('button','arrow','\u203a');nx.onclick=()=>{S.cursor=nextM;save();render();};
  const dc=el('div','dc');dc.innerHTML='<div class="d1">'+monthName(cur)+'</div><div class="d2 mf">MONTHLY DASHBOARD</div>';
  nav.append(pv,dc,nx);wrap.appendChild(nav);

  const st=monthStats(S,S.cursor);
  const perDay=(v)=>v/st.elapsed;
  // comparison: last month + last-3-month avg
  const prevStats=monthStats(S,prevM);
  const l3=[1,2,3].map(k=>monthStats(S,isoOf(new Date(cur.getFullYear(),cur.getMonth()-k,15))));
  const avg3=(sel)=>{const v=l3.map(sel).filter(x=>!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;};

  // ---- headline ----
  wrap.appendChild(mkSH('This month','#fb923c'));
  const hrow=el('div','pstat-row');
  hrow.appendChild(mkStatCard('DAYS ACTIVE',st.activeDays+'/'+st.elapsed,Math.round(st.activeDays/st.elapsed*100)+'%','#4ade80'));
  hrow.appendChild(mkStatCard('LONGEST STREAK',st.longest,'days','#fb923c'));
  hrow.appendChild(mkStatCard('SESSIONS',Object.values(st.counts).reduce((a,b)=>a+b,0),'logged','#60a5fa'));
  wrap.appendChild(hrow);

  // ---- calendar heatmap ----
  wrap.appendChild(mkSH('Activity calendar','#4ade80'));
  const cal=el('div','calheat');
  const firstDow=(new Date(st.b.y,st.b.m,1).getDay()+6)%7; // Mon=0
  for(let i=0;i<firstDow;i++){cal.appendChild(el('div','cal-cell cal-empty'));}
  for(let dd=1;dd<=st.b.days;dd++){
    const iso=isoOf(new Date(st.b.y,st.b.m,dd));
    const acts=S.log.filter(a=>a.date===iso&&a.done);
    const hasSteps=S.steps&&S.steps[iso]&&parseInt(S.steps[iso])>0;
    const cell=el('div','cal-cell');
    const future=iso>todayISO();
    if(future){cell.className='cal-cell cal-future';}
    else if(acts.length){
      const grp=acts[0].group;const gm=GROUP_META[grp]||GROUP_META.other;
      cell.style.background=gm.color;cell.style.opacity=Math.min(1,0.4+acts.length*0.2);
    } else if(hasSteps){cell.className='cal-cell cal-steps';}
    else {cell.className='cal-cell cal-rest';}
    cell.title=iso;
    cell.onclick=()=>{S.view='today';S.cursor=iso;save();render();};
    cell.innerHTML='<span class="cal-n">'+dd+'</span>';
    cal.appendChild(cell);
  }
  wrap.appendChild(cal);

  // ---- per-day averages + comparisons ----
  wrap.appendChild(mkSH('Daily averages (\u00f7 '+st.elapsed+' days)','#60a5fa'));
  const cmpRow=(emoji,label,curVal,prevVal,a3Val,unit,decimals)=>{
    const fmt=(v)=>decimals?v.toFixed(decimals):Math.round(v).toLocaleString();
    const arrow=trajArrow(curVal,prevVal,true);
    const vs3=trajArrow(curVal,a3Val,true);
    const r=el('div','mrow');
    r.innerHTML='<div class="mr-lbl">'+emoji+' '+label+'</div>'+
      '<div class="mr-val mf">'+fmt(curVal)+unit+'</div>'+
      '<div class="mr-cmp mf"><span style="color:'+arrow.c+'">'+arrow.a+' vs last</span> \u00b7 <span style="color:'+vs3.c+'">'+vs3.a+' vs 3mo</span></div>';
    wrap.appendChild(r);
  };
  cmpRow('\ud83c\udfcb\ufe0f','Weight lifted',perDay(st.weight),perDay(prevStats.weight),avg3(s=>s.weight/s.elapsed)*1,'kg',0);
  cmpRow('\ud83c\udfc3','Run distance',perDay(st.runKm),perDay(prevStats.runKm),avg3(s=>s.runKm/s.elapsed),'km',2);
  cmpRow('\ud83d\udeb6','Walk distance',perDay(st.walkKm),perDay(prevStats.walkKm),avg3(s=>s.walkKm/s.elapsed),'km',2);
  cmpRow('\u26f3','Golf distance',perDay(st.golfKm),perDay(prevStats.golfKm),avg3(s=>s.golfKm/s.elapsed),'km',2);
  cmpRow('\ud83d\udc63','Steps',perDay(st.steps),perDay(prevStats.steps),avg3(s=>s.steps/s.elapsed),'',0);

  // ---- per-activity counts ----
  wrap.appendChild(mkSH('Sessions by type','#c084fc'));
  const emojiFor={gym:'\ud83c\udfcb\ufe0f',run:'\ud83c\udfc3',golf:'\u26f3',walk:'\ud83d\udeb6',yoga:'\ud83e\uddd8',pushups:'\ud83d\udcaa',squats:'\ud83e\uddb5',plank:'\ud83e\uddd8',rest:'\ud83d\ude34',rowing:'\ud83d\udea3',swim:'\ud83c\udfca',cycle:'\ud83d\udeb5',alcohol:'\ud83c\udf77'};
  const cr=el('div');cr.style.cssText='display:flex;flex-wrap:wrap;gap:.4rem;margin:0 1.25rem .6rem';
  Object.keys(st.counts).sort((a,b)=>st.counts[b]-st.counts[a]).forEach(k=>{
    const chip=el('div');chip.style.cssText='padding:.4rem .7rem;border-radius:.5rem;background:var(--s1);border:1px solid var(--line);font-size:.75rem';
    chip.innerHTML=(emojiFor[k]||'\u2b50')+' '+k+' <b style="color:var(--ac)">'+st.counts[k]+'</b>';
    cr.appendChild(chip);
  });
  wrap.appendChild(cr);

  // ---- trajectories ----
  wrap.appendChild(mkSH('Fitness trajectory','#f472b6'));
  // strength: volume per training day, month vs last-3mo avg
  const strBase=avg3(s=>s.volPerTrain)||prevStats.volPerTrain;
  const strTraj=trajArrow(st.volPerTrain,strBase,true);
  const sT=el('div','traj');
  sT.innerHTML='<div class="tj-ico" style="color:'+strTraj.c+'">'+strTraj.a+'</div><div><div class="tj-lbl">\ud83c\udfcb\ufe0f Strength</div><div class="tj-sub mf">'+strTraj.t.toUpperCase()+' \u00b7 '+Math.round(st.volPerTrain).toLocaleString()+'kg/session vs '+Math.round(strBase).toLocaleString()+' baseline</div></div>';
  wrap.appendChild(sT);
  // cardio: paceHR lower is better -> goodIsUp=false
  const carBase=avg3(s=>s.paceHR).toFixed?avg3(s=>s.paceHR):null;
  const carTraj=trajArrow(st.paceHR,carBase||prevStats.paceHR,false);
  const cT=el('div','traj');
  const carTxt=st.paceHR?('efficiency '+st.paceHR.toFixed(1)+' (lower=fitter)'):'need HR + pace data';
  cT.innerHTML='<div class="tj-ico" style="color:'+carTraj.c+'">'+carTraj.a+'</div><div><div class="tj-lbl">\ud83c\udfc3 Cardio fitness</div><div class="tj-sub mf">'+carTraj.t.toUpperCase()+' \u00b7 '+carTxt+'</div></div>';
  wrap.appendChild(cT);

  // ---- insights ----
  wrap.appendChild(mkSH('Insights','#fbbf24'));
  const ins=[];
  ins.push('Trained '+st.activeDays+' of '+st.elapsed+' days ('+Math.round(st.activeDays/st.elapsed*100)+'%).');
  if(st.longest>=5)ins.push('\ud83d\udd25 Longest streak this month: '+st.longest+' days.');
  // biggest lift
  let bl=null;S.log.filter(a=>a.done&&a.group==='strength'&&a.date>=st.b.first&&a.date<=st.b.last&&a.fields.ex).forEach(a=>Object.values(a.fields.ex).forEach(ex=>{if(!ex||!ex.sets)return;ex.sets.forEach(s=>{const w=effectiveWeight(S,ex.name,s.weight);if(!isNaN(w)&&(!bl||w>bl.w))bl={w:w,n:ex.name};});}));
  if(bl)ins.push('Heaviest lift: '+bl.n+' at '+bl.w+'kg.');
  // best step day
  let bs=null;Object.keys(S.steps||{}).forEach(d=>{if(d>=st.b.first&&d<=st.b.last){const v=parseInt(String(S.steps[d]).replace(/,/g,''));if(!isNaN(v)&&(!bs||v>bs.v))bs={v:v,d:d};}});
  if(bs)ins.push('Best step day: '+bs.v.toLocaleString()+' on '+fmtShort(bs.d)+'.');
  if(strTraj.t==='up')ins.push('\ud83d\udcaa Strength trending up vs your recent baseline.');
  if(carTraj.t==='up')ins.push('\ud83c\udfc3 Cardio fitness improving \u2014 faster for the same effort.');
  ins.forEach(t=>{const p=el('div','nc-line');p.style.margin='0 1.25rem .4rem';p.textContent='\u2022 '+t;wrap.appendChild(p);});

  return wrap;
}

function monthName(d){return ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear();}

/* ===== SETUP ===== */
function mkSetup(){
  const wrap=el('div');wrap.style.cssText='padding:3rem 1.5rem';
  wrap.innerHTML='<div class="eyebrow mf" style="color:var(--t3);letter-spacing:.25em">WELCOME TO</div><h1 class="sf" style="font-size:2.6rem;margin:.3rem 0 1.5rem">PHY<span style="font-style:italic;color:var(--ac)"> log</span></h1><p style="color:var(--t2);font-size:.875rem;line-height:1.7;margin-bottom:1.5rem">One card per day. Pick activities from a menu — they arrive pre-filled with last time&rsquo;s numbers and dates, you nudge them up and tick them done.</p>';
  const lbl=el('div','flbl mf','YOUR NAME');lbl.style.marginBottom='.4rem';const inp=el('input');inp.type='text';inp.placeholder='e.g. Amit';inp.style.cssText='width:100%;font-size:16px;padding:.7rem';
  const btn=el('button');btn.style.cssText='width:100%;margin-top:1rem;padding:.9rem;border-radius:.7rem;background:var(--ac);color:#0a0a0a;font-weight:700;font-size:.9375rem';btn.textContent='Start logging';btn.onclick=()=>{S.user=inp.value.trim()||'You';saveNow();render();};
  wrap.append(lbl,inp,btn);return wrap;
}

function render(){
  const app=document.getElementById('app');app.innerHTML='';
  if(!S.user){app.appendChild(mkSetup());return;}
  app.appendChild(mkHeader());app.appendChild(mkLinks());
  let v;try{if(S.view==='week')v=mkWeek();else if(S.view==='month')v=mkMonth();else if(S.view==='progress')v=mkProgress();else if(S.view==='nutrition')v=mkNutrition();else v=mkToday();}catch(e){v=el('div','empty','Render error: '+e.message);}
  app.appendChild(v);
  try{window.scrollTo(0,0);}catch(e){}
}
load();
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('reduce');
render();
