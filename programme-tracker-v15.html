<html lang="en">

<style>
:root{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--t1:#e5e5e5;--t2:#a3a3a3;--t3:#525252;--ac:#fb923c;--line:#262626}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{max-width:640px;margin:0 auto;padding-bottom:6rem;min-height:100vh}
.mf{font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace}
.sf{font-family:Georgia,'Times New Roman',serif}
input,textarea,button,select{font-family:inherit;color:inherit}
input,textarea{background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.45rem;padding:.45rem;
  font-size:16px;color:var(--t1);outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
button{cursor:pointer;border:none;background:none}

/* header */
.hd{padding:1.4rem 1.25rem .5rem}
.hd .eyebrow{font-size:.5625rem;letter-spacing:.25em;color:var(--t3);text-transform:uppercase}
.hd h1{font-size:2.4rem;font-weight:400;line-height:1;margin:.15rem 0 .35rem}
.hd h1 .em{font-style:italic;color:var(--ac)}
.hd .drange{font-size:.8125rem;color:var(--ac);letter-spacing:.04em}

/* view links */
.vlinks{display:flex;gap:.9rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.vlink{font-size:.9375rem;letter-spacing:.02em;color:var(--t3);padding-bottom:.4rem;position:relative;font-weight:500}
.vlink.on{color:var(--t1)}
.vlink.on:after{content:'';position:absolute;left:0;right:0;bottom:-.76rem;height:2px;background:var(--ac)}

/* daynav */
.daynav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem .4rem}
.daynav .arrow{width:2rem;height:2rem;border-radius:50%;background:var(--s1);border:1px solid var(--line);
  color:var(--t2);font-size:1rem;display:flex;align-items:center;justify-content:center}
.daynav .dc{text-align:center}
.daynav .dc .d1{font-size:.9375rem;color:var(--t1)}
.daynav .dc .d2{font-size:.5625rem;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-top:.1rem}
.dateoverlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;background:transparent;-webkit-appearance:none;cursor:pointer}

/* section heading */
.sh{display:flex;align-items:center;gap:.5rem;margin:1.1rem 1.25rem .5rem}
.sh .bar{width:.2rem;height:.95rem;border-radius:1rem}
.sh .t{font-size:.5625rem;letter-spacing:.16em;text-transform:uppercase}

/* activity card */
.acard{margin:0 1.25rem .625rem;border-radius:.85rem;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.acard.done{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.05)}
.ahd{display:flex;align-items:center;gap:.7rem;padding:.85rem .95rem}
.aico{width:2.1rem;height:2.1rem;border-radius:.55rem;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ameta{flex:1;min-width:0}
.agrp{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase}
.aname{font-size:.9375rem;color:var(--t1);margin-top:.1rem;line-height:1.25}
.atick{width:1.6rem;height:1.6rem;border-radius:.45rem;border:1.5px solid #3d3d3d;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.atick.on{background:#4ade80;border-color:#4ade80}
.abody{padding:0 .95rem .95rem;border-top:1px solid var(--line)}
.hint{font-size:.625rem;color:#4ade80;line-height:1.5;margin:.6rem 0 .4rem;padding:.4rem .55rem;background:rgba(74,222,128,.07);border-radius:.4rem}
.prev-tag{font-size:.5rem;color:var(--t3);letter-spacing:.05em}

/* strength ex rows */
.exrow{margin-top:.6rem}
.exname{font-size:.75rem;color:var(--t2);margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center}
.setline{display:flex;gap:.35rem;align-items:center;margin-bottom:.3rem}
.setline .sn{font-size:.5rem;color:var(--t3);width:2.2rem;flex-shrink:0}
.setline input{width:100%;text-align:center;font-size:.8125rem}
.setline .u{font-size:.5rem;color:var(--t3);flex-shrink:0}
.prevmini{font-size:.5rem;color:var(--t3);margin-left:.3rem}
.addset{font-size:.625rem;color:var(--ac);padding:.3rem 0;margin-top:.1rem}

/* generic field grid */
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35rem;margin-top:.55rem}
.fgrid .fld{min-width:0}
.fgrid .flbl{font-size:.4375rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid input{padding:.4rem .2rem;font-size:.8125rem;min-width:0;width:100%}
.fld{display:flex;flex-direction:column;gap:.2rem}
.flbl{font-size:.5rem;color:var(--t3);letter-spacing:.05em}
.fld input{text-align:center;font-size:.8125rem}
.pace{font-size:.625rem;color:var(--ac);margin-top:.45rem}
.notes-in{width:100%;margin-top:.55rem;resize:vertical;font-size:.8125rem;min-height:2.4rem}

/* add activity */
.addbtn{margin:.4rem 1.25rem 1.5rem;width:calc(100% - 2.5rem);padding:.9rem;border-radius:.75rem;
  border:1px dashed #3d3d3d;color:var(--t2);font-size:.8125rem;letter-spacing:.05em;background:rgba(23,23,23,.3)}
.empty{margin:1.5rem 1.25rem;text-align:center;color:var(--t3);font-size:.8125rem;line-height:1.7}

/* menu sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82vh;overflow-y:auto;background:#141414;border-top-left-radius:1.2rem;
  border-top-right-radius:1.2rem;border-top:1px solid var(--line);padding:1rem 0 2rem}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem .75rem}
.sheet-hd .st{font-size:1rem;color:var(--t1)}
.sheet-hd .sx{font-size:1.3rem;color:var(--t3);padding:.2rem .5rem}
.mgroup{margin:.5rem 0}
.mglabel{font-size:.5625rem;letter-spacing:.14em;text-transform:uppercase;padding:.4rem 1.25rem;color:var(--t3)}
.mitem{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.25rem}
.mitem:active{background:rgba(255,255,255,.03)}
.mitem .mi-ico{width:1.8rem;height:1.8rem;border-radius:.45rem;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.mitem .mi-name{font-size:.875rem;color:var(--t1)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;z-index:99;padding:.75rem 1rem;
  border-radius:.65rem;background:rgba(74,222,128,.16);border:1px solid rgba(74,222,128,.45);color:#4ade80;
  font-size:.6875rem;letter-spacing:.03em;max-width:88vw;text-align:center}

/* week/month list */
.dayblock{margin:0 1.25rem .5rem;border-radius:.7rem;border:1px solid var(--line);background:var(--s1);overflow:hidden}
.dayblock-hd{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem}
.dayblock-hd:active{background:rgba(255,255,255,.02)}
.db-date{font-size:.8125rem;color:var(--t1)}
.db-date.today{color:var(--ac)}
.db-count{font-size:.625rem;color:var(--t3)}
.db-dots{display:flex;gap:.25rem}
.db-dot{width:.5rem;height:.5rem;border-radius:50%}
.mini-act{padding:.5rem .9rem;border-top:1px solid var(--line);font-size:.75rem;color:var(--t2);display:flex;justify-content:space-between;gap:.5rem}
.mini-act .ma-done{color:#4ade80}

.fabwrap{position:fixed;bottom:0;left:0;right:0;z-index:40;background:linear-gradient(transparent,var(--bg) 40%);
  padding:1.5rem 1.25rem 1.5rem;display:flex;justify-content:center;pointer-events:none}
.reduce *{transition:none!important;animation:none!important}

.exbox{width:1.15rem;height:1.15rem;border-radius:.3rem;border:1.5px solid #3d3d3d;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#0a0a0a;flex-shrink:0}
.exbox.on{background:var(--ac);border-color:var(--ac)}
.exlast{font-size:.5rem;color:var(--t3);flex-shrink:0;letter-spacing:.03em}
.runchip{padding:.4rem .8rem;border-radius:.5rem;background:var(--s2);border:1px solid #333;font-size:.75rem;color:var(--t2)}
.runchip.on{background:rgba(96,165,250,.16);border-color:rgba(96,165,250,.45);color:#60a5fa}
.miniarrow{width:1.7rem;height:1.7rem;border-radius:.4rem;background:var(--s2);border:1px solid #333;color:var(--t2);font-size:.85rem}

.ex-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.35rem 0 .3rem;
  padding:.35rem .5rem;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.28);border-radius:.4rem}
.ex-top .et-date{font-size:.5625rem;color:#fbbf24;letter-spacing:.03em;flex:1;min-width:0}
.ex-yt{display:inline-flex;align-items:center;gap:.25rem;font-size:.5625rem;color:#fbbf24;
  border:1px solid rgba(251,191,36,.4);border-radius:.35rem;padding:.2rem .45rem;white-space:nowrap;text-decoration:none}
.ex-memo{width:100%;margin-top:.4rem;padding:.4rem .5rem;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);border-radius:.4rem;font-size:.75rem;color:#fff}
.ex-memo::placeholder{color:rgba(255,255,255,.35)}

.setdel{width:1.5rem;height:1.5rem;border-radius:.35rem;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171;font-size:.9rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.carddel{width:1.6rem;height:1.6rem;border-radius:.4rem;background:transparent;border:1px solid #2d2d2d;color:var(--t3);font-size:1.1rem;flex-shrink:0;margin-left:.4rem;display:flex;align-items:center;justify-content:center}

.steps-strip{margin:1.25rem 1.25rem 1rem;padding:1rem 1.1rem;border-radius:.9rem;
  background:rgba(96,165,250,.12);border:1.5px solid rgba(96,165,250,.4)}
.steps-strip.hit{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.5)}
.ss-top{cursor:pointer;display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.ss-ico{font-size:1.4rem}
.ss-lbl{font-size:.75rem;letter-spacing:.14em;color:#93c5fd;flex:1}
.steps-strip.hit .ss-lbl{color:#86efac}
.ss-tgt{font-size:.9375rem;color:#dbeafe;font-weight:600}
.steps-strip.hit .ss-tgt{color:#bbf7d0}
.ss-inp{width:100%;background:rgba(10,10,10,.5);border:1px solid rgba(96,165,250,.3);border-radius:.5rem;
  padding:.7rem;font-size:1.1rem;color:#fff;text-align:center;font-family:'JetBrains Mono',monospace}
.ss-inp:focus{border-color:#60a5fa}
.ss-bar{height:.4rem;background:rgba(10,10,10,.5);border-radius:1rem;margin-top:.6rem;overflow:hidden}
.ss-fill{height:100%;border-radius:1rem;transition:width .3s}

.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.55rem}
.fgrid2 .fld{min-width:0}
.fgrid2 .flbl{font-size:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid2 input{padding:.5rem .3rem;font-size:.875rem;width:100%;min-width:0;text-align:center}

.pstat-row{display:flex;gap:.5rem;margin:0 1.25rem .5rem}
.pstat{flex:1;padding:.8rem .5rem;border-radius:.7rem;background:var(--s1);border:1px solid var(--line);text-align:center}
.ps-val{font-size:1.6rem;font-weight:700;line-height:1}
.ps-lbl{font-size:.5rem;letter-spacing:.1em;color:var(--t3);margin-top:.3rem}
.ps-sub{font-size:.5rem;color:var(--t3);margin-top:.15rem}
.pflag{margin:.5rem 1.25rem;padding:.6rem .75rem;border-radius:.6rem;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);font-size:.6875rem;color:#fdba74;line-height:1.5}
.pgoal{margin:0 1.25rem .6rem}
.pg-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.3rem}
.pg-lbl{font-size:.8125rem;color:var(--t1)}
.pg-num{font-size:.6875rem;color:var(--t2)}
.pg-bar{height:.5rem;background:var(--s2);border-radius:1rem;overflow:hidden}
.pg-fill{height:100%;background:#4ade80;border-radius:1rem;transition:width .4s}
.pg-pct{font-size:.5625rem;color:#4ade80;margin-top:.2rem}
.pchart{margin:0 1.25rem 1rem;padding:.75rem;border-radius:.7rem;background:var(--s1);border:1px solid var(--line);text-align:center}
.pc-lbl{font-size:.5625rem;letter-spacing:.1em;color:var(--t3);margin-bottom:.4rem;text-align:left}
.pbest{margin:0 1.25rem .4rem;padding:.6rem .8rem;border-radius:.6rem;background:var(--s1);border:1px solid var(--line)}
.pb-name{font-size:.8125rem;color:var(--t1)}
.pb-val{font-size:.625rem;color:var(--t2);margin-top:.15rem}
.pbtn{width:calc(100% - 2.5rem);margin:.4rem 1.25rem;padding:.85rem;border-radius:.7rem;background:var(--s1);border:1px solid var(--line);color:var(--t1);font-size:.8125rem;font-weight:600}

.gymsel{display:flex;align-items:center;gap:.4rem;margin:.3rem 0 .6rem}
.gymsel-lbl{font-size:.5625rem;letter-spacing:.1em;color:var(--t3);margin-right:.2rem}
.gymchip{padding:.35rem .7rem;border-radius:.5rem;background:var(--s2);border:1px solid #333;font-size:.6875rem;color:var(--t2)}
.gymchip.on{background:rgba(251,146,60,.16);border-color:rgba(251,146,60,.5);color:var(--ac);font-weight:600}
.ex-ref{font-size:.5rem;color:var(--t3);margin:.15rem 0 .3rem;padding:.2rem .45rem;background:rgba(255,255,255,.03);border-radius:.35rem;border:1px dashed #333}

.ptot{display:flex;align-items:center;margin:0 1.25rem .4rem;padding:.6rem .8rem;border-radius:.6rem;background:var(--s1);border:1px solid var(--line)}
.pt-lbl{flex:1;font-size:.8125rem;color:var(--t1)}
.pt-val{font-size:.9375rem;color:#60a5fa;font-weight:600;margin-right:.6rem}
.pt-avg{font-size:.625rem;color:var(--t3)}

.rangechip{flex:1;padding:.4rem;border-radius:.5rem;background:var(--s1);border:1px solid var(--line);color:var(--t2);font-size:.6875rem;font-family:'JetBrains Mono',monospace}
.rangechip.on{background:rgba(251,146,60,.16);border-color:rgba(251,146,60,.5);color:var(--ac);font-weight:600}

.setdone{width:1.3rem;height:1.3rem;border-radius:50%;border:1.5px solid #3d3d3d;background:transparent;color:#0a0a0a;font-size:.7rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.setdone.on{background:#4ade80;border-color:#4ade80}

.nutgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem;margin:0 1.25rem .6rem}
.nutfld{background:var(--s1);border:1px solid var(--line);border-radius:.55rem;padding:.5rem}
.nutfld input{width:100%;background:transparent;border:none;color:var(--t1);font-size:1rem;text-align:center;outline:none}
.nutalc{color:#c084fc;text-align:center;padding-top:.2rem}
.drinkpick{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 1.25rem .4rem}
.drinkchip{display:flex;align-items:center;gap:.35rem;padding:.4rem .5rem;border-radius:.6rem;background:var(--s1);border:1px solid var(--line);position:relative}
.drinkchip.on{background:rgba(192,132,252,.15);border-color:rgba(192,132,252,.5)}
.dc-emoji{font-size:1rem}
.dc-name{font-size:.6875rem;color:var(--t1)}
.dc-cnt{font-size:.6875rem;color:#c084fc;min-width:1rem}
.dc-minus{width:1.2rem;height:1.2rem;border-radius:50%;background:var(--s2);border:1px solid #444;color:var(--t2);font-size:.8rem;line-height:1;padding:0}
.nutcard{margin:0 1.25rem .6rem;padding:.8rem .9rem;border-radius:.7rem;background:var(--s1);border:1px solid var(--line)}
.nc-title{font-size:.9375rem;font-weight:600;color:var(--t1);margin-bottom:.5rem}
.nc-line{font-size:.75rem;color:var(--t2);line-height:1.55;margin-bottom:.4rem}
.nc-line b{color:var(--t1)}

.calheat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 1.25rem 1rem}
.cal-cell{aspect-ratio:1;border-radius:.3rem;background:var(--s2);display:flex;align-items:flex-start;justify-content:flex-end;padding:2px;position:relative}
.cal-n{font-size:.5rem;color:rgba(255,255,255,.5);font-family:'JetBrains Mono',monospace}
.cal-empty{background:transparent}
.cal-rest{background:#1a1a1a}
.cal-steps{background:#1e3a2e}
.cal-future{background:#141414;opacity:.4}
.mrow{display:flex;align-items:center;margin:0 1.25rem .4rem;padding:.55rem .7rem;border-radius:.55rem;background:var(--s1);border:1px solid var(--line)}
.mr-lbl{flex:1;font-size:.75rem;color:var(--t1)}
.mr-val{font-size:.9rem;color:var(--ac);font-weight:600;margin-right:.5rem;min-width:4rem;text-align:right}
.mr-cmp{font-size:.5rem;color:var(--t3);min-width:6.5rem;text-align:right}
.traj{display:flex;align-items:center;gap:.7rem;margin:0 1.25rem .5rem;padding:.7rem .9rem;border-radius:.6rem;background:var(--s1);border:1px solid var(--line)}
.tj-ico{font-size:1.6rem;font-weight:700;line-height:1}
.tj-lbl{font-size:.85rem;color:var(--t1)}
.tj-sub{font-size:.6rem;color:var(--t3);margin-top:.15rem}

.drinkstrip{margin:.6rem 1.25rem 0;padding:.75rem .9rem;border-radius:.8rem;background:rgba(192,132,252,.06);border:1px solid rgba(192,132,252,.25)}
.ds-hd{display:flex;justify-content:space-between;align-items:baseline}
.ds-title{font-size:.6875rem;letter-spacing:.1em;color:#c084fc}
.ds-sum{font-size:.75rem;color:#c084fc}
.drinkstrip .drinkpick{padding:0}

.upflag{background:transparent;border:1px solid #3d3d3d;border-radius:.4rem;padding:.15rem .35rem;font-size:.7rem;color:var(--t3);line-height:1;opacity:.6}
.upflag.on{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.12);opacity:1}

.gearbtn{position:absolute;top:.2rem;right:0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:.6rem;font-size:1.3rem;padding:.4rem .55rem;cursor:pointer;z-index:5}
.setgroup{margin:.3rem 0 .8rem}
.set-gtitle{font-size:.625rem;letter-spacing:.12em;color:var(--ac);margin:.6rem 1.25rem .4rem}
.setfld{display:flex;align-items:center;margin:0 1.25rem .35rem;gap:.6rem}
.set-lbl{flex:1;font-size:.8125rem;color:var(--t1)}
.set-inwrap{display:flex;align-items:center;gap:.3rem;background:var(--s1);border:1px solid var(--line);border-radius:.5rem;padding:.35rem .5rem}
.set-inwrap input{width:4.5rem;background:transparent;border:none;color:var(--t1);font-size:.875rem;text-align:right;outline:none}
.set-unit{font-size:.625rem;color:var(--t3);min-width:2rem}
</style>
</head>
<body>
<div id="app"></div>
<script>

/* ===== PHY2 CORE v2 — single activity log ===== */
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const DEFAULT_START=(()=>{const d=new Date();d.setHours(0,0,0,0);const off=(d.getDay()===0?6:d.getDay()-1);d.setDate(d.getDate()-off);return isoOf(d);})();
function todayISO(){return isoOf(new Date());}
function parseISO(s){return new Date(s+'T00:00:00');}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtNice(iso){const d=parseISO(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
function fmtShort(iso){const d=parseISO(iso);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function daysAgoLabel(iso,ref){const n=daysBetween(iso,ref||todayISO());if(n<=0)return'today';if(n===1)return'yesterday';return n+' days ago';}
function weekOf(iso){const d=parseISO(iso);const off=(d.getDay()===0?6:d.getDay()-1);d.setDate(d.getDate()-off);return isoOf(d);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return isoOf(d);}
function weekDates(m){return Array.from({length:7},(_,i)=>addDays(m,i));}
function monthDates(iso){const d=parseISO(iso);const y=d.getFullYear(),m=d.getMonth();const n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>isoOf(new Date(y,m,i+1)));}
function stepTarget(iso){const d=parseISO(iso).getDay();return (d===0||d===6)?TGT().stepsWeekend:TGT().stepsWeekday;}
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function drinkDef(k){return DRINKS.find(d=>d.key===k);}
function drinksUnits(drinks){let u=0;if(drinks)Object.keys(drinks).forEach(k=>{const d=drinkDef(k);if(d)u+=d.units*(drinks[k]||0);});return Math.round(u*10)/10;}
function drinksKcal(drinks){let c=0;if(drinks)Object.keys(drinks).forEach(k=>{const d=drinkDef(k);if(d)c+=d.kcal*(drinks[k]||0);});return Math.round(c);}
function drinksCount(drinks){let n=0;if(drinks)Object.keys(drinks).forEach(k=>{n+=(drinks[k]||0);});return n;}

/* ===== NUTRITION per-day accessor ===== */
function nutOn(S,iso){return (S.nutrition&&S.nutrition[iso])||null;}
function ensureNut(S,iso){if(!S.nutrition)S.nutrition={};if(!S.nutrition[iso])S.nutrition[iso]={protein:'',fat:'',carbs:'',fibre:'',calories:'',drinks:{}};return S.nutrition[iso];}
function activitiesOn(S,iso){return S.log.filter(a=>a.date===iso);}
function lastActivity(S,defKey,beforeIso){
  const past=S.log.filter(a=>a.defKey===defKey&&a.date<=beforeIso&&a.done);
  past.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  return past[0]||null;
}
// last time a specific exercise (by name) was done in any session of this defKey
function GYMS(){return ['UK','CH','Other'];}
function buildStrengthEx(S,defKey,exList,iso,gym){
  const ex={};
  exList.forEach((n,i)=>{
    const le=lastExercise(S,defKey,n,addDays(iso,-1),gym);          // this gym
    // reference: most recent at a DIFFERENT gym
    let ref=null;
    GYMS().forEach(g=>{if(g!==gym){const r=lastExercise(S,defKey,n,addDays(iso,-1),g);if(r&&(!ref||r.date>ref.date))ref={gym:g,date:r.date,ex:r.ex};}});
    ex[i]={
      name:n,
      chosen:le?true:false,
      sets:le&&le.ex.sets?le.ex.sets.map(function(s){return {weight:s.weight||'',reps:s.reps||''};}):[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}],
      lastDate:le?le.date:null,
      memo:le&&le.ex.memo?le.ex.memo:'',
      progressHint:le&&le.ex.progress?true:false,
      progress:false,
      refGym:ref?ref.gym:null,
      refSets:ref?ref.ex.sets:null,
      refDate:ref?ref.date:null
    };
  });
  return ex;
}
function lastExercise(S,defKey,exName,beforeIso,gym){
  const past=S.log.filter(a=>a.defKey===defKey&&a.date<=beforeIso&&a.done&&a.fields.ex&&(gym==null||a.fields.gym===gym));
  past.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  for(const a of past){
    const keys=Object.keys(a.fields.ex);
    for(const k of keys){const ex=a.fields.ex[k];if(ex&&ex.name===exName&&(ex.chosen!==false)){return{date:a.date,ex:ex,gym:a.fields.gym||null};}}
  }
  return null;
}
function defByKey(S,key){return (S.menu||[]).find(m=>m.key===key)||DEFAULT_MENU.find(m=>m.key===key);}

function makeActivity(S,defKey,iso){
  const def=defByKey(S,defKey);if(!def)return null;
  const prev=lastActivity(S,defKey,addDays(iso,-1));
  const a={id:uid(),date:iso,defKey:defKey,name:def.name,group:def.group,done:false,notes:'',fields:{}};

  if(def.group==='strength'){
    const exList=def.ex&&def.ex.length?def.ex:['Exercise 1'];
    // gym location: default to most recent gym used for this programme, else 'UK'
    const lastAny=lastActivity(S,defKey,addDays(iso,-1));
    a.fields.gym=(lastAny&&lastAny.fields&&lastAny.fields.gym)||'UK';
    a.fields.ex=buildStrengthEx(S,defKey,exList,iso,a.fields.gym);
  } else if(def.group==='bodyweight'){
    if(def.single){
      a.fields.single=def.single; // 'reps' or 'hold'
      a.fields.value=prev?prev.fields.value||'':'';
      a.fields.sets=prev?prev.fields.sets||'':'';
    } else if(def.ex){
      a.fields.ex={};
      def.ex.forEach((n,i)=>{
        const le=lastExercise(S,defKey,n,addDays(iso,-1));
        a.fields.ex[i]={name:n,chosen:true,reps:le&&le.ex.reps?le.ex.reps:'',lastDate:le?le.date:null};
      });
    }
  } else if(def.group==='cardio'){
    if(def.runProg){
      const wk=S.runWeek||1;
      a.fields.runWeek=wk;
      a.fields.session=0; // which of the 3 sessions
      a.fields.segments=[]; // filled when session chosen in UI
      a.fields.distance='';a.fields.time='';a.fields.avgHR='';
    } else {
      // Open-ended cardio (golf/walk/swim/rowing/cross-trainer/cycling): always blank, no progression pre-fill
      a.fields.distance='';a.fields.time='';a.fields.avgHR='';
    }
    a._prevDate=prev?prev.date:null;
  } else if(def.group==='body'){
    // circumferences stored as INCHES; weight/fat/muscle/bone/visceral as-is
    const F=['weight','bodyFat','muscle','bone','visceral','waist','chest','hips','armL','armR','thighL','thighR'];
    F.forEach(k=>{a.fields[k]='';}); // blank — each measurement is a fresh reading, never inherit previous
    a._prevDate=prev?prev.date:null;
    a._prevFields=prev?prev.fields:null;
  } else {
    a.fields.duration=prev?prev.fields.duration||'':'';
    a._prevDate=prev?prev.date:null;
  }
  a._prev=prev?{date:prev.date}:null;
  return a;
}

function progressionHint(S,a,ref){
  ref=ref||a.date;
  if(!a._prev&&!a._prevDate)return 'First time logged — set a comfortable baseline.';
  const pd=a._prev?a._prev.date:a._prevDate;
  const ago=daysAgoLabel(pd,ref);
  const g=a.group;
  if(g==='strength')return 'Last done '+fmtNice(pd)+' · '+ago+'. If reps felt controlled, add ~2.5 kg on one lift — else repeat and own the form.';
  if(g==='bodyweight')return 'Last done '+fmtNice(pd)+' · '+ago+'. Aim for 1–2 more reps, or hold 5s longer.';
  if(g==='cardio')return 'Last done '+fmtNice(pd)+' · '+ago+'. Nudge distance or pace slightly — not both.';
  return 'Last done '+fmtNice(pd)+' · '+ago+'.';
}

// group month activities by defKey
function monthByActivity(S,cursorIso){
  const days=monthDates(cursorIso);
  const map={};
  days.forEach(iso=>{
    activitiesOn(S,iso).forEach(a=>{
      const k=a.defKey;
      if(!map[k])map[k]={defKey:k,name:a.name,group:a.group,dates:[],doneCount:0};
      map[k].dates.push(iso);
      if(a.done)map[k].doneCount++;
    });
  });
  return Object.values(map).sort((x,y)=>{
    const go=GROUP_ORDER.indexOf(x.group)-GROUP_ORDER.indexOf(y.group);
    if(go!==0)return go;
    return y.dates.length-x.dates.length;
  });
}

/* Import from v1 (prgm-v2-*) into v5 activity-log shape */
function scanV1Users(){
  const users=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('prgm-v2')===0&&k!=='prgm-v2-users')users.push(k);
  }
  return users;
}
function v1DayOffset(day){return ['mon','tue','wed','thu','fri','sat','sun'].indexOf(day);}
function v1MondayOf(progStart){
  const d=new Date((progStart||'2026-05-11')+'T00:00:00');
  const off=(d.getDay()===0?6:d.getDay()-1);d.setDate(d.getDate()-off);return d;
}
function v1DateOf(progStart,week,day){
  const mon=v1MondayOf(progStart);
  mon.setDate(mon.getDate()+week*7+v1DayOffset(day));
  return isoOf(mon);
}

  'gym-a':['Suitcase Squat','Incline Arnold Press','Half-Prone DB Row','Glute Bridge','Neutral Grip Lat Pulldown','One-Arm Cable Lat Raise','KB Swings','Bicep Curl','Face Pulls','McGill Side Plank'],
  'gym-b':['Trap Bar RDL','DB Bench','One-leg Glute Bridge','DB Fly','One-leg Calf Raise','Tricep Pushdown','Facing Cable Bicep Curl','Chin Dip','Bird Dog'],
  'gym-c':['Suitcase Squat','DB Bench','Lat Pulldown','Walking Lunge','Tricep Pushdown','Bicep Curl','Plank','Face Pulls']
};

function importFromV1(rawKey){
  let v1;try{v1=JSON.parse(localStorage.getItem(rawKey));}catch(e){return null;}
  if(!v1)return null;
  const progStart=v1.progStart||'2026-05-11';
  const out={log:[],measurements:[],steps:{}};
  const seen={};

  // 1. completions -> strength/bodyweight/etc activities
  const comps=v1.completions||{};
  Object.keys(comps).forEach(key=>{
    const c=comps[key];if(!c)return;
    const m=key.match(/^w(\d+)-(\w+)$/);if(!m)return;
    const week=parseInt(m[1]),day=m[2];
    const date=v1DateOf(progStart,week,day);
    // determine activity type from overrides or default schedule guess
    const aid=(v1.overrides&&v1.overrides[key])||'gym-a';
    const group=aid.indexOf('gym')===0?'strength':(aid==='yoga'?'flex':(aid==='cardio'||aid==='run'?'cardio':'bodyweight'));
    const a={id:uid(),date:date,defKey:aid,name:aid,group:group,done:!!c.done,notes:c.notes||'',fields:{}};
    if(group==='strength'){
      a.fields.ex={};
      const names=V1_GYM[aid]||[];
      const exs=c.exercises||{};
      Object.keys(exs).forEach(ei=>{
        const e=exs[ei];
        const sets=(e&&e.sets)?e.sets.map(s=>({weight:String(s.weight||''),reps:String(s.reps||'')})):[];
        a.fields.ex[ei]={name:names[ei]||('Exercise '+(parseInt(ei)+1)),chosen:sets.length>0,sets:sets.length?sets:[{weight:'',reps:''}],lastDate:null,memo:''};
      });
    }
    out.log.push(a);
  });

  // 2. measurements (keyed w{week}) -> body activities
  const meas=v1.measurements||{};
  Object.keys(meas).forEach(wk=>{
    const mm=meas[wk];if(!mm)return;
    const week=parseInt(wk.replace('w',''));if(isNaN(week))return;
    const date=mm.date||v1DateOf(progStart,week,'mon');
    const a={id:uid(),date:date,defKey:'body',name:'Body Measurements',group:'body',done:true,notes:'',fields:{
      weight:String(mm.weight||''),bodyFat:String(mm.bodyFat||''),muscle:String(mm.muscleMass||mm.muscle||''),
      bone:String(mm.boneMass||mm.bone||''),visceral:String(mm.visceral||''),
      waist:mm.waist||'',chest:mm.chest||'',hips:mm.hips||'',armL:mm.armL||'',armR:mm.armR||'',thighL:mm.thighL||'',thighR:mm.thighR||''
    }};
    out.measurements.push(a);
  });

  // 3. steps (keyed w{week}-{day})
  const steps=v1.steps||{};
  Object.keys(steps).forEach(key=>{
    const m=key.match(/^w(\d+)-(\w+)$/);if(!m)return;
    const date=v1DateOf(progStart,parseInt(m[1]),m[2]);
    if(steps[key])out.steps[date]=String(steps[key]);
  });

  // 4. runLog -> cardio run activities
  const rl=v1.runLog||{};
  Object.keys(rl).forEach(key=>{
    const e=rl[key];if(!e||!e.done)return;
    const date=e.date||todayISO();
    const a={id:uid(),date:date,defKey:'run',name:'5K→10K Run Programme',group:'cardio',done:true,notes:e.notes||'',
      fields:{runWeek:e.week||1,session:0,distance:String(e.km||''),time:String(e.minutes||e.time||''),avgHR:String(e.hr||''),
        seg:(e.intervals?{reps:String(e.intervals)}:undefined)}};
    out.log.push(a);
  });

  return {
    user:v1.userName||'',heightCm:v1.heightCm||176,progStart:progStart,
    goals:v1.targets?{weight:v1.targets.weight||'',bodyFat:v1.targets.bodyFat||'',muscle:v1.targets.muscle||'',waist:v1.targets.waist||'',targetDate:''}:null,
    log:out.log,measurements:out.measurements,steps:out.steps

/* ===== PROGRESS + GOALS analytics (pure functions) ===== */
function allDone(S){return S.log.filter(a=>a.done);}
function activeDates(S){const set={};allDone(S).forEach(a=>set[a.date]=1);return Object.keys(set).sort();}

function currentStreak(S){
  // consecutive days up to today with >=1 done activity
  const set={};allDone(S).forEach(a=>set[a.date]=1);
  let streak=0;let d=todayISO();
  // allow today to be empty without breaking (count back from yesterday)
  if(!set[d])d=addDays(d,-1);
  while(set[d]){streak++;d=addDays(d,-1);}
  return streak;
}
function weeksActive(S){
  const wk={};allDone(S).forEach(a=>{wk[weekOf(a.date)]=1;});
  return Object.keys(wk).length;
}
function sessionsThisWeek(S,ref){
  const mon=weekOf(ref||todayISO());const dates=weekDates(mon);
  return allDone(S).filter(a=>dates.indexOf(a.date)>=0).length;
}
function activityGaps(S){
  // find gaps >=4 days between active dates
  const ds=activeDates(S);const gaps=[];
  for(let i=1;i<ds.length;i++){const g=daysBetween(ds[i-1],ds[i]);if(g>=4)gaps.push({from:ds[i-1],to:ds[i],days:g});}
  return gaps;
}
function measurementSeries(S,field){
  // returns [{date,value}] sorted, from body measurements
  const pts=[];
  (S.measurements||[]).concat(S.log.filter(a=>a.group==='body')).forEach(a=>{
    const v=parseFloat(a.fields&&a.fields[field]);if(!isNaN(v))pts.push({date:a.date,value:v});
  });
  pts.sort((x,y)=>x.date.localeCompare(y.date));
  return pts;
}
const ASSISTED=['Chin Dip','Kneeling Chin Dip','Assisted Pull-up','Assisted Dip'];
function isAssisted(name){return ASSISTED.some(a=>name&&name.toLowerCase().indexOf(a.toLowerCase())>=0);}
function latestBodyweight(S){
  const ms=(S.measurements||[]).concat(S.log.filter(a=>a.group==='body'));
  let bw=81,best='';
  ms.forEach(a=>{const w=parseFloat(a.fields&&a.fields.weight);if(!isNaN(w)&&a.date>=best){best=a.date;bw=w;}});
  return bw;
}
function effectiveWeight(S,exName,rawW){
  const w=parseFloat(rawW);if(isNaN(w))return NaN;
  if(isAssisted(exName)){const bw=latestBodyweight(S);return Math.max(0,bw-w);}
  return w;
}
function exerciseBests(S){
  // per exercise name: best top-set weight, and est 1RM-ish (weight*reps), latest
  const map={};
  allDone(S).filter(a=>a.group==='strength'&&a.fields.ex).forEach(a=>{
    Object.values(a.fields.ex).forEach(ex=>{
      if(!ex||ex.chosen===false||!ex.sets)return;
      ex.sets.forEach(st=>{
        const w=effectiveWeight(S,ex.name,st.weight),r=parseFloat(st.reps);if(isNaN(w))return;
        const name=ex.name;
        if(!map[name])map[name]={name:name,bestWeight:0,bestVol:0,lastDate:a.date,lastW:w,lastR:r||0};
        if(w>map[name].bestWeight)map[name].bestWeight=w;
        const vol=w*(isNaN(r)?1:r);if(vol>map[name].bestVol)map[name].bestVol=vol;
        if(a.date>=map[name].lastDate){map[name].lastDate=a.date;map[name].lastW=w;map[name].lastR=r||0;}
      });
    });
  });
  return Object.values(map).sort((a,b)=>b.lastDate.localeCompare(a.lastDate));
}
function runBests(S){
  const runs=allDone(S).filter(a=>a.group==='cardio'&&a.defKey==='run');
  let longest=0,fastest=null,total=0,count=runs.length;
  runs.forEach(a=>{
    const d=parseFloat(a.fields.distance),t=parseFloat(a.fields.time);
    if(!isNaN(d)){if(d>longest)longest=d;total+=d;}
    if(!isNaN(d)&&!isNaN(t)&&d>0){const pace=t/d;if(fastest===null||pace<fastest)fastest=pace;}
  });
  return {count:count,longest:longest,totalKm:total,fastestPace:fastest};
}

// build an SVG line chart string
function svgLine(pts,opts){
  opts=opts||{};
  const W=opts.w||300,H=opts.h||110,pad=opts.pad||24;
  if(!pts.length)return '<svg width="'+W+'" height="'+H+'"></svg>';
  const xs=pts.map((p,i)=>i),ys=pts.map(p=>p.value);
  let minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  if(opts.goal!=null){minY=Math.min(minY,opts.goal);maxY=Math.max(maxY,opts.goal);}
  if(minY===maxY){minY-=1;maxY+=1;}
  const rangeY=maxY-minY;
  const px=i=>pad+(pts.length===1?(W-2*pad)/2:(i/(pts.length-1))*(W-2*pad));
  const py=v=>H-pad-((v-minY)/rangeY)*(H-2*pad);
  const color=opts.color||'#60a5fa';
  let path='';
  pts.forEach((p,i)=>{path+=(i===0?'M':'L')+px(i).toFixed(1)+' '+py(p.value).toFixed(1)+' ';});
  let dots='';
  pts.forEach((p,i)=>{dots+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.value).toFixed(1)+'" r="2.5" fill="'+color+'"/>';});
  let goalLine='';
  if(opts.goal!=null){const gy=py(opts.goal).toFixed(1);goalLine='<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 3"/><text x="'+(W-pad)+'" y="'+(parseFloat(gy)-3)+'" fill="#4ade80" font-size="8" text-anchor="end">goal '+opts.goal+'</text>';}
  const lblMin='<text x="2" y="'+(H-pad+3)+'" fill="#525252" font-size="8">'+minY.toFixed(0)+'</text>';
  const lblMax='<text x="2" y="'+(pad+3)+'" fill="#525252" font-size="8">'+maxY.toFixed(0)+'</text>';
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+goalLine+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>'+dots+lblMin+lblMax+'</svg>';
}

function pctToGoal(cur,start,goal){
  if(cur==null||goal==null)return null;
  if(start==null||start===goal)return cur===goal?100:0;
  const p=Math.round(((start-cur)/(start-goal))*100);
  return Math.max(0,Math.min(100,p));
}

function weekKeysBack(n){
  // return last n week-Monday isos, oldest first
  const out=[];let mon=weekOf(todayISO());
  for(let i=0;i<n;i++){out.unshift(mon);mon=addDays(mon,-7);}
  return out;
}
function freqPerWeekByType(S,nWeeks){
  const weeks=weekKeysBack(nWeeks);
  const L=S.log.filter(a=>a.done);
  const types={};
  L.forEach(a=>{const key=a.defKey;if(!types[key])types[key]={defKey:key,name:a.name,group:a.group,counts:{}};});
  Object.values(types).forEach(t=>{weeks.forEach(w=>t.counts[w]=0);});
  L.forEach(a=>{const w=weekOf(a.date);if(types[a.defKey]&&types[a.defKey].counts[w]!==undefined)types[a.defKey].counts[w]++;});
  return {weeks:weeks,types:Object.values(types).sort((x,y)=>GROUP_ORDER.indexOf(x.group)-GROUP_ORDER.indexOf(y.group))};
}
function sumField(S,defKeys,field,fromIso,toIso){
  let s=0;S.log.filter(a=>a.done&&defKeys.indexOf(a.defKey)>=0&&a.date>=fromIso&&a.date<=toIso).forEach(a=>{const v=parseFloat(a.fields[field]);if(!isNaN(v))s+=v;});
  return s;
}
function weightLiftedTotal(S,fromIso,toIso){
  let s=0;S.log.filter(a=>a.done&&a.group==='strength'&&a.fields.ex&&a.date>=fromIso&&a.date<=toIso).forEach(a=>{
    Object.values(a.fields.ex).forEach(ex=>{if(!ex||ex.chosen===false||!ex.sets)return;ex.sets.forEach(st=>{const w=effectiveWeight(S,ex.name,st.weight),r=parseFloat(st.reps);if(!isNaN(w)&&!isNaN(r))s+=w*r;});});
  });
  return s;
}
function stepsTotal(S,fromIso,toIso){
  let s=0;Object.keys(S.steps||{}).forEach(d=>{if(d>=fromIso&&d<=toIso){const v=parseInt(String(S.steps[d]).replace(/,/g,''));if(!isNaN(v))s+=v;}});
  return s;
}
function gapFlagThisWeek(S){
  // within the current week, find if there are >1 consecutive rest days
  const mon=weekOf(todayISO());const days=weekDates(mon);
  const active={};S.log.filter(a=>a.done).forEach(a=>active[a.date]=1);
  (S.steps&&Object.keys(S.steps).forEach(d=>{if(parseInt(S.steps[d])>0)active[d]=1;}));
  let maxGap=0,cur=0;
  days.filter(d=>d<=todayISO()).forEach(d=>{if(active[d]){cur=0;}else{cur++;if(cur>maxGap)maxGap=cur;}});
  return maxGap;
}
function mkBarChart(counts,weeks,color){
  const W=300,H=64,pad=14,n=weeks.length;
  const vals=weeks.map(w=>counts[w]||0);
  const max=Math.max(1,Math.max.apply(null,vals));
  const bw=(W-2*pad)/n*0.7,gap=(W-2*pad)/n*0.3;
  let bars='';
  vals.forEach((v,k)=>{const x=pad+k*((W-2*pad)/n)+gap/2;const h=(v/max)*(H-2*pad);const y=H-pad-h;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="1.5" fill="'+(v>0?color:'#2a2a2a')+'"/>';
    if(v>0)bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-2).toFixed(1)+'" fill="'+color+'" font-size="7" text-anchor="middle">'+v+'</text>';
  });
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+bars+'</svg>';
}

function mkGroupedChart(series,weeks,wkLabels){
  // series: [{name,emoji,color,counts:{wkIso:n},target?}]  clustered bars per week; target draws a red cap
  const W=320,H=130,padL=8,padR=8,padT=10,padB=22;
  const n=weeks.length,m=series.length;
  if(!m||!n)return '<svg width="'+W+'" height="'+H+'"></svg>';
  let max=1;weeks.forEach(w=>series.forEach(s=>{if((s.counts[w]||0)>max)max=s.counts[w];}));
  series.forEach(s=>{if(s.target&&s.target>max)max=s.target;});
  const groupW=(W-padL-padR)/n;
  const barW=Math.min(14,(groupW*0.8)/m);
  const innerGap=1;
  const scale=(H-padT-padB)/max;
  let caps='',bars='',axis='';
  weeks.forEach((w,wi)=>{
    const gx=padL+wi*groupW;
    const clusterW=m*barW+(m-1)*innerGap;
    const startX=gx+(groupW-clusterW)/2;
    series.forEach((s,si)=>{
      const x=startX+si*(barW+innerGap);
      // red target cap (drawn behind the bar) at the target level
      if(s.target){
        const ty=H-padB-s.target*scale;
        caps+='<rect x="'+(x-0.5).toFixed(1)+'" y="'+ty.toFixed(1)+'" width="'+(barW+1).toFixed(1)+'" height="'+(s.target*scale).toFixed(1)+'" rx="1" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.55"/>';
      }
      const v=s.counts[w]||0;
      const h=v*scale;
      const y=H-padB-h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(v>0?2:0,h).toFixed(1)+'" rx="1" fill="'+s.color+'"/>';
      if(v>0)bars+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-1.5).toFixed(1)+'" fill="'+s.color+'" font-size="6.5" text-anchor="middle">'+v+'</text>';
    });
    axis+='<text x="'+(gx+groupW/2).toFixed(1)+'" y="'+(H-padB+11)+'" fill="#525252" font-size="7" text-anchor="middle">'+wkLabels[wi]+'</text>';
  });
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+caps+bars+axis+'</svg>';
}

function hitRateStats(S,weeks){

  return weeks.map(w=>{

    let stepsHit=0,stepsLog=0,calHit=0,calLog=0,proHit=0,proLog=0,fibHit=0,fibLog=0,nutDays=0;
    days.forEach(d=>{
      const sv=parseInt(String((S.steps||{})[d]||'').replace(/,/g,''));
      if(!isNaN(sv)&&sv>0){stepsLog++;if(sv>=stepTarget(d))stepsHit++;}
      const n=(S.nutrition||{})[d];
      if(n){
        const cal=parseFloat(n.calories),pro=parseFloat(n.protein),fib=parseFloat(n.fibre);
        const anyNut=!isNaN(cal)||!isNaN(pro)||!isNaN(fib);
        if(anyNut)nutDays++;
        if(!isNaN(cal)){calLog++;const tgt=isActiveDay(S,d)?TGT().calActive:TGT().calRest;if(cal<=tgt)calHit++;}
        if(!isNaN(pro)){proLog++;if(pro>=TGT().protein)proHit++;}
        if(!isNaN(fib)){fibLog++;if(fib>=TGT().fibre)fibHit++;}
      }
    });
    return {week:w,days:days.length,stepsHit,stepsLog,calHit,calLog,proHit,proLog,fibHit,fibLog,nutDays};
  });
}

  wrap.appendChild(mkSH('Frequency per week','#fb923c'));
  if(!S._freqRange)S._freqRange=8;
  const rangeRow=el('div');rangeRow.style.cssText='display:flex;gap:.4rem;margin:0 1.25rem .6rem';
  [1,4,8,12].forEach(r=>{
    const c=el('button');c.className='rangechip'+(S._freqRange===r?' on':'');
    c.textContent=r+'wk';
    c.onclick=()=>{S._freqRange=r;save();render();};
    rangeRow.appendChild(c);
  });
  wrap.appendChild(rangeRow);

  const nWk=S._freqRange;
  const fq=freqPerWeekByType(S,nWk);
  const wkLabels=fq.weeks.map(w=>{const d=parseISO(w);return (d.getMonth()+1)+'/'+d.getDate();});

  // Cluster: Gym (a+b+c combined), Run, Golf, plus any other active types
  const clusterDefs=[
    {key:'gym',name:'Gym',emoji:'\ud83c\udfcb\ufe0f',color:'#fb923c',target:TGT().gymWeek,match:t=>t.group==='strength'},
    {key:'run',name:'Run',emoji:'\ud83c\udfc3',color:'#60a5fa',target:TGT().runWeek,match:t=>t.defKey==='run'},
    {key:'golf',name:'Golf',emoji:'\u26f3',color:'#c084fc',match:t=>t.defKey==='golf'}
  ];
  const series=clusterDefs.map(cd=>{
    const counts={};fq.weeks.forEach(w=>counts[w]=0);
    fq.types.filter(cd.match).forEach(t=>{fq.weeks.forEach(w=>{counts[w]+=(t.counts[w]||0);});});
    return {name:cd.name,emoji:cd.emoji,color:cd.color,target:cd.target,counts:counts};
  }).filter(s=>Object.values(s.counts).some(v=>v>0));

  if(series.length){
    const card=el('div','pchart');
    const legend=series.map(s=>'<span style="color:'+s.color+'">'+s.emoji+' '+s.name+(s.target?' (\u25a1'+s.target+')':'')+'</span>').join('  ')+' <span style="color:#ef4444">\u25a1 target</span>';
    card.innerHTML='<div class="pc-lbl mf" style="margin-bottom:.3rem">'+legend+'</div>'+mkGroupedChart(series,fq.weeks,wkLabels);
    wrap.appendChild(card);
  }

  // Bodyweight-challenge cluster: Push-ups/Squats/Plank (target 7) + Yoga (target 3)
  const bwDefs=[
    {key:'pushups',name:'Push',emoji:'\ud83d\udcaa',color:'#f59e0b',target:TGT().challengeWeek},
    {key:'squats',name:'Squat',emoji:'\ud83e\uddb5',color:'#fbbf24',target:TGT().challengeWeek},
    {key:'plank',name:'Plank',emoji:'\ud83e\uddd8',color:'#fb923c',target:TGT().challengeWeek},
    {key:'yoga',name:'Yoga',emoji:'\ud83e\uddd8',color:'#a3e635',target:TGT().yogaWeek}
  ];
  const bwSeries=bwDefs.map(cd=>{
    const t=fq.types.find(x=>x.defKey===cd.key);
    const counts={};fq.weeks.forEach(w=>counts[w]=(t&&t.counts[w])||0);
    return {name:cd.name,emoji:cd.emoji,color:cd.color,target:cd.target,counts:counts};
  }).filter(s=>Object.values(s.counts).some(v=>v>0));
  if(bwSeries.length){
    const card=el('div','pchart');
    const legend=bwSeries.map(s=>'<span style="color:'+s.color+'">'+s.emoji+' '+s.name+' (\u25a1'+s.target+')</span>').join(' ')+' <span style="color:#ef4444">\u25a1 target</span>';
    card.innerHTML='<div class="pc-lbl mf" style="margin-bottom:.3rem">'+legend+'</div>'+mkGroupedChart(bwSeries,fq.weeks,wkLabels);
    wrap.appendChild(card);
  }

// ===== ALCOHOL TRACKING =====
  wrap.appendChild(mkSH('Alcohol \u00b7 weekly','#f472b6'));
  const alcWeeks=weekKeysBack(S._freqRange||8);
  const alcData=alcWeeks.map(w=>{
    const days=weekDates(w);let drinkDays=0,units=0;
    days.forEach(d=>{const n=nutOn(S,d);if(n&&drinksCount(n.drinks)>0){drinkDays++;units+=drinksUnits(n.drinks);}});
    return {week:w,drinkDays:drinkDays,units:Math.round(units*10)/10,win:(drinkDays<TGT().alcDays&&units<TGT().alcUnits)};
  });
  if(alcData.some(a=>a.drinkDays>0||a.units>0)){
    const wkLabels2=alcWeeks.map(w=>{const d=parseISO(w);return (d.getMonth()+1)+'/'+d.getDate();});
    const series=[
      {name:'Drink-days',emoji:'\ud83d\udcc5',color:'#f472b6',target:TGT().alcDays,counts:{}},
      {name:'Units',emoji:'\ud83c\udf77',color:'#c084fc',target:TGT().alcUnits,counts:{}}
    ];
    alcWeeks.forEach((w,i)=>{series[0].counts[w]=alcData[i].drinkDays;series[1].counts[w]=alcData[i].units;});
    const card=el('div','pchart');
    const legend='<span style="color:#f472b6">\ud83d\udcc5 Drink-days (\u25a1'+TGT().alcDays+')</span> <span style="color:#c084fc">\ud83c\udf77 Units (\u25a1'+TGT().alcUnits+')</span> <span style="color:#ef4444">\u25a1 target</span>';
    card.innerHTML='<div class="pc-lbl mf" style="margin-bottom:.3rem">'+legend+'</div>'+mkGroupedChart(series,alcWeeks,wkLabels2);
    // win row
    const winRow=el('div');winRow.style.cssText='display:flex;gap:2px;margin-top:.5rem;justify-content:space-around';
    alcData.forEach(a=>{const s=el('div');s.style.cssText='flex:1;text-align:center;font-size:.75rem';s.textContent=a.win?'\ud83c\udfc6':'\u00b7';winRow.appendChild(s);});
    card.appendChild(winRow);
    wrap.appendChild(card);
    const wins=alcData.filter(a=>a.win).length;
    const wn=el('div');wn.style.cssText='margin:.3rem 1.25rem .5rem;font-size:.6875rem;color:#4ade80';
    wn.textContent='\ud83c\udfc6 '+wins+' of '+alcData.length+' weeks on target (<3 days & <14 units)';
    wrap.appendChild(wn);
  }

  // Other activity types (walk, rowing, swim, etc.) as individual small bars — exclude ones now in clusters
  const inCluster=['run','golf','pushups','squats','plank','yoga'];
  const otherTypes=fq.types.filter(t=>t.group!=='strength'&&inCluster.indexOf(t.defKey)<0&&Object.values(t.counts).some(c=>c>0));
  otherTypes.forEach(t=>{
    const gm=GROUP_META[t.group]||GROUP_META.other;
    const card=el('div','pchart');
    const total=Object.values(t.counts).reduce((a,b)=>a+b,0);
    card.innerHTML='<div class="pc-lbl mf">'+actEmoji(t.defKey,t.group)+' '+t.name+' \u00b7 '+total+' in '+nWk+'wk</div>'+mkBarChart(t.counts,fq.weeks,gm.color);
    wrap.appendChild(card);
  });

    // ===== SECTION 2: TOTALS & AVERAGES =====
  wrap.appendChild(mkSH('This week \u00b7 totals & averages','#60a5fa'));
  const mon=weekOf(now);const wkFrom=mon,wkTo=addDays(mon,6);
  const daysElapsed=Math.max(1,daysBetween(mon,now)+1);
  const steps=stepsTotal(S,wkFrom,wkTo);
  const runKm=sumField(S,['run'],'distance',wkFrom,wkTo);
  const walkKm=sumField(S,['walk'],'distance',wkFrom,wkTo);
  const golfKm=sumField(S,['golf'],'distance',wkFrom,wkTo);
  const lifted=weightLiftedTotal(S,wkFrom,wkTo);
  const stat=(lbl,tot,avg,unit)=>{const r=el('div','ptot');r.innerHTML='<div class="pt-lbl">'+lbl+'</div><div class="pt-val mf">'+tot+unit+'</div><div class="pt-avg mf">\u2300 '+avg+unit+'/day</div>';return r;};
  wrap.appendChild(stat('\ud83d\udc63 Steps',steps.toLocaleString(),Math.round(steps/daysElapsed).toLocaleString(),''));
  wrap.appendChild(stat('\ud83c\udfc3 Run distance',runKm.toFixed(1),(runKm/daysElapsed).toFixed(1),'km'));
  wrap.appendChild(stat('\ud83d\udeb6 Walk distance',walkKm.toFixed(1),(walkKm/daysElapsed).toFixed(1),'km'));
  wrap.appendChild(stat('\u26f3 Golf distance',golfKm.toFixed(1),(golfKm/daysElapsed).toFixed(1),'km'));
  wrap.appendChild(stat('\ud83c\udfcb\ufe0f Weight lifted',Math.round(lifted).toLocaleString(),Math.round(lifted/daysElapsed).toLocaleString(),'kg'));

// ===== SECTION 3: PERSONAL BESTS =====
  wrap.appendChild(mkSH('Personal bests','#fb923c'));
  const rb=runBests(S);
  if(rb.count){const r=el('div','pbest');r.innerHTML='<div class="pb-name">\ud83c\udfc3 Running</div><div class="pb-val mf">'+rb.count+' runs \u00b7 '+rb.totalKm.toFixed(1)+' km \u00b7 longest '+rb.longest+' km'+(rb.fastestPace?' \u00b7 best '+Math.floor(rb.fastestPace)+':'+String(Math.round((rb.fastestPace%1)*60)).padStart(2,'0')+'/km':'')+'</div>';wrap.appendChild(r);}
  exerciseBests(S).slice(0,20).forEach(x=>{const r=el('div','pbest');r.innerHTML='<div class="pb-name">'+x.name+'</div><div class="pb-val mf">best '+x.bestWeight+'kg \u00b7 last '+x.lastW+'kg\u00d7'+x.lastR+' ('+daysAgoLabel(x.lastDate,now)+')</div>';wrap.appendChild(r);});

  // ===== EXPORT =====
  // ===== DAILY HABITS (hit-rate + frequency) =====
  wrap.appendChild(mkSH('Daily habits','#4ade80'));
  const hrWeeks=weekKeysBack(S._freqRange||8);
  const hr=hitRateStats(S,hrWeeks);
  // current week (last element) big cards
  const cw=hr[hr.length-1];
  const pctOf=(hit,log)=>log>0?Math.round(hit/log*100):null;
  const bigRow=el('div','pstat-row');
  const hitCard=(lbl,hit,log,emoji)=>{
    const pc=pctOf(hit,log);
    return mkStatCard(emoji+' '+lbl,pc==null?'\u2014':pc+'%',hit+'/'+log+' days',pc>=70?'#4ade80':(pc==null?'var(--t3)':'#fbbf24'));
  };
  bigRow.appendChild(hitCard('STEPS',cw.stepsHit,cw.stepsLog,'\ud83d\udc63'));
  bigRow.appendChild(hitCard('PROTEIN',cw.proHit,cw.proLog,'\ud83e\udd69'));
  bigRow.appendChild(hitCard('CALORIES',cw.calHit,cw.calLog,'\ud83d\udd25'));
  wrap.appendChild(bigRow);
  const cwNote=el('div');cwNote.style.cssText='margin:0 1.25rem .6rem;font-size:.625rem;color:var(--t3)';
  cwNote.textContent='This week \u00b7 hit = Steps\u22657k, Protein\u2265160g, Calories\u2264target, Fibre\u226530g';
  wrap.appendChild(cwNote);

  // Protein & Fibre vs target — cluster histogram (avg per week vs target line)
  const wkLabelsH=hrWeeks.map(w=>{const d=parseISO(w);return (d.getMonth()+1)+'/'+d.getDate();});
  // build avg protein & fibre per logged day per week
  const proSeries={name:'Protein',emoji:'\ud83e\udd69',color:'#fb923c',target:TGT().protein,counts:{}};
  const fibSeries={name:'Fibre',emoji:'\ud83c\udf3e',color:'#a3e635',target:TGT().fibre,counts:{}};
  hrWeeks.forEach(w=>{
    const days=weekDates(w).filter(d=>d<=todayISO());
    let pS=0,pN=0,fS=0,fN=0;
    days.forEach(d=>{const n=(S.nutrition||{})[d];if(n){const p=parseFloat(n.protein),fb=parseFloat(n.fibre);if(!isNaN(p)){pS+=p;pN++;}if(!isNaN(fb)){fS+=fb;fN++;}}});
    proSeries.counts[w]=pN?Math.round(pS/pN):0;
    fibSeries.counts[w]=fN?Math.round(fS/fN):0;
  });
  if(Object.values(proSeries.counts).some(v=>v>0)||Object.values(fibSeries.counts).some(v=>v>0)){
    const card=el('div','pchart');
    card.innerHTML='<div class="pc-lbl mf" style="margin-bottom:.3rem"><span style="color:#fb923c">\ud83e\udd69 Protein (\u25a1'+NUT_TARGETS.protein+')</span> <span style="color:#a3e635">\ud83c\udf3e Fibre (\u25a130)</span> <span style="color:#ef4444">\u25a1 target</span> \u00b7 avg/day</div>'+mkGroupedChart([proSeries,fibSeries],hrWeeks,wkLabelsH);
    wrap.appendChild(card);
  }

  // Entry frequency: days logged steps & nutrition (daily), measurements (weekly)
  wrap.appendChild(mkSH('Entry frequency','#c084fc'));
  const stepsDaysSeries={name:'Steps',emoji:'\ud83d\udc63',color:'#60a5fa',counts:{}};
  const nutDaysSeries={name:'Nutrition',emoji:'\ud83c\udf7d\ufe0f',color:'#4ade80',counts:{}};
  hrWeeks.forEach((w,i)=>{stepsDaysSeries.counts[w]=hr[i].stepsLog;nutDaysSeries.counts[w]=hr[i].nutDays;});
  const efCard=el('div','pchart');
  efCard.innerHTML='<div class="pc-lbl mf" style="margin-bottom:.3rem"><span style="color:#60a5fa">\ud83d\udc63 Steps days</span> <span style="color:#4ade80">\ud83c\udf7d\ufe0f Nutrition days</span> \u00b7 logged/wk</div>'+mkGroupedChart([stepsDaysSeries,nutDaysSeries],hrWeeks,wkLabelsH);
  wrap.appendChild(efCard);
  // measurements weekly logged row
  const mw=measureWeeksLogged(S,hrWeeks);
  const mrow=el('div');mrow.style.cssText='display:flex;gap:2px;margin:.3rem 1.25rem .5rem;justify-content:space-around';
  const mlbl=el('div');mlbl.style.cssText='font-size:.625rem;color:var(--t3);margin:0 1.25rem';mlbl.textContent='\ud83d\udccf Measurements logged (weekly):';
  wrap.appendChild(mlbl);
  mw.forEach(m=>{const s=el('div');s.style.cssText='flex:1;text-align:center;font-size:.7rem';s.textContent=m.logged?'\u2705':'\u00b7';mrow.appendChild(s);});
  wrap.appendChild(mrow);

  // ===== DATA (export/backup) =====
  wrap.appendChild(mkSH('Data','#c084fc'));
  const exp=el('button','pbtn');exp.style.cssText+='background:var(--ac);color:#0a0a0a';exp.textContent='\ud83d\udce4 Export to Trainer';
  exp.onclick=()=>{const txt=buildTrainerExport();copyOrPrompt(txt,'Trainer summary copied \u2014 paste it to your trainer');};
  wrap.appendChild(exp);

  // BACKUP — download all data as a file (your safety net)
  const bk=el('button','pbtn');bk.textContent='\ud83d\udcbe Backup all data (download file)';
  bk.onclick=()=>backupData();
  wrap.appendChild(bk);

  // RESTORE — load data from a backup file
  const rs=el('button','pbtn');rs.textContent='\u21ba Restore from backup file';
  rs.onclick=()=>restoreData();
  wrap.appendChild(rs);

  const note=el('div');note.style.cssText='margin:.5rem 1.25rem;font-size:.625rem;color:var(--t3);line-height:1.5';
  note.textContent='Tip: tap Backup before switching app versions. The file saves to your device \u2014 you can always Restore it if anything goes wrong.';
  wrap.appendChild(note);

  return wrap;
}

function backupData(){
  const data={version:'phy-v11',exported:new Date().toISOString(),state:{
    user:S.user,heightCm:S.heightCm,progStart:S.progStart,goals:S.goals,
    log:S.log,measurements:S.measurements,steps:S.steps,runWeek:S.runWeek
  }};
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=todayISO();
  a.href=url;a.download='PHY-backup-'+stamp+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  toast('\u2713 Backup saved to your device');
}

function restoreData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const st=data.state||data; // accept raw state too
        if(!st.log&&!st.measurements){toast('That file has no PHY data');return;}
        if(!confirm('Restore this backup? It will REPLACE your current data in this app.'))return;
        if(st.user)S.user=st.user;
        if(st.heightCm)S.heightCm=st.heightCm;
        if(st.progStart)S.progStart=st.progStart;
        if(st.goals)S.goals=st.goals;
        S.log=st.log||[];
        S.measurements=st.measurements||[];
        S.steps=st.steps||{};
        if(st.runWeek)S.runWeek=st.runWeek;
        saveNow();S.view='progress';render();
        toast('\u2713 Restored '+(S.log.length)+' activities');
      }catch(err){toast('Could not read that backup file');}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(inp);inp.click();setTimeout(()=>inp.remove(),1000);
}

/* ===== EXPORT TO TRAINER ===== */
function buildTrainerExport(){
  const L=allDone(S);
  const streak=currentStreak(S),wa=weeksActive(S);
  const gaps=activityGaps(S);
  const eb=exerciseBests(S),rb=runBests(S);
  const wS=measurementSeries(S,'weight'),waS=measurementSeries(S,'waist');
  const fS=measurementSeries(S,'bodyFat'),mS=measurementSeries(S,'muscle');
  const goals=S.goals||{};
  const now=todayISO();

  // sessions per week over last 4 weeks
  const wkCounts=[];
  for(let i=0;i<4;i++){const mon=weekOf(addDays(now,-i*7));const ds=weekDates(mon);wkCounts.unshift({week:fmtNice(mon).replace(/ \d{4}/,''),n:L.filter(a=>ds.indexOf(a.date)>=0).length});}

  let s='=== PHY LOG — TRAINER SUMMARY ('+fmtNice(now)+') ===\n\n';
  s+='CONSISTENCY\n';
  s+='· Current streak: '+streak+' days\n';
  s+='· Weeks active: '+wa+'\n';
  s+='· Last 4 weeks (sessions): '+wkCounts.map(w=>w.n).join(' → ')+'\n';
  if(gaps.length){const g=gaps[gaps.length-1];s+='· Longest recent gap: '+g.days+' days ('+g.from+' → '+g.to+')\n';}
  s+='\n';

  s+='BODY';
  const bodyLine=(lbl,ser,goal,unit)=>{if(!ser.length)return '';const first=ser[0],last=ser[ser.length-1];const dir=last.value<first.value?'↓':(last.value>first.value?'↑':'→');return '\n· '+lbl+': '+last.value+unit+' '+dir+' (from '+first.value+unit+')'+(goal?' · target '+goal+unit:'');};
  s+=bodyLine('Weight',wS,goals.weight,'kg');
  s+=bodyLine('Body fat',fS,goals.bodyFat,'%');
  s+=bodyLine('Muscle',mS,goals.muscle,'kg');
  s+=bodyLine('Waist',waS,goals.waist,'in');
  s+='\n\n';

  s+='RUNNING\n';
  if(rb.count){s+='· '+rb.count+' runs · '+rb.totalKm.toFixed(1)+' km total · longest '+rb.longest+' km';if(rb.fastestPace)s+=' · best pace '+Math.floor(rb.fastestPace)+':'+String(Math.round((rb.fastestPace%1)*60)).padStart(2,'0')+'/km';s+='\n';}else s+='· No runs logged yet\n';
  s+='\n';

  s+='STRENGTH (top lifts, most recent first)\n';
  if(eb.length)eb.slice(0,10).forEach(x=>{s+='· '+x.name+': best '+x.bestWeight+'kg · last '+x.lastW+'kg×'+x.lastR+' on '+x.lastDate+'\n';});
  else s+='· No strength logged yet\n';
  s+='\n';

  // flags
  const flags=[];
  if(streak===0)flags.push('Streak broken — restart today, aim not to miss twice.');
  if(gaps.length&&gaps[gaps.length-1].days>=7)flags.push('A week-plus gap recently — the returning-athlete risk. Ease back in.');
  eb.forEach(x=>{const hist=L.filter(a=>a.group==='strength'&&a.fields.ex&&Object.values(a.fields.ex).some(e=>e&&e.name===x.name&&e.chosen!==false));if(hist.length>=3){/* stall check could go here */}});
  if(flags.length){s+='FLAGS\n';flags.forEach(fl=>s+='· '+fl+'\n');s+='\n';}

  // full data (compact JSON)
  s+='--- FULL DATA (JSON) ---\n';
  const data={exported:now,user:S.user,heightCm:S.heightCm,goals:goals,
    sessions:L.map(a=>({date:a.date,type:a.defKey,group:a.group,gym:a.fields.gym,
      ex:a.fields.ex?Object.values(a.fields.ex).filter(e=>e&&e.chosen!==false).map(e=>({n:e.name,sets:(e.sets||[]).filter(st=>st.weight||st.reps),reps:e.reps,memo:e.memo})):undefined,
      dist:a.fields.distance,time:a.fields.time,hr:a.fields.avgHR,intervals:a.fields.seg,runWk:a.fields.runWeek,
      value:a.fields.value,dur:a.fields.duration,notes:a.notes})),
    measurements:measurementSeries(S,'weight').map(p=>p.date).filter((v,i,arr)=>arr.indexOf(v)===i).map(d=>{
      const m=(S.measurements||[]).concat(S.log.filter(a=>a.group==='body')).find(a=>a.date===d);
      return m?{date:d,weight:m.fields.weight,fat:m.fields.bodyFat,muscle:m.fields.muscle,waist:m.fields.waist}:null;
    }).filter(Boolean),
    steps:S.steps||{}};
  s+=JSON.stringify(data);
  return s;
}

function copyOrPrompt(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('✓ '+okMsg)).catch(()=>prompt('Copy:',txt));
  else prompt('Copy:',txt);
}

/* ===== IMPORT SHEET ===== */
function doImport(key,bg){
  const imp=importFromV1(key);
  if(!imp){toast('Could not read that data');return;}
  if(imp.user&&!S.user)S.user=imp.user;
  if(imp.heightCm)S.heightCm=imp.heightCm;
  if(imp.goals&&!(S.goals&&S.goals.weight))S.goals=Object.assign(S.goals||{},imp.goals);
  S.log=S.log.concat(imp.log);
  S.measurements=(S.measurements||[]).concat(imp.measurements);
  S.steps=Object.assign(S.steps||{},imp.steps);
  saveNow();if(bg)bg.remove();S.view='progress';render();
  toast('✓ Imported '+(imp.log.length+imp.measurements.length)+' items');
}

}

/* ===== ACTIVITY CARD ===== */
function hydrateHistory(a){
  // Recompute transient history (never stored) so saved activities show correct last-done + pre-fill refs
  if(a.group==='strength'&&a.fields&&a.fields.ex){
    const gym=a.fields.gym||'UK';
    let latest=null;
    Object.keys(a.fields.ex).forEach(k=>{
      const ex=a.fields.ex[k];
      const le=lastExercise(S,a.defKey,ex.name,addDays(a.date,-1),gym);
      ex.lastDate=le?le.date:null;
      if(le&&(!latest||le.date>latest))latest=le.date;
      // cross-gym reference
      let ref=null;
      GYMS().forEach(g=>{if(g!==gym){const r=lastExercise(S,a.defKey,ex.name,addDays(a.date,-1),g);if(r&&(!ref||r.date>ref.date))ref={gym:g,date:r.date,ex:r.ex};}});
      ex.refGym=ref?ref.gym:null;ex.refSets=ref?ref.ex.sets:null;ex.refDate=ref?ref.date:null;
    });
    a._prev=latest?{date:latest}:null;
  } else {
    const prev=lastActivity(S,a.defKey,addDays(a.date,-1));
    a._prevDate=prev?prev.date:null;
    a._prev=prev?{date:prev.date}:null;
  }
  return a;
}
function challengeTotal(a){
  // Push-ups/Squats: reps*sets total. Plank: total minutes (value is seconds or minutes field)
  if(a.defKey==='pushups'||a.defKey==='squats'){
    const reps=parseFloat(a.fields.value),sets=parseFloat(a.fields.sets);
    if(!isNaN(reps)&&!isNaN(sets))return {n:reps*sets,unit:'reps'};
    if(!isNaN(reps))return {n:reps,unit:'reps'};
    return null;
  }
  if(a.defKey==='plank'){
    const v=parseFloat(a.fields.value),sets=parseFloat(a.fields.sets);
    if(!isNaN(v)){const totalSec=v*(isNaN(sets)?1:sets);return {n:totalSec,unit:'sec'};}
    return null;
  }
  return null;
}
function challengeStreak(S,defKey,uptoIso){
  // consecutive days (ending at uptoIso or the day before) with a done entry of this defKey
  const set={};S.log.filter(a=>a.defKey===defKey&&a.done).forEach(a=>set[a.date]=1);
  let streak=0;let d=uptoIso;
  if(!set[d])d=addDays(d,-1);
  while(set[d]){streak++;d=addDays(d,-1);}
  return streak;
}

/* ---- STRENGTH: per-exercise checkbox, done-last-time float to top ---- */
function mkStrengthBody(a,body){
  // Session-level Duration + Avg HR at the very top
  const topg=el('div','fgrid2');topg.style.marginTop='0';
  const df=el('div','fld');df.innerHTML='<div class="flbl mf">DURATION (min)</div>';const dinp=el('input');dinp.type='text';dinp.inputMode='numeric';dinp.value=a.fields.duration||'';dinp.oninput=e=>{a.fields.duration=e.target.value;save();};df.appendChild(dinp);topg.appendChild(df);

  body.appendChild(topg);

      a.fields.gym=g;

      const def=defByKey(S,a.defKey);
      const exList=(def.ex&&def.ex.length)?def.ex:Object.values(a.fields.ex).map(e=>e.name);
      a.fields.ex=buildStrengthEx(S,a.defKey,exList,a.date,g);
      upsertActivity(a);render();
    };
    gymRow.appendChild(c);
  });
  body.appendChild(gymRow);

  const keys=Object.keys(a.fields.ex);
  // TOP group: done-before (by most-recent date) OR ticked-today. BOTTOM: untouched never-done.
  const doneBefore=keys.filter(k=>a.fields.ex[k].lastDate).sort((x,y)=>a.fields.ex[y].lastDate.localeCompare(a.fields.ex[x].lastDate));
  const tickedNew=keys.filter(k=>!a.fields.ex[k].lastDate&&a.fields.ex[k].chosen!==false);
  const rest=keys.filter(k=>!a.fields.ex[k].lastDate&&a.fields.ex[k].chosen===false);
  const ordered=doneBefore.concat(tickedNew).concat(rest);

  const tip=el('div');tip.style.cssText='font-size:.5625rem;color:var(--t3);margin:.2rem 0 .5rem;letter-spacing:.03em';
  tip.textContent='TICK THE EXERCISES YOU\u2019RE DOING TODAY · '+a.fields.gym+' weights';
  body.appendChild(tip);

  ordered.forEach(ei=>{
    const ex=a.fields.ex[ei];
    const chosen=ex.chosen!==false;
    const row=el('div','exrow');

    const nm=el('span',null,ex.name);nm.style.cssText='color:'+(chosen?'var(--t1)':'var(--t3)');
    left.append(cb,nm);
    // ⬆️ ready-to-progress flag (per exercise) — tick when it felt easy; reminds you next session
    const upbtn=el('button','upflag'+(ex.progress?' on':''));
    upbtn.innerHTML=ex.progress?'\u2b06\ufe0f':'\u2b06';
    upbtn.title='Ready to add weight next time';
    upbtn.onclick=(e)=>{e.stopPropagation();ex.progress=!ex.progress;upsertActivity(a);render();};
    left.appendChild(upbtn);
    eh.appendChild(left);
    if(ex.lastDate){const ld=el('span','exlast mf',fmtNice(ex.lastDate).replace(/ \d{4}$/,'')+' · '+daysAgoLabel(ex.lastDate,a.date));eh.appendChild(ld);}
    else {const ld=el('span','exlast mf','new');eh.appendChild(ld);}
    row.appendChild(eh);

    if(chosen){
      // Yellow top band: last-done date + days since + YouTube form link

        if(refTxt){const rf=el('div','ex-ref mf');rf.textContent='@'+ex.refGym+' ('+fmtNice(ex.refDate).replace(/ \d{4}$/,'')+'): '+refTxt;row.appendChild(rf);}

        line.append(stick,snlbl);
        const w=el('input');w.type='text';w.inputMode='decimal';w.value=st.weight||'';w.placeholder='kg';w.oninput=e=>{st.weight=e.target.value;save();};
        const rp=el('input');rp.type='text';rp.inputMode='numeric';rp.value=st.reps||'';rp.placeholder='reps';rp.oninput=e=>{st.reps=e.target.value;save();};
        line.append(w,el('span','u','kg'),rp,el('span','u','reps'));
        if((ex.sets||[]).length>1){const del=el('button','setdel','×');del.onclick=()=>{ex.sets.splice(si,1);upsertActivity(a);render();};line.appendChild(del);}
        row.appendChild(line);
      });
      const add=el('div','addset','+ add set');add.onclick=()=>{const last=ex.sets[ex.sets.length-1];ex.sets.push(last?{weight:last.weight||'',reps:last.reps||''}:{weight:'',reps:''});upsertActivity(a);render();};row.appendChild(add);

      memo.oninput=e=>{ex.memo=e.target.value;save();};
      row.appendChild(memo);
    }
    body.appendChild(row);
  });
}

/* ---- RUN PROGRAMME body: week + session picker + segment logging ---- */
function mkRunBody(a,body){
  const wk=a.fields.runWeek||1;
  const phase=runPhaseOf(wk);
  const sessions=RUN_PROGRAMME.weeks[wk]||[];

  // week selector
  const wkRow=el('div');wkRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin:.4rem 0 .2rem';
  const wl=el('div');wl.style.cssText='font-size:.75rem;color:var(--t1)';wl.innerHTML='Run Week <b style="color:#60a5fa">'+wk+'</b> / 18 · <span class="mf" style="font-size:.625rem;color:var(--t3)">'+phase.name+'</span>';
  const wkBtns=el('div');wkBtns.style.cssText='display:flex;gap:.3rem';
  const wm=el('button','miniarrow','‹');wm.onclick=()=>{a.fields.runWeek=Math.max(1,wk-1);a.fields.session=0;upsertActivity(a);render();};
  const wp=el('button','miniarrow','›');wp.onclick=()=>{a.fields.runWeek=Math.min(18,wk+1);a.fields.session=0;upsertActivity(a);render();};
  wkBtns.append(wm,wp);wkRow.append(wl,wkBtns);body.appendChild(wkRow);

  const pn=el('div');pn.style.cssText='font-size:.5625rem;color:var(--t3);margin-bottom:.5rem;line-height:1.5';pn.textContent=phase.note;body.appendChild(pn);

  // session chips
  const chips=el('div');chips.style.cssText='display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem';
  sessions.forEach((s,i)=>{
    const on=(a.fields.session||0)===i;
    const c=el('button');c.className='runchip'+(on?' on':'');
    c.textContent='S'+(i+1);
    c.onclick=()=>{a.fields.session=i;initRunSegments(a,s);upsertActivity(a);render();};
    chips.appendChild(c);
  });
  body.appendChild(chips);

  const sess=sessions[a.fields.session||0];
  if(!sess)return;
  const sd=el('div');sd.style.cssText='font-size:.875rem;color:var(--t1);margin-bottom:.5rem';sd.textContent=sess.desc;body.appendChild(sd);

  // ensure segments initialised
  initRunSegments(a,sess);

  // find last time this same week+session was logged
  const prevRun=lastRunSession(wk,a.fields.session,a.date,a.id);
  if(prevRun){const pl=el('div');pl.style.cssText='font-size:.5625rem;color:var(--t3);margin-bottom:.4rem';pl.textContent='Last did this session '+fmtNice(prevRun.date)+' · '+daysAgoLabel(prevRun.date,a.date);body.appendChild(pl);}

  if(sess.seg){
    // segment logging: reps done, actual walk/jog times
    const tgt=sess.seg;
    const grid=el('div','fgrid2');
    const mkF=(k,lbl,ph)=>{const f=el('div','fld');f.innerHTML='<div class="flbl mf">'+lbl+'</div>';const inp=el('input');inp.type='text';inp.inputMode='decimal';inp.value=(a.fields.seg&&a.fields.seg[k])||'';inp.placeholder=ph;inp.oninput=e=>{a.fields.seg=a.fields.seg||{};a.fields.seg[k]=e.target.value;save();};f.appendChild(inp);return f;};
    if(tgt.walk!=null)grid.appendChild(mkF('walk','WALK (min)',String(tgt.walk)));
    if(tgt.jog!=null)grid.appendChild(mkF('jog','JOG (min)',String(tgt.jog)));
    grid.appendChild(mkF('reps','REPS DONE','of '+tgt.reps));
    body.appendChild(grid);
    const note=el('div');note.style.cssText='font-size:.5625rem;color:var(--t3);margin-top:.35rem';note.textContent='Target: '+(tgt.walk!=null?tgt.walk+' walk / ':'')+(tgt.jog!=null?tgt.jog+' jog ':'')+'× '+tgt.reps+' reps';body.appendChild(note);
  }
  // always allow distance+time+HR
  const g2=el('div','fgrid2');
  [['distance','DISTANCE (km)'],['time','TOTAL TIME (min)'],['avgHR','AVG HR']].forEach(([k,l])=>{
    const f=el('div','fld');f.innerHTML='<div class="flbl mf">'+l+'</div>';const inp=el('input');inp.type='text';inp.inputMode='decimal';inp.value=a.fields[k]||'';inp.placeholder=(k==='distance'?'~'+sess.km:'');inp.oninput=e=>{a.fields[k]=e.target.value;save();updPace();};f.appendChild(inp);g2.appendChild(f);
  });
  body.appendChild(g2);
  const pace=el('div','pace mf');const updPace=()=>{const d=parseFloat(a.fields.distance),t=parseFloat(a.fields.time);if(!isNaN(d)&&!isNaN(t)&&d>0){const p=t/d,mm=Math.floor(p),ss=Math.round((p-mm)*60);pace.textContent='Pace ≈ '+mm+':'+String(ss).padStart(2,'0')+' /km';}else pace.textContent='';};updPace();body.appendChild(pace);
}
function initRunSegments(a,sess){if(sess&&sess.seg&&!a.fields.seg){a.fields.seg={};}}
function lastRunSession(wk,sessIdx,beforeIso,selfId){
  const past=S.log.filter(x=>x.defKey==='run'&&x.done&&x.date<beforeIso&&x.fields&&x.fields.runWeek===wk&&(x.fields.session||0)===sessIdx&&x.id!==selfId);
  past.sort((a,b)=>b.date.localeCompare(a.date));
  return past[0]||null;
}

    const inU=el('div','flbl mf');inU.style.textAlign='center';inU.textContent='INCHES';inW.append(inI,inU);
    const cmW=el('div');cmW.style.cssText='flex:1;display:flex;flex-direction:column;gap:.15rem';

    inI.oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)){F[k]=v;cmI.value=(v*2.54).toFixed(1);}else{F[k]='';cmI.value='';}save();};
    cmI.oninput=e=>{const c=parseFloat(e.target.value);if(!isNaN(c)){const inch=c/2.54;F[k]=parseFloat(inch.toFixed(2));inI.value=inch.toFixed(2);}else{F[k]='';inI.value='';}save();};
    dual.append(inW,cmW);fd.appendChild(dual);body.appendChild(fd);
