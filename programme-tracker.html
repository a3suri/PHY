<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/manifest+json,{\"name\":\"Programme\",\"short_name\":\"PRGM\",\"display\":\"standalone\",\"background_color\":\"#0a0a0a\",\"theme_color\":\"#0a0a0a\",\"start_url\":\".\"}"><meta name="apple-mobile-web-app-title" content="Programme">
<meta name="theme-color" content="#0a0a0a">
<title>Programme · A Suri</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--s1:rgba(23,23,23,.85);--s2:rgba(23,23,23,.4);
  --b1:#262626;--b2:rgba(38,38,38,.6);
  --t1:#fafaf9;--t2:#a3a3a3;--t3:#737373;--t4:#525252;--t5:#3d3d3d;
  --ac:#fb923c;
}
html,body{background:var(--bg);color:var(--t1)}
body{font-family:'Outfit',-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;font-size:16px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input,button{font-family:inherit;font-size:16px;color:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
.sf{font-family:'Fraunces',Georgia,serif}
.mf{font-family:'JetBrains Mono',monospace}
#grain{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E")}
#app{max-width:28rem;margin:0 auto;position:relative;z-index:1}
/* Header */
.hdr{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid #171717}
.hdr-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem}
.lxs{font-size:.625rem;letter-spacing:.3em;color:var(--t3);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.wtitle{font-family:'Fraunces',Georgia,serif;font-size:3rem;line-height:1;font-weight:500}
.wnum{font-style:italic;color:var(--ac);margin-left:.5rem}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:.75rem}
.plbl{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);font-family:'JetBrains Mono',monospace}
.nbts{display:flex;gap:.25rem}
.nbt{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--b1);background:transparent;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.nbt:active{transform:scale(.93)}
.nbt:disabled{opacity:.3;cursor:not-allowed}
/* Tabs */
.tabwrap{padding:1rem 1.25rem .5rem;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid rgba(23,23,23,.5)}
.tabs{display:flex;gap:.25rem;background:rgba(23,23,23,.6);border:1px solid rgba(38,38,38,.6);border-radius:999px;padding:.25rem}
.tab{flex:1;padding:.5rem 0;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;background:transparent;border:none;color:var(--t2);border-radius:999px;cursor:pointer;transition:all .15s}
.tab.on{background:var(--t1);color:var(--bg);box-shadow:0 10px 25px -10px rgba(255,255,255,.2)}
/* Cards */
.card{border-radius:1rem;border:1px solid var(--b1);background:var(--s1);overflow:hidden;position:relative;transition:all .2s}
.card.tod{border-color:rgba(251,146,60,.4);box-shadow:0 0 30px -10px rgba(251,146,60,.3)}
.card.tod::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.card.dn{background:rgba(23,23,23,.35)}
.chdr{width:100%;padding:1rem;display:flex;align-items:flex-start;gap:.75rem;text-align:left;background:transparent;border:none;color:inherit;cursor:pointer}
.chdr:active{background:rgba(23,23,23,.4)}
.icwrap{width:2.5rem;height:2.5rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.125rem}
.cbody{flex:1;min-width:0}
.cmr{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.cdlbl{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.todtag{color:var(--ac);margin-left:.375rem}
.chev{color:var(--t3);transition:transform .2s;flex-shrink:0}
.chev.op{transform:rotate(180deg)}
.cname{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;line-height:1.2;color:var(--t1);margin-top:.125rem;font-weight:500}
.cfoc{font-size:.875rem;color:var(--t2);margin-top:.125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Expand */
.cexp{padding:0 1rem .75rem}
.cein{border-top:1px solid var(--b2);padding-top:.5rem}
/* Gym exercise row */
.exrow{padding:.625rem 0;border-bottom:1px solid rgba(38,38,38,.4)}
.exrow:last-child{border-bottom:none}
.exhdr{display:flex;align-items:center;gap:.625rem;margin-bottom:.5rem}
.exnm{font-size:.875rem;line-height:1.2;flex:1;min-width:0;color:var(--t1)}
.exnm.dn{color:var(--t3)}
.exmt{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3);white-space:nowrap}
.exrs{color:var(--t4);margin-left:.375rem}
/* Checkbox */
.ck{width:1.25rem;height:1.25rem;border-radius:.375rem;border:2px solid #3d3d3d;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;padding:0;transition:transform .1s}
.ck:active{transform:scale(.88)}
.ck.on{border-color:transparent}
/* Sets */
.sgrid{display:grid;gap:.375rem}
.scard{border-radius:.5rem;border:1px solid rgba(38,38,38,.6);background:rgba(23,23,23,.3);padding:.375rem;transition:all .15s}
.scard.fi{background:rgba(23,23,23,.8);border-color:#3d3d3d}
.snum{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:var(--t3);letter-spacing:.15em;text-align:center;margin-bottom:.125rem}
.sinp{width:100%;background:transparent;text-align:center;font-family:'JetBrains Mono',monospace;outline:none;border:none;padding:.125rem .25rem;border-radius:.25rem;font-size:1rem}
.sinp.wt{color:var(--t1)}
.sinp.rp{color:var(--t2)}
.sinp:focus{background:rgba(38,38,38,.5)}
.sinp::placeholder{color:#3a3a3a}
.sunt{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:var(--t4);text-align:center;margin-top:-0.125rem;margin-bottom:.125rem}
/* Prev hint */
.pvhint{display:flex;align-items:center;gap:.5rem;margin-top:.375rem;padding:0 .25rem}
.pvtxt{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvset{color:var(--t2)}
.delta{font-size:.625rem;font-family:'JetBrains Mono',monospace;padding:.125rem .375rem;border-radius:999px;white-space:nowrap}
/* Non-gym items */
.irow{width:100%;display:flex;align-items:center;gap:.75rem;padding:.5rem;margin:0 -.5rem;border-radius:.5rem;background:transparent;border:none;color:inherit;cursor:pointer;text-align:left}
.irow:active{background:rgba(38,38,38,.4)}
.inm{font-size:.875rem;flex:1;min-width:0;color:var(--t1)}
.inm.dn{text-decoration:line-through;color:var(--t4)}
.imt{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3)}
/* Complete button */
.carea{padding:0 1rem 1rem}
.cbtn{width:100%;padding:.75rem;border-radius:.75rem;font-weight:500;font-size:.875rem;letter-spacing:.05em;border:none;cursor:pointer;transition:transform .1s;color:var(--bg)}
.cbtn:active{transform:scale(.97)}
.cbtn.dn{background:rgba(38,38,38,.6)!important;color:var(--t2);border:1px solid #3d3d3d}
/* Week strip */
.swrap{padding:1rem 1.25rem 0}
.slbl{font-size:.625rem;letter-spacing:.25em;text-transform:uppercase;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-bottom:.625rem}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:.375rem}
.sday{display:flex;flex-direction:column;align-items:center;gap:.375rem}
.sd{font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:var(--t4)}
.sdot{width:100%;aspect-ratio:1;border-radius:.5rem;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
.sdot.tod{box-shadow:0 0 0 1px rgba(251,146,60,.5)}
/* Rule */
.rwrap{padding:1.5rem 1.25rem}
.rcard{border-radius:.75rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:1rem}
.rq{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-style:italic;line-height:1.2}
.rq .ac{color:var(--ac)}
.rs{font-size:.75rem;color:var(--t3);margin-top:.5rem;line-height:1.4}
/* Week view */
.wview{padding:1rem 1.25rem 1.5rem}
.wview>*+*{margin-top:.625rem}
/* Progress */
.pgview{padding:1rem 1.25rem 1.5rem}
.sgrid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.sc{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.6);padding:1rem}
.sc.ac{border-color:rgba(251,146,60,.3);background:rgba(251,146,60,.05)}
.slb{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);font-family:'JetBrains Mono',monospace}
.slb.ac{color:var(--ac)}
.sv{font-family:'Fraunces',Georgia,serif;font-size:3rem;line-height:1;font-weight:500;margin-top:.25rem}
.ss{font-size:.75rem;color:var(--t3);margin-top:.25rem}
.seclbl{font-size:.625rem;letter-spacing:.25em;text-transform:uppercase;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-bottom:.625rem}
/* Activity bars */
.abcard{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:1rem;margin-bottom:1.25rem}
.abrow{display:flex;align-items:center;gap:.75rem}
.abrow+.abrow{margin-top:.625rem}
.ablbl{width:3.5rem;font-size:.75rem;color:var(--t1)}
.abtr{flex:1;height:.5rem;background:rgba(38,38,38,.6);border-radius:999px;overflow:hidden}
.abfi{height:100%;border-radius:999px;transition:width .5s}
.abn{width:1.5rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--t2)}
/* Week map */
.wmcard{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:1rem;margin-bottom:1.25rem}
.wmap{display:grid;grid-template-columns:repeat(4,1fr);gap:.375rem}
.wcel{border-radius:.5rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:.5rem;cursor:pointer;transition:transform .1s;text-align:left}
.wcel:active{transform:scale(.94)}
.wcel.cur{border-color:var(--ac);background:rgba(251,146,60,.1)}
.wctp{display:flex;align-items:baseline;justify-content:space-between}
.wcwk{font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.wcph{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:var(--t4)}
.wcct{font-family:'Fraunces',Georgia,serif;font-size:1.125rem;line-height:1;margin-top:.25rem;font-weight:500}
.wcct .dm{color:var(--t4);font-size:.875rem}
.wcbar{height:2px;background:#262626;border-radius:999px;overflow:hidden;margin-top:.375rem}
.wcbf{height:100%;background:var(--ac);transition:width .5s}
/* Phase cards */
.phcard{border-radius:.75rem;border:1px solid var(--b1);background:rgba(23,23,23,.3);padding:.75rem}
.phcard+.phcard{margin-top:.5rem}
.phcard.cur{border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.05)}
.phctp{display:flex;align-items:baseline;justify-content:space-between}
.phnm{font-family:'Fraunces',Georgia,serif;font-size:1.125rem;color:var(--t1);font-weight:500}
.phrg{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.phds{font-size:.75rem;color:var(--t3);margin-top:.125rem}
/* History */
.hcard{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:1rem;margin-bottom:1.25rem}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--b2)}
.hrow:last-child{border-bottom:none}
.hdate{font-family:'JetBrains Mono',monospace;font-size:.6875rem;color:var(--t2)}
.hsess{font-size:.75rem;color:var(--t1)}
.hloc{font-family:'JetBrains Mono',monospace;font-size:.5625rem;color:var(--t4);letter-spacing:.1em}
/* Install hint */
.ihint{margin:1rem 1.25rem 2rem;padding:.75rem;border:1px dashed #262626;border-radius:.5rem;font-size:.6875rem;color:var(--t3);text-align:center;line-height:1.5}
.ihint b{color:var(--ac);font-weight:600}
/* Reset */
.rstbtn{width:100%;padding:.5rem 0;margin-top:1.5rem;font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--t4);background:transparent;border:none;font-family:'JetBrains Mono',monospace;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .35s ease-out}
.rest-msg{padding:0 1rem 1rem;text-align:center;font-size:.875rem;color:var(--t3);font-style:italic}

/* removed */
.himp-card{border:1px dashed rgba(34,211,238,.35);background:rgba(34,211,238,.04);border-radius:1rem;padding:1rem}
.himp-title{font-size:.875rem;color:var(--t1);font-weight:500;margin-bottom:.3rem}
.himp-steps{font-size:.6875rem;color:#22d3ee;font-weight:500;margin-bottom:.25rem}
.himp-sub{font-size:.75rem;color:var(--t3);margin-bottom:.75rem;line-height:1.6}
.himp-sub b{color:var(--t2);font-weight:500}
.himp-btn{width:100%;padding:.625rem;border-radius:.75rem;font-size:.8125rem;font-weight:500;cursor:pointer;transition:transform .1s;border:none;letter-spacing:.02em}
.himp-btn:active{transform:scale(.97)}
.hst-row{display:flex;align-items:baseline;justify-content:space-between;padding:.375rem 0;border-bottom:1px solid var(--b2)}
.hst-row:last-child{border-bottom:none}
.hst-date{font-family:'JetBrains Mono',monospace;font-size:.625rem;color:var(--t3)}
.hst-info{font-size:.75rem;color:var(--t1)}
.hst-cal{font-family:'JetBrains Mono',monospace;font-size:.625rem;color:var(--t4)}
.parsing-msg{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#22d3ee;letter-spacing:.1em}
@keyframes spin{to{transform:rotate(360deg)}}

.swap-bar{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.625rem 1rem;border:none;border-top:1px solid rgba(38,38,38,.5);
  background:transparent;cursor:pointer;color:#737373;
  font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;transition:background .15s}
.swap-bar:active{background:rgba(38,38,38,.4)}
.swap-bar svg{flex-shrink:0}
.swap-bar.open{color:var(--ac);border-bottom:1px solid rgba(38,38,38,.4)}
.custom-tag{font-size:.5rem;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);border-radius:999px;padding:.1rem .35rem;margin-left:.375rem;vertical-align:middle}
.act-picker{padding:.75rem 1rem;display:flex;gap:.5rem;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:wrap}
.act-picker::-webkit-scrollbar{display:none}
.act-pill{display:flex;align-items:center;gap:.4rem;padding:.5rem .875rem;border-radius:999px;border:1px solid transparent;font-size:.8125rem;font-weight:500;white-space:nowrap;cursor:pointer;flex-shrink:0;background:transparent;transition:transform .1s;min-height:2.5rem}
.act-pill:active{transform:scale(.93)}
.log-sect{border-top:1px solid rgba(38,38,38,.4);padding:.75rem .25rem .25rem;margin-top:.25rem}
.log-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.625rem}
.log-row{display:flex;align-items:center;gap:.625rem;margin-bottom:.5rem}
.log-key{font-size:.75rem;color:#a3a3a3;width:7rem;flex-shrink:0}
.log-val{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#525252;flex-shrink:0}
.log-inp{flex:1;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.35rem .625rem;font-family:'JetBrains Mono',monospace;font-size:.9375rem;color:var(--t1);outline:none}
.log-inp:focus{border-color:rgba(251,146,60,.4);background:rgba(38,38,38,.5)}
.log-inp::placeholder{color:#3a3a3a}
.log-textarea{width:100%;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.35rem .625rem;font-family:'Outfit',sans-serif;font-size:.875rem;color:var(--t1);outline:none;resize:none;line-height:1.4}
.log-textarea:focus{border-color:rgba(251,146,60,.4)}
.log-textarea::placeholder{color:#3a3a3a}
.actual-wrap{display:flex;align-items:center;gap:.375rem;margin-left:auto}
.actual-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.1em;white-space:nowrap}
.actual-inp{width:4rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.375rem;padding:.2rem .375rem;font-family:'JetBrains Mono',monospace;font-size:.875rem;color:var(--t1);outline:none;text-align:center}
.actual-inp:focus{border-color:rgba(251,146,60,.4)}
.actual-inp::placeholder{color:#3a3a3a}

.date-row{display:flex;align-items:center;justify-content:space-between;padding:.625rem 1rem;border-top:1px solid rgba(38,38,38,.4)}
.date-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373;letter-spacing:.15em;text-transform:uppercase}
.date-inp{background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.35rem .625rem;font-family:'JetBrains Mono',monospace;font-size:.875rem;color:var(--t1);outline:none;-webkit-appearance:none}
.date-inp:focus{border-color:rgba(251,146,60,.4)}
.add-sess-btn{width:100%;padding:.75rem;border:1px dashed #3d3d3d;border-radius:.75rem;background:transparent;color:#737373;font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:.5rem;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;gap:.5rem}
.add-sess-btn:active{background:rgba(38,38,38,.4);color:var(--t1)}
.extra-wrap{margin-top:.5rem;border-radius:1rem;border:1px solid #3d3d3d;background:rgba(23,23,23,.5);overflow:hidden;position:relative}
.extra-wrap.done{background:rgba(23,23,23,.3)}
.extra-top{display:flex;align-items:center;gap:.625rem;padding:.75rem 1rem}
.extra-icon{font-size:1rem;line-height:1;flex-shrink:0}
.extra-info{flex:1;min-width:0}
.extra-name{font-size:.875rem;color:var(--t1);font-family:'Fraunces',Georgia,serif;font-weight:500}
.extra-date-disp{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373;margin-top:.1rem}
.extra-del{background:transparent;border:none;color:#525252;cursor:pointer;padding:.25rem .5rem;font-size:1.125rem;line-height:1;flex-shrink:0}
.extra-del:active{color:#ef4444}
.extra-chev{color:#525252;transition:transform .2s;flex-shrink:0}
.extra-chev.op{transform:rotate(180deg)}

.sunsal-row{padding:.75rem 0 .5rem;border-bottom:1px solid rgba(38,38,38,.4)}
.sunsal-hdr{display:flex;align-items:center;gap:.625rem;margin-bottom:.625rem}
.sunsal-title{font-size:.875rem;color:var(--t1);flex:1}
.sunsal-target{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373}
.sunsal-inp-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.625rem}
.sunsal-inp-lbl{font-size:.6875rem;color:#a3a3a3;width:7rem;flex-shrink:0}
.sunsal-inp{width:5rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.4rem .625rem;font-family:'JetBrains Mono',monospace;font-size:1.125rem;color:var(--t1);outline:none;text-align:center}
.sunsal-inp:focus{border-color:rgba(163,230,53,.5)}
.sunsal-inp::placeholder{color:#3a3a3a}
.sunsal-prog-wrap{margin-top:.25rem}
.sunsal-prog-lbl{display:flex;justify-content:space-between;margin-bottom:.375rem}
.sunsal-prog-txt{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373}
.sunsal-prog-pct{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#a3e635}
.sunsal-bar{height:.375rem;background:#262626;border-radius:999px;overflow:hidden}
.sunsal-bar-fill{height:100%;background:#a3e635;border-radius:999px;transition:width .5s}
.walk-log-sect{border-top:1px solid rgba(38,38,38,.4);padding:.75rem .25rem .25rem;margin-top:.25rem}

.steps-row{display:flex;align-items:center;gap:.75rem;padding:.625rem 1rem;
  border-radius:.75rem;border:1px solid rgba(38,38,38,.5);background:rgba(23,23,23,.4);margin-top:.375rem}
.steps-icon{font-size:1rem;line-height:1;flex-shrink:0}
.steps-lbl{font-size:.75rem;color:#a3a3a3;flex:1}
.steps-inp{width:6rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;
  padding:.35rem .625rem;font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--t1);
  outline:none;text-align:right}
.steps-inp:focus{border-color:rgba(52,211,153,.5)}
.steps-inp::placeholder{color:#3a3a3a}
.steps-unit{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#525252;flex-shrink:0}

.steps-sect{margin-bottom:1.25rem}
.steps-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.625rem;margin-bottom:1rem}
.steps-stat{border-radius:.75rem;border:1px solid var(--b1);background:rgba(23,23,23,.5);padding:.75rem;text-align:center}
.steps-stat-val{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:500;line-height:1}
.steps-stat-val.hit{color:#34d399}
.steps-stat-val.miss{color:#fb923c}
.steps-stat-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.15em;text-transform:uppercase;margin-top:.25rem}
.steps-map{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:.875rem 1rem;overflow-x:auto}
.steps-map-head{display:grid;grid-template-columns:3rem repeat(7,1fr);gap:.25rem;margin-bottom:.375rem}
.steps-map-hlbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;text-align:center;letter-spacing:.05em}
.steps-map-row{display:grid;grid-template-columns:3rem repeat(7,1fr);gap:.25rem;margin-bottom:.25rem;align-items:center}
.steps-map-wlbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.05em}
.sdot{width:100%;aspect-ratio:1;border-radius:.3rem;display:flex;align-items:center;justify-content:center;position:relative}
.sdot.hit{background:rgba(52,211,153,.25);border:1px solid rgba(52,211,153,.4)}
.sdot.miss{background:rgba(251,146,60,.2);border:1px solid rgba(251,146,60,.4)}
.sdot.empty{background:rgba(38,38,38,.3);border:1px solid rgba(38,38,38,.5)}
.sdot-val{font-size:.45rem;font-family:'JetBrains Mono',monospace;color:#a3a3a3;line-height:1;text-align:center}
.sdot.miss .sdot-val{color:#fb923c}
.sdot.hit .sdot-val{color:#34d399}
.steps-legend{display:flex;gap:1rem;margin-top:.625rem;justify-content:flex-end}
.steps-leg-item{display:flex;align-items:center;gap:.375rem;font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:#737373}
.steps-leg-dot{width:.625rem;height:.625rem;border-radius:.125rem}

.wk-badge{font-size:.5rem;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;
  margin-top:.375rem;padding:.125rem .3rem;border-radius:.25rem;display:inline-block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wk-profile-card{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);
  padding:1rem;margin-bottom:1.25rem}
.wk-profile-row{display:flex;align-items:center;justify-content:space-between;
  padding:.4rem 0;border-bottom:1px solid rgba(38,38,38,.35)}
.wk-profile-row:last-child{border-bottom:none}
.wk-profile-num{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#525252;width:2.5rem;flex-shrink:0}
.wk-profile-badge{font-size:.6875rem;font-family:'JetBrains Mono',monospace;font-weight:500;padding:.2rem .5rem;border-radius:.375rem}
.wk-profile-detail{font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:#525252;text-align:right;flex:1;margin-left:.5rem}

.opt-yoga-wrap{border-radius:1rem;border:1px solid rgba(163,230,53,0.3);
  background:rgba(163,230,53,0.12);overflow:hidden;margin-top:.375rem;position:relative}
.opt-yoga-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#a3e635,transparent)}
.opt-yoga-top{width:100%;display:flex;align-items:center;gap:.75rem;
  padding:.875rem 1rem;background:transparent;border:none;cursor:pointer;text-align:left}
.opt-yoga-top:active{background:rgba(163,230,53,0.08)}
.opt-yoga-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#a3a3a3;
  letter-spacing:.2em;text-transform:uppercase;margin-bottom:.15rem}
.opt-yoga-name{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;
  color:var(--t1);font-weight:500;line-height:1.2}
.opt-yoga-sub{font-size:.875rem;color:#a3a3a3;margin-top:.1rem}

/* Measurements */
.meas-section{margin-bottom:1.5rem}
.meas-week-sel{display:flex;align-items:center;gap:.75rem;margin-bottom:.875rem}
.meas-week-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373;letter-spacing:.15em;text-transform:uppercase}
.meas-week-btn{padding:.35rem .75rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--t1);cursor:pointer}
.meas-week-btn.active{border-color:var(--ac);color:var(--ac);background:rgba(251,146,60,.08)}
.meas-card{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.5);padding:1rem;margin-bottom:.75rem}
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}
.meas-field{display:flex;flex-direction:column;gap:.25rem}
.meas-field.full{grid-column:1/-1}
.meas-field-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.15em;text-transform:uppercase}
.meas-inp{background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.4rem .625rem;font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--t1);outline:none;width:100%}
.meas-inp:focus{border-color:rgba(251,146,60,.4)}
.meas-inp::placeholder{color:#3a3a3a}
.meas-inp.readonly{color:#737373;background:rgba(38,38,38,.3)}
.meas-unit{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;margin-top:.1rem}
/* Charts */
.chart-wrap{margin-bottom:1.25rem}
.chart-card{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:.875rem 1rem .625rem}
.chart-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.625rem}
.chart-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#737373;letter-spacing:.15em;text-transform:uppercase}
.chart-latest{font-size:.875rem;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.chart-tgt{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252}
.chart-empty{text-align:center;padding:1.25rem;font-size:.75rem;color:#525252;font-family:'JetBrains Mono',monospace}
/* Targets */
.target-card{border-radius:1rem;border:1px solid var(--b1);background:rgba(23,23,23,.4);padding:1rem;margin-bottom:1.25rem}
.target-row{display:flex;align-items:center;gap:.75rem;padding:.5rem 0;border-bottom:1px solid rgba(38,38,38,.35)}
.target-row:last-child{border-bottom:none}
.target-lbl{font-size:.75rem;color:var(--t2);flex:1}
.target-inp{width:5rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;border-radius:.5rem;padding:.35rem .5rem;font-family:'JetBrains Mono',monospace;font-size:.875rem;color:var(--t1);outline:none;text-align:right}
.target-inp:focus{border-color:rgba(251,146,60,.4)}
.target-unit{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:#525252;width:2rem;flex-shrink:0}
/* Continuation */
.cont-card{border-radius:1rem;border:1px solid rgba(251,146,60,.4);background:rgba(251,146,60,.06);padding:1.25rem;margin-bottom:1.5rem;text-align:center}
.cont-title{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:500;color:var(--t1);margin-bottom:.375rem}
.cont-sub{font-size:.75rem;color:#a3a3a3;margin-bottom:1rem}
.cont-btns{display:flex;gap:.625rem}
.cont-btn{flex:1;padding:.75rem;border-radius:.75rem;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:none;cursor:pointer;transition:transform .1s}
.cont-btn:active{transform:scale(.97)}
.cont-btn.primary{background:var(--ac);color:#0a0a0a}
.cont-btn.secondary{background:rgba(38,38,38,.7);color:var(--t2);border:1px solid #3d3d3d}
/* Monday prompt */
.monday-card{border-radius:1rem;border:1px solid rgba(251,146,60,.3);background:rgba(251,146,60,.06);padding:1rem;margin-bottom:.625rem}
.monday-title{font-family:'Fraunces',Georgia,serif;font-size:1.125rem;font-weight:500;color:var(--t1);margin-bottom:.25rem}
.monday-sub{font-size:.75rem;color:#a3a3a3;margin-bottom:.75rem}

.steps-week-wrap{padding:.75rem 1.25rem 0}
.steps-week-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem}
.steps-week-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3);letter-spacing:.2em;text-transform:uppercase}
.steps-week-total{font-size:.75rem;font-family:'JetBrains Mono',monospace;color:var(--t2)}
.steps-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.375rem;margin-bottom:.5rem}
.steps-day-col{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.steps-day-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:var(--t4)}
.steps-day-bar-wrap{width:100%;height:2.5rem;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.steps-day-bar{width:100%;border-radius:.25rem .25rem 0 0;min-height:2px;transition:height .3s}
.steps-day-val{font-size:.45rem;font-family:'JetBrains Mono',monospace;color:var(--t3);text-align:center;margin-top:.125rem;line-height:1}
.steps-prog-bar-wrap{height:4px;background:rgba(38,38,38,.6);border-radius:999px;overflow:hidden;margin-top:.375rem}
.steps-prog-bar{height:100%;border-radius:999px;transition:width .5s}
.steps-prog-lbl{display:flex;justify-content:space-between;margin-top:.25rem}
.steps-prog-txt{font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:var(--t3)}

.past-nav{display:flex;align-items:center;justify-content:space-between;
  padding:.5rem 1.25rem .25rem;gap:.5rem}
.past-nav-btn{flex:1;padding:.5rem;border-radius:.625rem;border:1px solid var(--b1);
  background:rgba(23,23,23,.5);font-size:.6875rem;font-family:'JetBrains Mono',monospace;
  color:var(--t2);cursor:pointer;text-align:center;letter-spacing:.05em;transition:all .15s}
.past-nav-btn:active{background:rgba(38,38,38,.6);color:var(--t1)}
.past-nav-btn.accent{border-color:rgba(251,146,60,.3);color:var(--ac);background:rgba(251,146,60,.06)}

.yt-btn{display:inline-flex;align-items:center;gap:.2rem;padding:.15rem .35rem;
  border-radius:.3rem;background:rgba(255,0,0,.15);border:1px solid rgba(255,0,0,.25);
  color:#ff4444;text-decoration:none;font-size:.5rem;font-family:'JetBrains Mono',monospace;
  letter-spacing:.05em;flex-shrink:0;transition:background .15s;vertical-align:middle;margin-left:.375rem}
.yt-btn:active{background:rgba(255,0,0,.3)}

/* Welcome / setup screen */
.setup-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2rem 1.5rem;text-align:center}
.setup-logo{font-family:'Fraunces',Georgia,serif;font-size:4rem;font-style:italic;
  color:var(--ac);margin-bottom:.5rem;line-height:1}
.setup-title{font-family:'Fraunces',Georgia,serif;font-size:1.75rem;font-weight:500;
  color:var(--t1);margin-bottom:.5rem}
.setup-sub{font-size:.875rem;color:var(--t3);margin-bottom:2rem;line-height:1.5;max-width:20rem}
.setup-label{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3);
  letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem;text-align:left;width:100%;max-width:22rem}
.setup-inp{width:100%;max-width:22rem;background:rgba(23,23,23,.8);border:1px solid #3d3d3d;
  border-radius:.75rem;padding:.875rem 1rem;font-size:1.125rem;color:var(--t1);
  outline:none;text-align:center;margin-bottom:1rem}
.setup-inp:focus{border-color:var(--ac)}
.setup-inp::placeholder{color:#3a3a3a}
.setup-btn{width:100%;max-width:22rem;padding:.875rem;border-radius:.75rem;
  background:var(--ac);color:#0a0a0a;font-weight:600;font-size:.9375rem;
  letter-spacing:.05em;border:none;cursor:pointer;transition:transform .1s}
.setup-btn:active{transform:scale(.97)}
/* Name in header */
.name-row{display:flex;align-items:center;gap:.5rem;margin-top:.625rem}
.user-name{font-size:.875rem;color:var(--t2);flex:1;font-family:'JetBrains Mono',monospace;letter-spacing:.05em}
.edit-name-btn{background:transparent;border:none;color:var(--t4);cursor:pointer;
  padding:.25rem;font-size:.875rem;line-height:1;flex-shrink:0}
.edit-name-btn:active{color:var(--ac)}
.name-edit-row{display:flex;gap:.5rem;align-items:center;padding:.5rem 0 0}
.name-edit-inp{flex:1;background:rgba(23,23,23,.8);border:1px solid #3d3d3d;border-radius:.5rem;
  padding:.4rem .625rem;font-size:1rem;color:var(--t1);outline:none;font-family:'JetBrains Mono',monospace}
.name-edit-inp:focus{border-color:var(--ac)}
.name-save-btn{padding:.4rem .75rem;border-radius:.5rem;background:var(--ac);color:#0a0a0a;
  font-size:.75rem;font-weight:600;border:none;cursor:pointer;white-space:nowrap}

.user-list{width:100%;max-width:22rem;margin-bottom:1.25rem}
.user-list-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t3);
  letter-spacing:.2em;text-transform:uppercase;margin-bottom:.625rem;text-align:left}
.user-btn{width:100%;padding:.75rem 1rem;border-radius:.75rem;border:1px solid var(--b1);
  background:rgba(23,23,23,.6);color:var(--t1);font-size:.9375rem;text-align:left;
  cursor:pointer;margin-bottom:.375rem;display:flex;align-items:center;justify-content:space-between;
  transition:all .15s}
.user-btn:active{background:rgba(38,38,38,.7);border-color:var(--ac)}
.user-btn-name{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--t2)}
.user-btn-arrow{color:var(--t4);font-size:1rem}
.setup-divider{display:flex;align-items:center;gap:.75rem;width:100%;max-width:22rem;margin:.75rem 0}
.setup-divider-line{flex:1;height:1px;background:var(--b1)}
.setup-divider-txt{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--t4);letter-spacing:.1em}
.del-user-btn{background:transparent;border:none;color:var(--t4);cursor:pointer;
  padding:.25rem .5rem;font-size:.75rem;border-radius:.375rem}
.del-user-btn:active{color:#ef4444}

.set-ck{width:1.125rem;height:1.125rem;border-radius:50%;border:1.5px solid #3d3d3d;
  background:transparent;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;flex-shrink:0;transition:all .15s;margin:0 auto .2rem}
.set-ck.on{border-color:transparent}
.set-ck svg{display:none}
.set-ck.on svg{display:block}
.scard.set-done{background:rgba(23,23,23,.9)}
.yoga-sets{display:flex;gap:.375rem;margin-left:auto;align-items:center;flex-shrink:0}
.yoga-set-ck{width:1.25rem;height:1.25rem;border-radius:50%;border:1.5px solid #3d3d3d;
  background:transparent;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;flex-shrink:0;transition:all .15s}
.yoga-set-ck.on{border-color:transparent}
.yoga-set-ck svg{display:none}
.yoga-set-ck.on svg{display:block}

.chal-card{border-radius:1rem;border:1px solid rgba(251,146,60,.25);
  background:rgba(251,146,60,.05);overflow:hidden;margin-bottom:.5rem}
.chal-hdr{display:flex;align-items:center;gap:.5rem;padding:.625rem 1rem .375rem;
  cursor:pointer;user-select:none}
.chal-title{font-size:.625rem;font-family:'JetBrains Mono',monospace;color:var(--ac);
  letter-spacing:.2em;text-transform:uppercase;flex:1}
.chal-streak-badge{font-size:.625rem;font-family:'JetBrains Mono',monospace;
  color:#fb923c;background:rgba(251,146,60,.15);border-radius:.375rem;
  padding:.15rem .4rem;white-space:nowrap}
.chal-body{padding:.375rem .875rem .75rem}
.chal-row{display:flex;align-items:center;gap:.5rem;padding:.375rem 0;
  border-bottom:1px solid rgba(38,38,38,.4)}
.chal-row:last-child{border-bottom:none}
.chal-exname{font-size:.8125rem;color:var(--t2);flex:1;min-width:0}
.chal-streak{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#fb923c;
  white-space:nowrap}
.chal-inp{width:3.5rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;
  border-radius:.5rem;padding:.35rem .5rem;font-family:'JetBrains Mono',monospace;
  font-size:.9375rem;color:var(--t1);outline:none;text-align:center;flex-shrink:0}
.chal-inp:focus{border-color:var(--ac)}
.chal-unit{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;
  width:1.75rem;flex-shrink:0}
.chal-prev{font-size:.5625rem;font-family:'JetBrains Mono',monospace;color:#525252;
  white-space:nowrap}
/* Progress challenge */
.chal-prog-card{border-radius:1rem;border:1px solid rgba(251,146,60,.3);
  background:rgba(251,146,60,.06);padding:1rem;margin-bottom:1.25rem}
.chal-prog-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.75rem}
.chal-prog-title{font-family:'Fraunces',Georgia,serif;font-size:1.125rem;
  font-weight:500;color:var(--t1)}
.chal-prog-streak{font-size:1.5rem;font-family:'Fraunces',Georgia,serif;
  color:#fb923c;font-weight:500}
.chal-tgt-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
.chal-tgt-lbl{font-size:.625rem;font-family:'JetBrains Mono',monospace;
  color:#737373;letter-spacing:.1em;text-transform:uppercase;flex:1}
.chal-tgt-inp{width:4rem;background:rgba(23,23,23,.7);border:1px solid #3d3d3d;
  border-radius:.5rem;padding:.35rem .5rem;font-family:'JetBrains Mono',monospace;
  font-size:.9375rem;color:var(--t1);outline:none;text-align:center}
.chal-tgt-inp:focus{border-color:var(--ac)}
.chal-ex-row{display:flex;align-items:center;gap:.75rem;padding:.375rem 0}
.chal-ex-lbl{font-size:.8125rem;color:var(--t2);flex:1}
.chal-ex-stat{font-size:.6875rem;font-family:'JetBrains Mono',monospace;color:#525252}
.chal-ex-streak{font-size:.875rem;font-family:'JetBrains Mono',monospace;color:#fb923c}

.chal-badges{display:flex;gap:.375rem;flex-wrap:wrap;flex:1;justify-content:flex-end;margin-right:.375rem}
.chal-badge{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#737373;
  background:rgba(38,38,38,.5);border-radius:.25rem;padding:.1rem .35rem;white-space:nowrap}
.chal-streak-row{display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid rgba(38,38,38,.4)}
.chal-streak-cell{display:flex;flex-direction:column;align-items:center;
  padding:.5rem .25rem;border-right:1px solid rgba(38,38,38,.3)}
.chal-streak-cell:last-child{border-right:none}
.chal-sc-lbl{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#737373;
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem}
.chal-sc-val{font-size:1.25rem;font-family:'Fraunces',Georgia,serif;color:var(--t1);
  font-weight:500;line-height:1.1}
.chal-sc-unit{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252}
/* Week grid */
.chal-week-grid{width:100%;margin:.625rem 0}
.chal-wg-hdr,.chal-wg-row{display:grid;grid-template-columns:3rem repeat(7,1fr);gap:2px;margin-bottom:2px}
.chal-wg-dlbl,.chal-wg-exlbl{font-size:.45rem;font-family:'JetBrains Mono',monospace;
  color:#525252;text-align:center;padding:.2rem 0}
.chal-wg-cell{font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;
  text-align:center;padding:.25rem .1rem;border-radius:.25rem;background:rgba(23,23,23,.4)}
.chal-wg-cell.filled{color:#fb923c;background:rgba(251,146,60,.12)}
/* Progress ex row */
.chal-prog-ex-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.625rem}

function todayDayKey(){return DAY_JS[new Date().getDay()];}
function isoToday(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){const d=new Date(iso);return d.getDate()+' '+MONTHS[d.getMonth()];}
function fmtLong(){return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}

function getDetail(aid,week){
  const m=ACT[aid];if(!m)return null;
  if(aid.startsWith('gym')){const g=GYM[aid];return{...m,name:g.name,focus:g.focus,items:g.ex,isGym:true};}
  if(aid==='run') return{...m,name:'Run Intervals',focus:RUN[week],items:null};
  if(aid==='yoga')return{...m,name:'Yoga / Mobility',focus:'40–45 min flow',items:YOGA};
  if(aid==='swim')return{...m,name:'Swim',focus:'25–30 min',items:SWIM};
  if(aid==='golf')return{...m,name:'Golf',focus:'Walk the course',items:GOLF};
  if(aid==='run-yoga')return{...m,name:'Run + Yoga',focus:(RUN[week]||'Run intervals')+' · then Yoga flow',items:YOGA,isRunYoga:true};
  if(aid==='walk')return{...m,name:'Walk',focus:'Steps · Distance · Duration',items:null};
  return{...m,name:'Rest Day',focus:'Recovery — optional 20 min walk',items:null};
}

function exState(comp,idx){
  const e=comp?.exercises?.[idx];
  if(!e&&e!==0)return{done:false,sets:[]};
  if(typeof e==='boolean')return{done:e,sets:[]};
  return{done:!!e.done,sets:e.sets||[]};
}

function isBW(ex){return ex.bw||/Plank|Dead Bug|Push.?up|Lunge|Crunch/i.test(ex.n);}

function findPrev(exName,curWeek,curDay){
  // Check user logs (backward from current)
  const curDi=DAYS.indexOf(curDay);
  for(let w=curWeek;w>=1;w--){
    const maxDi=(w===curWeek)?curDi-1:DAYS.length-1;
    for(let di=maxDi;di>=0;di--){
      const d=DAYS[di];
      const c=S.completions['w'+w+'-'+d];
      if(!c?.exercises)continue;
      const aid=getSchedule(w)?.d[d];
      if(!aid?.startsWith('gym'))continue;
      const g=GYM[aid];if(!g)continue;
      const ei=g.ex.findIndex(e=>e.n===exName);
      if(ei<0)continue;
      const es=exState(c,ei);
      if(es.sets.some(s=>s?.weight||s?.reps))
        return{sets:es.sets,label:'Wk '+w,source:'log'};
    }
  }
  // Check HIST
  let best=null,bestD=null;
  for(const h of HIST){
    if(!h.ex[exName])continue;
    const d=new Date(h.date);
    if(!bestD||d>bestD){
      bestD=d;
      best={
        sets:h.ex[exName].map(s=>({weight:s.w||'',reps:s.r||''})),
        label:fmtDate(h.date)+(h.loc?' · '+h.loc:''),
        source:'hist'
      };
    }
  }
  return best;
}

function mkExtraCard(extra){

          const sc=document.createElement('div');sc.className='scard'+(s.weight||s.reps?' fi':'');
          let inn=`<div class="snum mf">SET ${si+1}</div>`;

            inn+=`<input class="sinp wt" type="text" inputmode="decimal" placeholder="${pw||'—'}" value="${s.weight||''}" data-extraid="${extra.id}" data-ei="${ei}" data-si="${si}" data-f="weight">`;

    di.onchange=(e)=>{
      const newDate=e.target.value;
      // Build updated extra with new date
      const updatedExtra={...extra, date:newDate};
      // Find which week this date falls in (search up to max possible week)
      const ed=new Date(newDate+'T00:00:00');
      if(!isNaN(ed.getTime())){
        const maxW=Math.max(52,S.week+4);
        let found=false;
        for(let w=0;w<=maxW;w++){
          const ws=weekStartDate(w),we=weekEndDate(w);
          ws.setHours(0,0,0,0);we.setHours(23,59,59,999);
          if(ed>=ws&&ed<=we){updatedExtra.week=w;S.week=w;found=true;break;}
        }
        // If date is before programme start, keep current week but update date
        if(!found) updatedExtra.week=extra.week;
      }
      // Replace in extras array using immutable update
      S.extras=S.extras.map(x=>x.id===extra.id?updatedExtra:x);
      saveNow();render();
    };
    dr.append(dl,di);ca.appendChild(dr);
    const cb=document.createElement('button');cb.className='cbtn'+(isDone?' dn':'');
    cb.style.background=isDone?'':det.color;

    }else{cb.textContent='MARK COMPLETE';}

      S.extras=[...S.extras.filter(x=>x.id!==extra.id),extra];save();render();
    };
    ca.appendChild(cb);wrap.appendChild(ca);
  }
  return wrap;
}

const WK0_START='2026-05-13';
const WK1_START='2026-05-18';

function weekStartDate(w){
  if(w===0)return new Date(WK0_START+'T00:00:00');
  const d=new Date(WK1_START+'T00:00:00');
  d.setDate(d.getDate()+(w-1)*7);return d;
}
function weekEndDate(w){
  if(w===0)return new Date('2026-05-17T00:00:00');
  const d=weekStartDate(w);d.setDate(d.getDate()+6);return d;
}
function isWeekFuture(w){
  const ws=weekStartDate(w);
  const today=new Date();today.setHours(0,0,0,0);ws.setHours(0,0,0,0);
  return ws>today;
}
function fmtWeekRange(w){
  const s=weekStartDate(w),e=weekEndDate(w);
  const sm=MONTHS[s.getMonth()],em=MONTHS[e.getMonth()];
  return s.getDate()+(sm!==em?' '+sm:'')+' – '+e.getDate()+' '+em;
}
function getExpectedDate(week,day){
  const ws=weekStartDate(week);
  ws.setDate(ws.getDate()+DAYS.indexOf(day));
  return ws.toISOString().slice(0,10);
}

function countSunSals(){
  let total=0;
  // From main completions — only yoga keys (activity is yoga or companion '-yoga' key)
  Object.entries(S.completions).forEach(([key,c])=>{
    if(!c?.exercises?.[0]?.actual)return;
    // Accept keys ending in '-yoga' (companion) or where the scheduled/overridden activity is yoga
    const isYogaKey=key.endsWith('-yoga');
    if(!isYogaKey){
      // Check if this slot is actually a yoga day
      const parts=key.split('-'); // ['w1','mon']
      const w=parseInt(parts[0].slice(1));const d=parts[1];
      const aid=(S.overrides&&S.overrides[key])||getSchedule(w)?.d[d];
      if(aid!=='yoga')return;
    }
    const n=parseInt(c.exercises[0].actual);
    if(!isNaN(n))total+=n;
  });
  // From extras (yoga type only)
  (S.extras||[]).forEach(e=>{
    if((e.activityId==='yoga'||e.activityId==='run-yoga')&&e.exercises?.[0]?.actual){
      const n=parseInt(e.exercises[0].actual);
      if(!isNaN(n))total+=n;
    }
  });
  return total;
}

function mkStepsRow(week,day){
  const key='w'+week+'-'+day;
  const val=(S.steps&&S.steps[key])||'';
  const row=document.createElement('div');row.className='steps-row';
  row.innerHTML=`
    <span class="steps-icon">👟</span>
    <span class="steps-lbl">Steps</span>
    <input class="steps-inp" type="text" inputmode="numeric" placeholder="—"
      value="${val}" data-stepskey="${key}">
    <span class="steps-unit">steps</span>`;
  row.querySelector('.steps-inp').onchange=(e)=>{
    if(!S.steps)S.steps={};
    S.steps[key]=e.target.value;
    save();
  };
  return row;
}

function mkStepsProgress(){
  const WDAY_TGT=7000, WEND_TGT=10000, WEEK_TGT=70000;
  const WEND_DAYS=new Set(['sat','sun']);
  const wrap=document.createElement('div');wrap.className='steps-sect';

  // Collect all step data
  const entries=[];
  for(let w=0;w<=24;w++){
    let wkTotal=0,wkDays=0,wkWend=0,wkWendDays=0,wkHits=0,wkDayCount=0;
    DAYS.forEach(d=>{
      const key='w'+w+'-'+d;
      const raw=(S.steps&&S.steps[key])||'';
      if(raw){
        const n=parseInt(raw.replace(/,/g,''));
        if(!isNaN(n)){
          const tgt=WEND_DAYS.has(d)?WEND_TGT:WDAY_TGT;
          entries.push({week:w,day:d,steps:n,hit:n>=tgt,isWend:WEND_DAYS.has(d),tgt});
          wkTotal+=n;wkDays++;
          if(WEND_DAYS.has(d)){wkWend+=n;wkWendDays++;}
          if(n>=tgt)wkHits++;
          wkDayCount++;
        }
      }
    });
  }

  // Overall stats
  const total=entries.length;
  const hitCount=entries.filter(e=>e.hit).length;
  const missCount=total-hitCount;
  const avg=total?Math.round(entries.reduce((s,e)=>s+e.steps,0)/total):0;
  const wendEntries=entries.filter(e=>e.isWend);
  const wendAvg=wendEntries.length?Math.round(wendEntries.reduce((s,e)=>s+e.steps,0)/wendEntries.length):0;

  const secLbl=document.createElement('div');secLbl.className='seclbl mf';
  secLbl.textContent='STEPS · 7K WEEKDAYS · 10K WEEKENDS · 70K/WEEK';
  wrap.appendChild(secLbl);

  // Stat cards
  const sg=document.createElement('div');sg.className='steps-stats-grid';
  [
    {val:avg?avg.toLocaleString():'—',   lbl:'Daily avg',    cls:''},
    {val:hitCount,                        lbl:'Days hit ✓',   cls:'hit'},
    {val:wendAvg?wendAvg.toLocaleString():'—', lbl:'Weekend avg', cls: wendAvg>=WEND_TGT?'hit':'miss'},
  ].forEach(({val,lbl,cls})=>{
    const sc=document.createElement('div');sc.className='sc';
    sc.innerHTML=`<div class="slb mf">${lbl}</div>
      <div class="sv sf" style="font-size:2.5rem;${cls==='hit'?'color:#34d399':cls==='miss'?'color:#fb923c':''}">${val}</div>`;
    sg.appendChild(sc);
  });
  wrap.appendChild(sg);

  // 12-week grid (now weekend-aware)
  const wmEl=document.createElement('div');
  wmEl.innerHTML='<div class="seclbl mf">STEPS MAP</div>';
  const mapWrap=document.createElement('div');mapWrap.className='steps-map';
  const hdr2=document.createElement('div');hdr2.className='steps-map-head';
  hdr2.innerHTML='<div class="steps-map-hlbl"></div>'+
    DAYS.map(d=>`<div class="steps-map-hlbl" style="${WEND_DAYS.has(d)?'color:#c084fc':''}">${DAY_SHORT[d]}</div>`).join('');
  mapWrap.appendChild(hdr2);

  let weeksHit70k=0;
  for(let w=0;w<=12;w++){
    let wkTotal=0;
    const row=document.createElement('div');row.className='steps-map-row';
    const wlbl=document.createElement('div');wlbl.className='steps-map-wlbl';wlbl.textContent='W'+String(w).padStart(2,'0');
    row.appendChild(wlbl);
    DAYS.forEach(d=>{
      const key='w'+w+'-'+d;
      const raw=(S.steps&&S.steps[key])||'';
      const n=raw?parseInt(raw.replace(/,/g,'')):NaN;
      const hasData=!isNaN(n)&&raw!=='';
      const isWend=WEND_DAYS.has(d);
      const tgt=isWend?WEND_TGT:WDAY_TGT;
      const hit=hasData&&n>=tgt;

      const dot=document.createElement('div');

      // Weekend misses use a different color
      if(miss&&isWend)dot.style.cssText='background:rgba(192,132,252,0.2);border:1px solid rgba(192,132,252,0.4)';
      if(hasData){
        const valEl=document.createElement('div');valEl.className='sdot-val';
        valEl.textContent=n>=1000?(n/1000).toFixed(1)+'k':String(n);
        if(miss&&isWend)valEl.style.color='#c084fc';
        dot.appendChild(valEl);
        dot.title=DAY_NAMES[d]+' Wk'+w+': '+n.toLocaleString()+' / '+tgt.toLocaleString()+' target '+(hit?'✓':'✗');
      }
      row.appendChild(dot);

    // Weekly total badge
    if(wkTotal>0){

      badge.style.cssText='grid-column:1/-1;font-size:.5rem;font-family:JetBrains Mono,monospace;padding:.125rem 0 .25rem;display:flex;justify-content:space-between;align-items:center';

  leg.innerHTML=`
    <div class="steps-leg-item"><div class="steps-leg-dot" style="background:rgba(52,211,153,.4)"></div>Hit target</div>
    <div class="steps-leg-item"><div class="steps-leg-dot" style="background:rgba(251,146,60,.35)"></div>Wday &lt;7k</div>
    <div class="steps-leg-item"><div class="steps-leg-dot" style="background:rgba(192,132,252,.35)"></div>Wend &lt;10k</div>`;
  mapWrap.appendChild(leg);
  wmEl.appendChild(mapWrap);wrap.appendChild(wmEl);

  // Weeks hitting 70k
  if(weeksHit70k>0){
    const wb=document.createElement('div');
    wb.style.cssText='margin-top:.75rem;font-size:.75rem;font-family:JetBrains Mono,monospace;color:#34d399;text-align:center';
    wb.textContent='🏆 '+weeksHit70k+' week'+(weeksHit70k!==1?'s':'')+' hit 70,000 step target';
    wrap.appendChild(wb);
  }
  return wrap;
}
// ── Total weight lifted calculation ──────────────────────────────────────────
function calcWeeklyLift(week){
  let total=0;
  DAYS.forEach(d=>{
    const key='w'+week+'-'+d;
    const c=S.completions[key];
    if(!c?.exercises)return;
    const aid=(S.overrides&&S.overrides[key])||getSchedule(week)?.d[d];
    if(!aid?.startsWith('gym'))return;
    const g=GYM[aid];if(!g)return;
    g.ex.forEach((ex,ei)=>{
      const es=exState(c,ei);
      es.sets.forEach(s=>{
        const w=parseFloat(s?.weight),r=parseFloat(s?.reps);
        if(!isNaN(w)&&!isNaN(r)&&w>0&&r>0)total+=w*r;
      });
    });
  });
  (S.extras||[]).filter(e=>e.week===week&&e.activityId?.startsWith('gym')).forEach(e=>{
    const g=GYM[e.activityId];if(!g)return;
    g.ex.forEach((ex,ei)=>{
      const es=exState({exercises:e.exercises||{}},ei);
      es.sets.forEach(s=>{
        const w=parseFloat(s?.weight),r=parseFloat(s?.reps);
        if(!isNaN(w)&&!isNaN(r)&&w>0&&r>0)total+=w*r;
      });
    });
  });
  return total>0?Math.round(total):null;
}

// ── SVG line chart ────────────────────────────────────────────────────────────
function mkLineChart(points,opts={}){
  const{color='#fb923c',unit='',target,targetSeries,label=''}=opts;
  const filled=points.filter(p=>p.v!==''&&p.v!==null&&p.v!==undefined&&!isNaN(parseFloat(p.v)));
  if(filled.length<1){
    const empty=document.createElement('div');empty.className='chart-empty';
    empty.textContent='No data logged yet';return empty;
  }
  const vals=filled.map(p=>parseFloat(p.v));
  const tgtVal=target?parseFloat(target):null;
  // Collect all values for scale (actuals + target series)
  const allVals=[...vals];
  if(tgtVal)allVals.push(tgtVal);
  if(targetSeries&&targetSeries.length)targetSeries.forEach(p=>allVals.push(parseFloat(p.v)));
  const minV=Math.min(...allVals);const maxV=Math.max(...allVals);
  const pad2=Math.max((maxV-minV)*0.12,0.5);
  const lo=minV-pad2,hi=maxV+pad2,range=hi-lo||1;
  const W=320,H=90,pL=36,pR=16,pT=8,pB=22;
  const iW=W-pL-pR,iH=H-pT-pB;
  const xOf=i=>pL+(i/(Math.max(filled.length-1,1)))*iW;
  const yOf=v=>pT+iH-((v-lo)/range)*iH;
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.style.cssText='width:100%;height:75px;overflow:visible;display:block';

  // Grid lines + y labels
  [0,1,2,3].forEach(i=>{
    const y=pT+(i*iH/3);
    const gl=document.createElementNS(ns,'line');
    gl.setAttribute('x1',pL);gl.setAttribute('x2',pL+iW);
    gl.setAttribute('y1',y);gl.setAttribute('y2',y);
    gl.setAttribute('stroke','#262626');gl.setAttribute('stroke-width','0.5');
    svg.appendChild(gl);
    const v=hi-(i*(hi-lo)/3);
    const txt=document.createElementNS(ns,'text');
    txt.setAttribute('x',pL-3);txt.setAttribute('y',y+3);
    txt.setAttribute('text-anchor','end');txt.setAttribute('font-size','6.5');
    txt.setAttribute('fill','#525252');txt.setAttribute('font-family','JetBrains Mono,monospace');
    txt.textContent=v>=1000?Math.round(v/100)/10+'k':v.toFixed(v<10?1:0);
    svg.appendChild(txt);
  });

  // Target series (weekly step targets — diagonal dashed line)
  if(targetSeries&&targetSeries.length>=2){
    // Map target series x to same scale as actual data (by week number)
    const allWeeks=filled.map(p=>p.w);
    const minW=Math.min(...allWeeks),maxW=Math.max(...allWeeks);
    const xOfW=w=>pL+((w-minW)/(maxW-minW||1))*iW;
    const tsFilled=targetSeries.filter(p=>p.w>=minW&&p.w<=maxW);
    if(tsFilled.length>=2){
      const tpathD='M '+tsFilled.map(p=>`${xOfW(p.w)},${yOf(parseFloat(p.v))}`).join(' L ');
      const tpath=document.createElementNS(ns,'path');
      tpath.setAttribute('d',tpathD);tpath.setAttribute('fill','none');
      tpath.setAttribute('stroke',color);tpath.setAttribute('stroke-width','1.25');
      tpath.setAttribute('stroke-dasharray','4,3');tpath.setAttribute('opacity','0.55');
      svg.appendChild(tpath);
    }
  } else if(tgtVal!==null&&!isNaN(tgtVal)){
    // Flat target line (fallback)
    const ty=yOf(tgtVal);
    const tl=document.createElementNS(ns,'line');
    tl.setAttribute('x1',pL);tl.setAttribute('x2',pL+iW);
    tl.setAttribute('y1',ty);tl.setAttribute('y2',ty);
    tl.setAttribute('stroke',color);tl.setAttribute('stroke-width','1');
    tl.setAttribute('stroke-dasharray','4,3');tl.setAttribute('opacity','0.4');
    svg.appendChild(tl);
  }

  // Area fill
  if(filled.length>1){
    const aD='M '+filled.map((p,i)=>`${xOf(i)},${yOf(parseFloat(p.v))}`).join(' L ')+
      ` L ${xOf(filled.length-1)},${pT+iH} L ${xOf(0)},${pT+iH} Z`;
    const area=document.createElementNS(ns,'path');
    area.setAttribute('d',aD);area.setAttribute('fill',color);area.setAttribute('opacity','0.1');
    svg.appendChild(area);
    const lD='M '+filled.map((p,i)=>`${xOf(i)},${yOf(parseFloat(p.v))}`).join(' L ');
    const lp=document.createElementNS(ns,'path');
    lp.setAttribute('d',lD);lp.setAttribute('fill','none');
    lp.setAttribute('stroke',color);lp.setAttribute('stroke-width','1.75');
    lp.setAttribute('stroke-linejoin','round');lp.setAttribute('stroke-linecap','round');
    svg.appendChild(lp);
  }

  // Dots + x labels
  const showEvery=filled.length>8?3:filled.length>5?2:1;
  filled.forEach((p,i)=>{
    const cx=xOf(i),cy=yOf(parseFloat(p.v));
    const isLast=i===filled.length-1;
    const dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);
    dot.setAttribute('r',isLast?3.5:2.5);
    dot.setAttribute('fill',isLast?color:'rgba(255,255,255,0.7)');
    dot.setAttribute('stroke',color);dot.setAttribute('stroke-width','1.5');
    svg.appendChild(dot);
    if(i%showEvery===0||isLast){
      const xt=document.createElementNS(ns,'text');
      xt.setAttribute('x',cx);xt.setAttribute('y',H-5);
      xt.setAttribute('text-anchor','middle');xt.setAttribute('font-size','6.5');
      xt.setAttribute('fill','#525252');xt.setAttribute('font-family','JetBrains Mono,monospace');
      xt.textContent='W'+String(p.w).padStart(2,'0');
      svg.appendChild(xt);
    }
  });
  return svg;
}


function mkMeasurementsSection(selectedWeek){
  const wrap=document.createElement('div');wrap.className='meas-section';
  wrap.innerHTML='<div class="seclbl mf">WEEKLY MEASUREMENTS</div>';

  // Week selector
  const wsel=document.createElement('div');wsel.className='meas-week-sel';
  wsel.innerHTML='<span class="meas-week-lbl">Week</span>';
  [-2,-1,0].forEach(offset=>{
    const w=selectedWeek+offset;
    if(w<0||w>24)return;
    const btn=document.createElement('button');btn.className='meas-week-btn'+(w===selectedWeek?' active':'');
    btn.textContent='W'+String(w).padStart(2,'0');
    btn.onclick=()=>{S._measWeek=w;save();render();};
    wsel.appendChild(btn);
  });
  if(selectedWeek<24){
    const nBtn=document.createElement('button');nBtn.className='meas-week-btn'+(selectedWeek===S.week?' active':'');
    nBtn.textContent='W'+String(S.week).padStart(2,'0');
    if(S.week!==selectedWeek-2&&S.week!==selectedWeek-1&&S.week!==selectedWeek){
      nBtn.onclick=()=>{S._measWeek=S.week;save();render();};
      wsel.appendChild(nBtn);
    }
  }
  wrap.appendChild(wsel);

  // Auto-calculated lift
  const liftTotal=calcWeeklyLift(selectedWeek);
  const m=S.measurements['w'+selectedWeek]||{};

  const card=document.createElement('div');card.className='meas-card';
  const wkDate=fmtWeekRange(selectedWeek);
  card.innerHTML=`<div style="font-size:.5rem;font-family:'JetBrains Mono',monospace;color:#525252;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.75rem">W${String(selectedWeek).padStart(2,'0')} · ${wkDate}</div>`;

  const FIELDS=[
    {key:'weight',    label:'Body Weight',  unit:'kg',   group:'body'},
    {key:'bodyFat',   label:'Body Fat',     unit:'%',    group:'body'},
    {key:'muscleMass',label:'Muscle Mass',  unit:'kg',   group:'body'},
    {key:'waist',     label:'Waist',        unit:'cm',   group:'body'},
    {key:'chest',     label:'Chest',        unit:'cm',   group:'body'},
    {key:'hips',      label:'Hips',         unit:'cm',   group:'body'},
    {key:'thigh',     label:'Thigh',        unit:'cm',   group:'body'},
    {key:'arm',       label:'Arm',          unit:'cm',   group:'body'},
    {key:'runDist',   label:'Run Distance', unit:'km',   group:'perf'},
    {key:'golfHcp',   label:'Golf Handicap',unit:'',     group:'perf'},
  ];

  const grid=document.createElement('div');grid.className='meas-grid';
  FIELDS.forEach(f=>{
    const fld=document.createElement('div');fld.className='meas-field';
    const lbl=document.createElement('div');lbl.className='meas-field-lbl';lbl.textContent=f.label+(f.unit?' ('+f.unit+')':'');
    const inp=document.createElement('input');inp.className='meas-inp';
    inp.type='text';inp.inputMode='decimal';
    inp.placeholder='—';inp.value=m[f.key]||'';
    inp.setAttribute('data-measweek','w'+selectedWeek);
    inp.setAttribute('data-measkey',f.key);
    fld.append(lbl,inp);grid.appendChild(fld);
  });

  // Auto-calculated lift field
  const liftFld=document.createElement('div');liftFld.className='meas-field';
  const liftLbl=document.createElement('div');liftLbl.className='meas-field-lbl';liftLbl.textContent='Total Lifted (kg)';
  const liftInp=document.createElement('input');liftInp.className='meas-inp readonly';
  liftInp.readOnly=true;
  liftInp.value=liftTotal?liftTotal.toLocaleString():'— (log weights first)';
  liftFld.append(liftLbl,liftInp);grid.appendChild(liftFld);

  card.appendChild(grid);

  // Save button
  const saveBtn=document.createElement('button');
  saveBtn.className='cbtn';saveBtn.style.cssText='margin-top:.875rem;background:var(--ac);color:#0a0a0a;width:100%';
  saveBtn.textContent='Save Measurements';
  saveBtn.onclick=()=>{
    const wk='w'+selectedWeek;
    const meas=S.measurements[wk]||{};
    grid.querySelectorAll('.meas-inp:not(.readonly)').forEach(inp=>{
      if(inp.value.trim())meas[inp.getAttribute('data-measkey')]=inp.value.trim();
    });
    // Store auto-calculated lift
    if(liftTotal)meas.totalLift=liftTotal;
    S.measurements={...S.measurements,[wk]:meas};
    save();render();
  };
  card.appendChild(saveBtn);
  wrap.appendChild(card);
  return wrap;
}

const METRIC_DIR={weight:false,bodyFat:false,muscleMass:true,waist:false,chest:true,hips:false,thigh:false,arm:true,runDist:true,golfHcp:false,totalLift:true};
const METRIC_META={
  weight:{label:'Body Weight',unit:'kg'},bodyFat:{label:'Body Fat',unit:'%'},muscleMass:{label:'Muscle Mass',unit:'kg'},
  waist:{label:'Waist',unit:'cm'},chest:{label:'Chest',unit:'cm'},

function mkWeek12Comparison(){
  const wrap=document.createElement('div');
  wrap.innerHTML='<div class="seclbl mf" style="margin-bottom:.625rem">WEEK 12 — TARGET vs ACTUAL</div>';

  const tgts=S.targets||{};
  const w12=S.measurements['w12']||{};
  // Get week 12 total lift
  const w12Lift=w12.totalLift||calcWeeklyLift(12);
  if(w12Lift)w12.totalLift=w12Lift;
  // Week 0 baseline
  const w0=S.measurements['w0']||{};

  const hasAnyTarget=Object.values(tgts).some(v=>v!==''&&v!==null&&v!==undefined);
  const hasAnyActual=Object.keys(w12).length>0;

  if(!hasAnyTarget&&!hasAnyActual){
    const empty=document.createElement('div');
    empty.style.cssText='border-radius:1rem;border:1px solid #262626;background:rgba(23,23,23,.4);padding:1.25rem;text-align:center;font-size:.75rem;color:#525252;font-family:JetBrains Mono,monospace;margin-bottom:1.25rem';
    empty.textContent='Set targets above and log Week 12 measurements to see comparison';
    wrap.appendChild(empty);return wrap;
  }

  const card=document.createElement('div');
  card.style.cssText='border-radius:1rem;border:1px solid rgba(38,38,38,.6);background:rgba(23,23,23,.4);overflow:hidden;margin-bottom:1.25rem';

  // Header row
  const hdr=document.createElement('div');
  hdr.style.cssText='display:grid;grid-template-columns:1fr .8fr .8fr .8fr;gap:.5rem;padding:.625rem .875rem;border-bottom:1px solid #262626;background:rgba(23,23,23,.6)';
  hdr.innerHTML='<span style="font-size:.5rem;font-family:JetBrains Mono,monospace;color:#525252;letter-spacing:.1em;text-transform:uppercase">Metric</span>'+
    '<span style="font-size:.5rem;font-family:JetBrains Mono,monospace;color:#525252;letter-spacing:.1em;text-transform:uppercase;text-align:right">Target</span>'+
    '<span style="font-size:.5rem;font-family:JetBrains Mono,monospace;color:#525252;letter-spacing:.1em;text-transform:uppercase;text-align:right">Wk 12</span>'+
    '<span style="font-size:.5rem;font-family:JetBrains Mono,monospace;color:#525252;letter-spacing:.1em;text-transform:uppercase;text-align:right">Δ</span>';
  card.appendChild(hdr);

  Object.entries(METRIC_META).forEach(([key,meta])=>{
    const tgt=tgts[key];
    const actual=w12[key];
    if(!tgt&&!actual)return;

    const tgtVal=tgt?parseFloat(tgt):null;
    const actVal=actual?parseFloat(actual):null;
    const delta=(tgtVal!==null&&actVal!==null)?actVal-tgtVal:null;
    const higherBetter=METRIC_DIR[key];

    // Met target?
    let status='';let statusColor='';
    if(delta!==null){
      const met=higherBetter?(actVal>=tgtVal):(actVal<=tgtVal);
      const close=Math.abs(delta/tgtVal)<0.05;
      status=met?'✓':(close?'~':'✗');
      statusColor=met?'#a3e635':(close?'#f59e0b':'#fb923c');
    }

    const row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:1fr .8fr .8fr .8fr;gap:.5rem;padding:.5rem .875rem;border-bottom:1px solid rgba(38,38,38,.3);align-items:center';

    row.innerHTML=`
      <span style="font-size:.75rem;color:#a3a3a3">${meta.label}</span>
      <span style="font-size:.75rem;font-family:'JetBrains Mono',monospace;color:#737373;text-align:right">${tgt?tgt+meta.unit:'—'}</span>
      <span style="font-size:.875rem;font-family:'JetBrains Mono',monospace;color:${actVal?'#fafaf9':'#525252'};text-align:right;font-weight:500">${actVal!==null?actVal+meta.unit:'—'}</span>
      <span style="font-size:.75rem;font-family:'JetBrains Mono',monospace;text-align:right;color:${statusColor||'#525252'}">
        ${delta!==null?(delta>0?'+':'')+delta.toFixed(1):''} ${status}
      </span>`;
    card.appendChild(row);
  });

  // Overall score
  let met=0,total=0;
  Object.entries(METRIC_META).forEach(([key])=>{
    const tgt=tgts[key];const actual=w12[key];
    if(!tgt||!actual)return;
    total++;
    const tgtV=parseFloat(tgt),actV=parseFloat(actual);
    if(METRIC_DIR[key]?actV>=tgtV:actV<=tgtV)met++;
  });
  if(total>0){
    const score=document.createElement('div');
    score.style.cssText='padding:.75rem .875rem;background:rgba(23,23,23,.6);display:flex;justify-content:space-between;align-items:center';
    const pct=Math.round((met/total)*100);
    const c=pct>=80?'#a3e635':pct>=50?'#f59e0b':'#fb923c';
    score.innerHTML=`<span style="font-size:.75rem;color:#a3a3a3;font-family:'JetBrains Mono',monospace">Targets hit</span>
      <span style="font-family:'Fraunces',Georgia,serif;font-size:1.25rem;font-weight:500;color:${c}">${met}/${total} <span style="font-size:.75rem">(${pct}%)</span></span>`;
    card.appendChild(score);
  }
  wrap.appendChild(card);
  return wrap;
}

function mkWeekStepsSummary(week){
  const WEEK_TGT=70000;const WEND_DAYS=new Set(['sat','sun']);
  const WDAY_TGT=7000,WEND_TGT=10000;
  let total=0,logged=0;
  const dayData=DAYS.map(d=>{
    const raw=(S.steps&&S.steps['w'+week+'-'+d])||'';
    const n=raw?parseInt(raw.replace(/,/g,'')):NaN;
    const hasData=!isNaN(n)&&raw!=='';
    if(hasData){total+=n;logged++;}
    return{d,n:hasData?n:null,tgt:WEND_DAYS.has(d)?WEND_TGT:WDAY_TGT};
  });
  if(logged===0)return null;
  const pct=Math.min(100,Math.round((total/WEEK_TGT)*100));
  const barColor=pct>=100?'#34d399':pct>=70?'#f59e0b':'#fb923c';

  const wrap=document.createElement('div');wrap.className='steps-week-wrap';
  const hdr=document.createElement('div');hdr.className='steps-week-hdr';
  hdr.innerHTML=`<span class="steps-week-lbl">Steps this week</span>
    <span class="steps-week-total" style="color:${barColor}">${total.toLocaleString()} <span style="color:#525252;font-size:.6rem">/ 70k</span></span>`;
  wrap.appendChild(hdr);

  // Bar chart per day
  const maxN=Math.max(...dayData.filter(x=>x.n!==null).map(x=>x.n),WEND_TGT);
  const grid=document.createElement('div');grid.className='steps-week-grid';
  dayData.forEach(({d,n,tgt})=>{
    const col=document.createElement('div');col.className='steps-day-col';
    const isWend=WEND_DAYS.has(d);
    const hit=n!==null&&n>=tgt;
    const miss=n!==null&&!hit;
    const barH=n!==null?Math.max(4,Math.round((n/maxN)*40)):0;
    const barColor2=hit?'#34d399':miss?(isWend?'#c084fc':'#fb923c'):'#262626';
    col.innerHTML=`
      <div class="steps-day-lbl" style="${isWend?'color:#c084fc':''}">${DAY_SHORT[d]}</div>
      <div class="steps-day-bar-wrap">
        <div class="steps-day-bar" style="height:${barH}px;background:${barColor2}"></div>
      </div>
      <div class="steps-day-val">${n!==null?(n>=1000?(n/1000).toFixed(1)+'k':n):'—'}</div>`;
    grid.appendChild(col);
  });
  wrap.appendChild(grid);

  // Progress toward 70k
  const pb=document.createElement('div');pb.className='steps-prog-bar-wrap';
  pb.innerHTML=`<div class="steps-prog-bar" style="width:${pct}%;background:${barColor}"></div>`;
  const pl=document.createElement('div');pl.className='steps-prog-lbl';
  pl.innerHTML=`<span class="steps-prog-txt">${pct}% of 70,000 weekly target</span>
    <span class="steps-prog-txt">${(WEEK_TGT-total).toLocaleString()} to go</span>`;
  wrap.appendChild(pb);wrap.appendChild(pl);
  return wrap;
}

function getWeekLabel(week){
  if(isWeekFuture(week))return null;
  const schd=getSchedule(week).d;
  let gym=0,run=0,yoga=0,golf=0,walk=0,swim=0;
  DAYS.forEach(d=>{
    const key='w'+week+'-'+d;
    if(!S.completions[key]?.done)return;
    const aid=(S.overrides&&S.overrides[key])||schd[d];
    if(aid.startsWith('gym'))gym++;
    else if(aid==='run')run++;
    else if(aid==='yoga')yoga++;
    else if(aid==='golf')golf++;
    else if(aid==='walk')walk++;
    else if(aid==='swim')swim++;
  });
  (S.extras||[]).filter(e=>e.week===week&&e.done).forEach(e=>{
    const a=e.activityId;
    if(a.startsWith('gym'))gym++;else if(a==='run')run++;
    else if(a==='yoga')yoga++;else if(a==='golf')golf++;
    else if(a==='walk')walk++;else if(a==='swim')swim++;
  });
  const total=gym+run+yoga+golf+walk+swim;
  const cardio=run+walk;
  const flex=yoga+golf;
  if(total<=1) return{label:"Death's Door",emoji:'💀',color:'#ef4444',bg:'rgba(239,68,68,.15)',total};
  if(total<=3) return{label:'Disaster',emoji:'🔥',color:'#fb923c',bg:'rgba(251,146,60,.15)',total};
  if(gym>=2&&gym<=3&&run>=2&&run<=3&&yoga>=1&&yoga<=2&&(golf+walk)>=1)
    return{label:'Balanced',emoji:'⚖️',color:'#a3e635',bg:'rgba(163,230,53,.15)',total};
  if((gym>=3||(gym>=2&&yoga>=2))&&cardio<=1)
    return{label:'Strength',emoji:'💪',color:'#f59e0b',bg:'rgba(245,158,11,.15)',total};
  if(cardio>=3||(cardio>=2&&cardio>gym&&cardio>=flex))
    return{label:'Cardio',emoji:'🏃',color:'#60a5fa',bg:'rgba(96,165,250,.15)',total};
  if(flex>=3||(flex>=2&&flex>gym&&flex>=cardio))
    return{label:'Flexibility',emoji:'🧘',color:'#c084fc',bg:'rgba(192,132,252,.15)',total};
  if(gym>=cardio&&gym>=flex&&gym>=1) return{label:'Strength',emoji:'💪',color:'#f59e0b',bg:'rgba(245,158,11,.15)',total};
  if(cardio>flex) return{label:'Cardio',emoji:'🏃',color:'#60a5fa',bg:'rgba(96,165,250,.15)',total};
  return{label:'Flexibility',emoji:'🧘',color:'#c084fc',bg:'rgba(192,132,252,.15)',total};
}

function moveSession(oldKey, newDateStr){
  // Work out which week+day the new date falls in
  const d=new Date(newDateStr+'T00:00:00');
  if(isNaN(d.getTime()))return oldKey; // invalid date — bail
  let newWeek=-1, newDay='';
  for(let w=0;w<=24;w++){
    const ws=weekStartDate(w),we=weekEndDate(w);
    ws.setHours(0,0,0,0);we.setHours(23,59,59,999);
    if(d>=ws&&d<=we){newWeek=w;newDay=DAY_JS[d.getDay()];break;}
  }
  if(newWeek===-1)return oldKey; // date outside programme range

  // Build new key (handle yoga companion suffix)
  const suffix=oldKey.endsWith('-yoga')?'-yoga':'';
  const newKey='w'+newWeek+'-'+newDay+suffix;

  if(newKey===oldKey)return oldKey; // nothing changed

  // Move the completion data
  const comp=S.completions[oldKey]||{};
  const newComps={...S.completions};
  delete newComps[oldKey];
  newComps[newKey]={...comp,sessionDate:newDateStr};
  S.completions=newComps;
  S.week=newWeek;
  S.expanded=newDay;
  saveNow();
  return newKey;
}

// ── CHALLENGE ──────────────────────────────────────────────────────────────
function getChallengeStreak(exercise){
  if(!S.challenge||!S.challenge.log)return 0;
  const d=new Date(isoToday()+'T00:00:00');
  let streak=0;
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    const e=S.challenge.log[ds];
    if(e&&e[exercise]&&parseFloat(e[exercise])>0){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}
function getChallengeStreakAll(){
  if(!S.challenge||!S.challenge.log)return 0;
  const d=new Date(isoToday()+'T00:00:00');
  let streak=0;
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    const e=S.challenge.log[ds]||{};
    if(parseFloat(e.pushups)>0&&parseFloat(e.squats)>0&&parseFloat(e.plank)>0){
      streak++;d.setDate(d.getDate()-1);
    } else break;
  }
  return streak;
}
function getChallengeMax(exercise){
  if(!S.challenge||!S.challenge.log)return 0;
  return Math.max(0,...Object.values(S.challenge.log)
    .map(e=>parseFloat(e[exercise])||0));
}
function saveChallengeEntry(dateStr,field,val){
  if(!S.challenge)S.challenge={targetDays:0,log:{}};
  if(!S.challenge.log)S.challenge.log={};
  S.challenge.log[dateStr]={...(S.challenge.log[dateStr]||{}), [field]:val};
  save();
}

      const tlbl=document.createElement('div');tlbl.className='mday-lbl';
      tlbl.style.marginBottom='.375rem';tlbl.textContent='THIS WEEK\'S STEP TARGET';
      tbl.appendChild(tlbl);
      const tgrid=document.createElement('div');tgrid.className='mday-grid';
      tgtRows.forEach(f=>{
        const wt=getWeeklyTarget(f.key,week);
        if(wt===null)return;
        const cur=parseFloat((S.measurements[wk]||{})[f.key]);
        const onTrack=!isNaN(cur)?(f.dir?cur>=wt:cur<=wt):null;
        const fd=document.createElement('div');fd.className='mday-field';
        const lbl2=document.createElement('div');lbl2.className='mday-lbl';lbl2.textContent=f.lbl;
        const val=document.createElement('div');
        val.style.cssText='font-size:.9375rem;font-family:JetBrains Mono,monospace;color:'+(onTrack===true?'#a3e635':onTrack===false?'#f87171':'#fb923c');
        val.textContent=wt+f.unit+(onTrack===true?' ✓':onTrack===false?(f.dir?' ↑':' ↓'):'');
        fd.append(lbl2,val);tgrid.appendChild(fd);
      });
      tbl.appendChild(tgrid);
      body.appendChild(tbl);
    }
    // Auto-calc total lift
    const lift=calcWeeklyLift(week);
    if(lift){
      const lf=document.createElement('div');
      lf.style.cssText='font-size:.5625rem;font-family:JetBrains Mono,monospace;color:#737373;margin-bottom:.5rem';
      lf.textContent='Total lifted this week: '+lift.toLocaleString()+' kg (auto-calculated)';
      body.appendChild(lf);
    }

    const saveBtn=document.createElement('button');saveBtn.className='mday-save-btn';
    saveBtn.textContent='Save Measurements';
    saveBtn.onclick=()=>{
      // Collect all filled inputs
      const meas={...(S.measurements[wk]||{})};
      body.querySelectorAll('[data-mday-key]').forEach(inp=>{
        if(inp.value.trim()) meas[inp.getAttribute('data-mday-key')]=inp.value.trim();
      });
      if(lift) meas.totalLift=lift;
      S.measurements={...S.measurements,[wk]:meas};
      S.expanded=null;save();render();
    };
    body.appendChild(saveBtn);
    wrap.appendChild(body);
  }
  return wrap;
}

function getWeeklyTarget(metricKey, week){
  if(!S.targets||!S.targets[metricKey])return null;
  const finalTgt=parseFloat(S.targets[metricKey]);
  if(isNaN(finalTgt))return null;
  // Find baseline: first logged week for this metric
  let startVal=null,startWeek=0;
  for(let w=0;w<=12;w++){
    const mv=S.measurements['w'+w]&&S.measurements['w'+w][metricKey];
    if(mv&&!isNaN(parseFloat(mv))){startVal=parseFloat(mv);startWeek=w;break;}
  }
  if(startVal===null)return finalTgt; // no data yet
  if(week<=startWeek)return parseFloat(startVal.toFixed(1));
  const weeksLeft=12-startWeek;
  if(weeksLeft<=0)return parseFloat(finalTgt.toFixed(1));
  const step=(finalTgt-startVal)/weeksLeft;
  return parseFloat((startVal+step*(week-startWeek)).toFixed(1));
}

function getWeeklyTargetSeries(metricKey){
  const pts=[];
  for(let w=0;w<=12;w++){
    const t=getWeeklyTarget(metricKey,w);
    if(t!==null)pts.push({w,v:t});
  }
  return pts;
}

function getCompletedSessionCount(type){
  // type: 'gym','run','yoga','golf','swim','walk' or null=any
  let count=0;
  Object.entries(S.completions||{}).forEach(([key,c])=>{
    if(!c||!c.done)return;
    const parts=key.split('-');if(parts.length<2)return;
    const w=parseInt(parts[0].slice(1)),d=parts[1];
    if(isNaN(w)||!d||d==='yoga')return;
    const aid=(S.overrides&&S.overrides[key])||getSchedule(w)?.d[d];
    if(!aid)return;
    if(!type||(type==='gym'&&aid.startsWith('gym'))||aid===type)count++;
  });
  (S.extras||[]).forEach(e=>{
    if(!e.done)return;
    if(!type||(type==='gym'&&e.activityId?.startsWith('gym'))||e.activityId===type)count++;
  });
  return count;
}

function getTotalWeightLifted(){
  let total=0;
  Object.entries(S.completions||{}).forEach(([key,c])=>{
    if(!c?.exercises)return;
    const parts=key.split('-');if(parts.length<2)return;
    const w=parseInt(parts[0].slice(1)),d=parts[1];
    if(isNaN(w)||!d)return;
    const aid=(S.overrides&&S.overrides[key])||getSchedule(w)?.d[d];
    if(!aid?.startsWith('gym'))return;
    const g=GYM[aid];if(!g)return;
    g.ex.forEach((ex,ei)=>{
      const es=exState(c,ei);
      es.sets.forEach(s=>{
        const wt=parseFloat(s?.weight),r=parseFloat(s?.reps);
        if(!isNaN(wt)&&!isNaN(r)&&wt>0&&r>0)total+=wt*r;
      });
    });
  });
  return Math.round(total);
}

function getWeeks70k(){
  let n=0;
  for(let w=0;w<=Math.max(24,S.week);w++){
    let tot=0;
    DAYS.forEach(d=>{const raw=(S.steps||{})['w'+w+'-'+d];if(raw){const n2=parseInt(raw);if(!isNaN(n2))tot+=n2;}});
    if(tot>=70000)n++;
  }
  return n;
}

        const mtEl=document.createElement('span');mtEl.className='exmt mf';

          sck.className='set-ck'+(setDone?' on':'');

          sck.onclick=(e)=>{e.stopPropagation();

      det.items.forEach((item,ii)=>{
        const es=exState(comp,ii);
        const isYoga=aid==='yoga';

          ckBtn.onclick=(e)=>{e.stopPropagation();

            const exs={...c.exercises};const cur=exState({exercises:exs},ii);

            <div class="sunsal-bar"><div class="sunsal-bar-fill" style="width:${pct}%"></div></div>`;
          ssRow.append(ssHdr,ssInpRow,progWrap);
          inner.appendChild(ssRow);
          return;
        }

        const row=document.createElement('div');row.className='irow';row.style.cursor='pointer';
        const ckBtn=document.createElement('button');
        ckBtn.className='ck'+(es.done?' on':'');
        ckBtn.style.background=es.done?det.color:'transparent';
        ckBtn.innerHTML=es.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
        const nm=document.createElement('span');nm.className='inm'+(es.done?' dn':'');nm.textContent=item.n||item.name;
        const mt=document.createElement('span');mt.className='imt mf';mt.textContent=isYoga?'':tgt;
        ckBtn.onclick=(e)=>{e.stopPropagation();
          const c=S.completions[compKey]||{exercises:{}};
          const exs={...c.exercises};const cur=exState({exercises:exs},ii);
          exs[ii]={done:!cur.done,sets:cur.sets,actual:cur.actual};
          S.completions={...S.completions,[compKey]:{...c,exercises:exs}};save();render();};

        if(isYoga){
          const numSets=yogaSetCount(tgt);
          const aw=document.createElement('div');aw.className='actual-wrap';

          if(numSets>1){

              yck.className='yoga-set-ck'+(ysDone?' on':'');
