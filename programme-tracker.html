              yck.style.borderColor=ysDone?'transparent':det.border;
              yck.title=`Set ${yi+1}`;
              yck.innerHTML=ysDone?'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
              yck.onclick=(e)=>{e.stopPropagation();
                const c=S.completions[compKey]||{exercises:{}};
                const exs={...(c.exercises||{})};
                const cur=exState({exercises:exs},ii);
                const newSets=cur.sets.slice();
                while(newSets.length<=yi)newSets.push({});
                newSets[yi]={...newSets[yi],done:!ysDone};
                // Preserve done state — user completes session manually
                exs[ii]={done:cur.done,sets:newSets,actual:cur.actual};
                S.completions={...S.completions,[compKey]:{...c,exercises:exs}};
                save();render();};
              ysc.appendChild(yck);
            }
            aw.appendChild(ysc);
          }
          const al=document.createElement('span');al.className='actual-lbl';al.textContent=numSets===1?tgt:'';
          const ai=document.createElement('input');ai.className='actual-inp';

          ai.setAttribute('data-compkey',compKey);ai.setAttribute('data-yogi',ii);

          aw.append(al,ai);row.appendChild(aw);
        }
        row.onclick=()=>ckBtn.onclick(new Event('click'));
        inner.appendChild(row);
      });
    }

    // Walk log
    if(aid==='walk'){
      const wl=comp.walkLog||{};
      const ls=document.createElement('div');ls.className='log-sect';
      ls.innerHTML='<div class="log-lbl">Log your walk</div>';
      const rows=[
        {label:'Steps',    field:'steps',    mode:'numeric', placeholder:'e.g. 8000'},
        {label:'Distance', field:'distance', mode:'decimal', placeholder:'km'},
        {label:'Duration', field:'minutes',  mode:'numeric', placeholder:'mins'},

      rows.forEach(({label,field,mode,placeholder})=>{
        const r=document.createElement('div');r.className='log-row';
        r.innerHTML=`<span class="log-key">${label}</span>
          <input class="log-inp" type="text" inputmode="${mode}" placeholder="${placeholder}" value="${wl[field]||''}" data-logkey="${compKey}" data-logf="${field}">`;
        ls.appendChild(r);
      });
      const r3=document.createElement('div');r3.className='log-row';
      r3.innerHTML='<span class="log-key">Notes</span>';
      const ta=document.createElement('textarea');ta.className='log-textarea';ta.rows=2;
      ta.placeholder='Where did you walk?';ta.value=wl.notes||'';
      ta.setAttribute('data-logkey',compKey);ta.setAttribute('data-logf','notes');
      r3.appendChild(ta);ls.appendChild(r3);
      inner.appendChild(ls);
    }
    // Run log
    if(aid==='run'||aid==='run-yoga'){
      const rl=comp.runLog||{};
      const plan=RUN[week]||'';
      const parts=plan.match(/×\s*(\d+)/);
      const maxIntvl=parts?parts[1]:'';
      const ls=document.createElement('div');ls.className='log-sect';
      ls.innerHTML='<div class="log-lbl">Log your run</div>';
      const r1=document.createElement('div');r1.className='log-row';
      r1.innerHTML=`<span class="log-key">Intervals</span>
        <input class="log-inp" type="text" inputmode="numeric" placeholder="${maxIntvl||'—'}" value="${rl.intervals||''}" data-logkey="${compKey}" data-logf="intervals" style="width:3.5rem;flex:none">
        <span class="log-val">${maxIntvl?'of '+maxIntvl:''}</span>`;
      const r2=document.createElement('div');r2.className='log-row';
      r2.innerHTML=`<span class="log-key">Total time</span>
        <input class="log-inp" type="text" inputmode="decimal" placeholder="mins" value="${rl.minutes||''}" data-logkey="${compKey}" data-logf="minutes" style="width:3.5rem;flex:none">
        <span class="log-val">min</span>`;
      const r3=document.createElement('div');r3.className='log-row';
      r3.innerHTML=`<span class="log-key">Notes</span>`;
      const ta=document.createElement('textarea');ta.className='log-textarea';ta.rows=2;
      ta.placeholder='How did it feel?';ta.value=rl.notes||'';
      ta.setAttribute('data-logkey',compKey);ta.setAttribute('data-logf','notes');
      r3.appendChild(ta);
      ls.append(r1,r2,r3);inner.appendChild(ls);
    }
    exp.appendChild(inner);
    card.appendChild(exp);

    // Complete button
    if(aid!=='rest'){
      const ca=document.createElement('div');ca.className='carea';
      // Date picker row
      const dr=document.createElement('div');dr.className='date-row';
      const dl=document.createElement('span');dl.className='date-lbl';dl.textContent='Session date';
      const di=document.createElement('input');di.type='date';di.className='date-inp';
      di.max=isoToday();
      const storedDate=comp.sessionDate||getExpectedDate(week,day);
      di.value=storedDate;
      di.setAttribute('data-dpkey',compKey);
      di.onchange=(e)=>{
        const newDate=e.target.value;
        const moved=moveSession(compKey,newDate);
        if(moved===compKey){
          const c=S.completions[compKey]||{};
          S.completions={...S.completions,[compKey]:{...c,sessionDate:newDate}};
        }
        save();render();
      };
      dr.append(dl,di);ca.appendChild(dr);
      // Complete button
      const cb=document.createElement('button');
      cb.className='cbtn'+(isDone?' dn':'');
      cb.style.background=isDone?'':det.color;
      if(isDone){
        const dt=comp.completedAt?new Date(comp.completedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
        cb.innerHTML=`<span style="display:flex;align-items:center;justify-content:center;gap:.5rem">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          COMPLETE${dt?` <span style="color:#525252">· ${dt}</span>`:''}
        </span>`;
      }else{cb.textContent='MARK COMPLETE';}
      cb.onclick=()=>{
        const c=S.completions[compKey]||{};
        const useDate=c.sessionDate||isoToday();
        S.completions={...S.completions,[compKey]:{...c,done:!c.done,completedAt:!c.done?useDate:null}};
        save();render();
      };
      ca.appendChild(cb);card.appendChild(ca);
    } else {
      const rm=document.createElement('div');rm.className='rest-msg';rm.innerHTML='Rest is part of the programme. Take it.<br><span style="font-size:.625rem;color:#525252;font-family:JetBrains Mono,monospace;letter-spacing:.05em">Tap ⇄ above to switch to another activity</span>';
      card.appendChild(rm);
    }
  }
  return card;
}

function toggleEx(compKey,ei,es,color,ckBtn,nmEl){
  const c=S.completions[compKey]||{exercises:{}};
  const exs={...c.exercises};
  exs[ei]={done:!es.done,sets:es.sets};
  S.completions={...S.completions,[compKey]:{...c,exercises:exs}};
  save();
  // targeted DOM update — no full re-render
  const newDone=!es.done;
  ckBtn.className='ck'+(newDone?' on':'');
  ckBtn.style.background=newDone?color:'transparent';
  ckBtn.innerHTML=newDone?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'';
  nmEl.className='exnm'+(newDone?' dn':'');
  es.done=newDone;
}

// INPUT EVENTS — attached after render via delegation
// =========================================================
document.addEventListener('input',e=>{
  // Yoga actual duration inputs
  if(e.target.classList.contains('actual-inp')){
    const inp=e.target;
    const ck=inp.getAttribute('data-compkey');const yi=+inp.getAttribute('data-yogi');
    if(ck){
      const c=S.completions[ck]||{exercises:{}};
      const exs={...(c.exercises||{})};
      const cur=exState({exercises:exs},yi);
      exs[yi]={...cur,actual:inp.value};
      S.completions={...S.completions,[ck]:{...c,exercises:exs}};save();
    }return;
  }
  // Run / generic log inputs
  if(e.target.hasAttribute('data-logkey')){
    const inp=e.target;
    const lk=inp.getAttribute('data-logkey');const lf=inp.getAttribute('data-logf');
    if(lk&&lf){
      const c=S.completions[lk]||{};
      const rl={...(c.runLog||{})};rl[lf]=inp.value;
      S.completions={...S.completions,[lk]:{...c,runLog:rl}};save();
    }return;
  }
  const inp=e.target;
  if(!inp.classList.contains('sinp'))return;
  const {key,ei,si,f}=inp.dataset;
  if(!key)return;
  const c=S.completions[key]||{exercises:{}};
  const exs={...c.exercises};
  const es=exState({exercises:exs},+ei);
  const sets=es.sets.slice();
  while(sets.length<=+si)sets.push({});
  sets[+si]={...sets[+si],[f]:inp.value};
  exs[+ei]={done:es.done,sets};
  S.completions={...S.completions,[key]:{...c,exercises:exs}};
  save();
  // update .fi class on parent set-card
  const sc=inp.closest('.scard');
  if(sc){
    const wt=sc.querySelector('[data-f="weight"]');
    const rp=sc.querySelector('[data-f="reps"]');
    const hasVal=(wt&&wt.value)||(rp&&rp.value);
    sc.classList.toggle('fi',!!hasVal);
  }
});

// focus select-all for quick overwrite
document.addEventListener('focus',e=>{
  if(e.target.classList.contains('sinp'))e.target.select();
},true);

function mkToday(){
  const div=document.createElement('div');div.className='today-view fade';
  const today=todayDayKey();

  // Date label
  const dl=document.createElement('div');
  dl.style.cssText='padding:1rem 1.25rem .25rem;font-size:.625rem;letter-spacing:.25em;text-transform:uppercase;color:var(--t3);font-family:JetBrains Mono,monospace';
  dl.textContent=fmtLong();

  // Card
  const cw=document.createElement('div');cw.style.cssText='padding:0 1.25rem';
  cw.appendChild(mkCard(today,S.week,true));

  // Week strip
  const sw=document.createElement('div');sw.className='swrap';
  sw.innerHTML='<div class="slbl mf">THIS WEEK</div>';
  const strip=document.createElement('div');strip.className='strip';
  DAYS.forEach(d=>{
    const aid=(S.overrides&&S.overrides['w'+S.week+'-'+d])||getSchedule(S.week).d[d];const m=ACT[aid];
    const done=S.completions['w'+S.week+'-'+d]?.done;
    const isTod=d===today;
    const day=document.createElement('div');day.className='sday';
    day.innerHTML=`<span class="sd mf">${DAY_SHORT[d]}</span>
      <div class="sdot${isTod?' tod':''}" style="background:${done?m.color:m.tint};border-color:${done?'transparent':m.border}">
        ${done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </div>`;
    strip.appendChild(day);
  });
  sw.appendChild(strip);

  // Rule
  const rw=document.createElement('div');rw.className='rwrap';
  rw.innerHTML=`<div class="rcard">
    <div class="rq sf">"Never miss <span class="ac">twice.</span>"</div>
    <div class="rs">Miss a day, fine. The next session is non-negotiable.</div>
  </div>`;

  // Optional yoga after run in Phase 3
  const _todayAid=(S.overrides&&S.overrides['w'+S.week+'-'+today])||getSchedule(S.week).d[today];
  if(_todayAid==='run'&&getSchedule(S.week).ph>=3){
    const oyw=document.createElement('div');oyw.style.cssText='padding:0 1.25rem';
    oyw.appendChild(mkOptionalYogaCard(S.week,today));
    div.appendChild(oyw);
  }
  // Daily challenge card
  const todayCC=document.createElement('div');todayCC.style.cssText='padding:0 1.25rem';
  todayCC.appendChild(mkChallengeDayCard(S.week,today));
  div.appendChild(todayCC);
  // Measurements day card
  const mdayC=document.createElement('div');mdayC.style.cssText='padding:0 1.25rem';
  mdayC.appendChild(mkMeasurementsDayCard(S.week));
  div.appendChild(mdayC);
  // Past sessions quick-nav
  const pastNav=document.createElement('div');pastNav.className='past-nav';
  const yesterdayBtn=document.createElement('button');
  yesterdayBtn.className='past-nav-btn';
  yesterdayBtn.innerHTML='← Yesterday';
  yesterdayBtn.onclick=()=>{
    // Go to yesterday's day in week view
    const yd=new Date();yd.setDate(yd.getDate()-1);
    const ydDay=DAY_JS[yd.getDay()];
    // If yesterday was in current week, just switch to week view
    const wkStart=weekStartDate(S.week);
    const wkEnd=weekEndDate(S.week);
    wkStart.setHours(0,0,0,0);wkEnd.setHours(23,59,59);yd.setHours(12,0,0);
    if(yd>=wkStart&&yd<=wkEnd){
      S.tab='week';S.expanded=ydDay;save();render();
    } else {
      // Yesterday was in previous week
      if(S.week>0){S.week--;S.tab='week';S.expanded=ydDay;save();render();}
    }
  };
  const editWeekBtn=document.createElement('button');
  editWeekBtn.className='past-nav-btn accent';
  editWeekBtn.innerHTML='📋 Edit this week';
  editWeekBtn.onclick=()=>{S.tab='week';save();render();};
  const prevWeekBtn=document.createElement('button');
  prevWeekBtn.className='past-nav-btn';
  prevWeekBtn.innerHTML='← Prev week';
  prevWeekBtn.onclick=()=>{if(S.week>0){S.week--;S.tab='week';save();render();}};
  pastNav.append(yesterdayBtn,editWeekBtn,prevWeekBtn);
  div.appendChild(pastNav);
  // Weekly steps summary
  const wss=mkWeekStepsSummary(S.week);
  if(wss)div.appendChild(wss);
  // Monday measurement prompt
  if(todayDayKey()==='mon'){
    const mpW=document.createElement('div');mpW.style.cssText='padding:0 1.25rem;margin-top:.375rem';
    mpW.appendChild(mkMondayPrompt(S.week));
    div.appendChild(mpW);
  }
  // Steps row for today
  const stepsW=document.createElement('div');stepsW.style.cssText='padding:0 1.25rem;margin-top:0';
  stepsW.appendChild(mkStepsRow(S.week,today));
  // Today's extras
  const todayExtras=(S.extras||[]).filter(e=>{
    const d=e.date||'';return d===isoToday();
  });
  todayExtras.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(todayExtras.length>0){
    const ew=document.createElement('div');ew.style.cssText='padding:0 1.25rem';
    todayExtras.forEach(ex=>{const ec=mkExtraCard(ex);if(ec)ew.appendChild(ec);});
    div.append(dl,cw,stepsW,ew,sw,rw);
  } else {
    div.append(dl,cw,stepsW,sw,rw);
  }
  // Add session button for today
  const addW=document.createElement('div');addW.style.cssText='padding:0 1.25rem';
  addW.appendChild(mkAddSessionBtn(S.week,todayDayKey()));
  div.appendChild(addW);
  return div;
}

// =========================================================
// WEEK VIEW
// =========================================================
function mkWeek(){
  const div=document.createElement('div');div.className='wview fade';
  const today=todayDayKey();
  // Week banner — shows which week is being edited
  const isPastWeek=isWeekFuture(S.week)===false&&S.week<parseInt((() => {
    const now=new Date();now.setHours(0,0,0,0);
    for(let w=0;w<=24;w++){const ws=weekStartDate(w);ws.setHours(0,0,0,0);const we=weekEndDate(w);we.setHours(23,59,59,999);if(now>=ws&&now<=we)return w;}return S.week;
  })());
  if(isPastWeek||isWeekFuture(S.week)){
    const banner=document.createElement('div');
    banner.style.cssText='margin:.75rem 1.25rem .25rem;padding:.5rem .875rem;border-radius:.625rem;font-size:.6875rem;font-family:JetBrains Mono,monospace;letter-spacing:.05em;text-align:center;'+
      (isPastWeek?'background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);color:#60a5fa':
                  'background:rgba(38,38,38,.4);border:1px solid #262626;color:#525252');
    banner.textContent=isPastWeek?'📝 Editing past week — '+fmtWeekRange(S.week):'📅 Future week — '+fmtWeekRange(S.week);
    div.appendChild(banner);
  }
  // Challenge week card
  div.appendChild(mkChallengeWeekCard(S.week));
  // Measurements week card
  const _mwdiv=document.createElement('div');_mwdiv.style.cssText='padding:0 1.25rem';
  _mwdiv.appendChild(mkMeasurementsDayCard(S.week));div.appendChild(_mwdiv);
    DAYS.forEach(d=>{
    div.appendChild(mkChallengeDayCard(S.week,d));
    div.appendChild(mkCard(d,S.week,d===today));
    // Optional yoga after run in Phase 3
    const _aid=(S.overrides&&S.overrides['w'+S.week+'-'+d])||getSchedule(S.week).d[d];
    if(_aid==='run'&&getSchedule(S.week).ph>=3) div.appendChild(mkOptionalYogaCard(S.week,d));
    div.appendChild(mkStepsRow(S.week,d));
    // Show extras for this week+day
    const dayExtras=(S.extras||[]).filter(e=>e.week===S.week&&e.day===d);
    // Sort extras by date
    dayExtras.sort((a,b)=>new Date(a.date)-new Date(b.date));
    dayExtras.forEach(ex=>{
      const ec=mkExtraCard(ex);if(ec)div.appendChild(ec);
    });
    div.appendChild(mkAddSessionBtn(S.week,d));
  });
  return div;
}

// =========================================================
// PROGRESS VIEW
// =========================================================
function mkProgress(){
  const div=document.createElement('div');div.className='pgview fade';

  // Stats
  const allDone=Object.entries(S.completions).filter(([,c])=>c.done);
  const total=allDone.length;

  // Streak
  let streak=0;
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    if(Object.values(S.completions).some(c=>c.completedAt===iso&&c.done))streak++;
    else if(i>0)break;
  }

  // By type
  const byType={};
  allDone.forEach(([k])=>{
    const[wk,dy]=k.split('-');
    const w=parseInt(wk.slice(1));
    const aid=getSchedule(w)?.d[dy];
    if(aid){const t=aid.startsWith('gym')?'gym':aid;byType[t]=(byType[t]||0)+1;}
  });

  // Stat cards
  const sg=document.createElement('div');sg.className='sgrid2';
  sg.innerHTML=`
    <div class="sc">
      <div class="slb mf">Total</div>
      <div class="sv sf">${total}</div>
      <div class="ss">sessions done</div>
    </div>
    <div class="sc ac">
      <div class="slb ac mf">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        Streak
      </div>
      <div class="sv sf">${streak}</div>
      <div class="ss">day${streak!==1?'s':''}</div>
    </div>`;
  div.appendChild(sg);

  // Activity bars
  div.innerHTML+=`<div class="seclbl mf">By activity</div>`;
  const abcard=document.createElement('div');abcard.className='abcard';
  const acts=[
    {k:'gym',l:'Gym',c:'#fb923c'},{k:'run',l:'Run',c:'#60a5fa'},
    {k:'yoga',l:'Yoga',c:'#a3e635'},{k:'golf',l:'Golf',c:'#c084fc'},{k:'swim',l:'Swim',c:'#22d3ee'}
  ];
  const maxN=Math.max(...acts.map(a=>byType[a.k]||0),1);
  acts.forEach(a=>{
    const n=byType[a.k]||0;
    const row=document.createElement('div');row.className='abrow';
    row.innerHTML=`<span class="ablbl">${a.l}</span>
      <div class="abtr"><div class="abfi" style="background:${a.c};width:${(n/maxN*100).toFixed(1)}%"></div></div>
      <span class="abn mf">${n}</span>`;
    abcard.appendChild(row);
  });
  div.appendChild(abcard);

  // Week map
  const wmEl=document.createElement('div');
  wmEl.innerHTML='<div class="seclbl mf">12-WEEK MAP</div>';
  const wmcard=document.createElement('div');wmcard.className='wmcard';
  const wmap=document.createElement('div');wmap.className='wmap';
  for(let w=0;w<=Math.max(24,S.week);w++){
    const schd=getSchedule(w).d;
    const total2=DAYS.filter(d=>(S.overrides&&S.overrides['w'+w+'-'+d]?S.overrides['w'+w+'-'+d]:schd[d])!=='rest').length;
    const done2=DAYS.filter(d=>{const a=(S.overrides&&S.overrides['w'+w+'-'+d])||schd[d];return a!=='rest'&&S.completions['w'+w+'-'+d]?.done;}).length;
    const pct=total2?done2/total2:0;
    const wkLbl=getWeekLabel(w);
    const isFuture=isWeekFuture(w);
    const cell=document.createElement('button');
    cell.className='wcel'+(w===S.week?' cur':'');
    cell.style.borderColor=w===S.week?'var(--ac)':(wkLbl&&done2>0?wkLbl.color+'60':'');
    cell.innerHTML=`<div class="wctp"><span class="wcwk mf">W${String(w).padStart(2,'0')}</span><span class="wcph mf">P${getSchedule(w).ph}</span></div>
      <div class="wcct sf">${done2}<span class="dm">/${total2}</span></div>
      <div class="wcbar"><div class="wcbf" style="width:${(pct*100).toFixed(0)}%;background:${wkLbl?wkLbl.color:'#fb923c'}"></div></div>
      ${(wkLbl&&done2>0)?`<div class="wk-badge" style="color:${wkLbl.color};background:${wkLbl.bg}">${wkLbl.emoji} ${wkLbl.label}</div>`:''}`;
    cell.onclick=()=>{S.week=w;save();render();};
    wmap.appendChild(cell);
  }
  wmcard.appendChild(wmap);wmEl.appendChild(wmcard);div.appendChild(wmEl);

  // Phases
  div.innerHTML+='<div class="seclbl mf" style="margin-top:1.25rem">PHASES</div>';
  const curPh=getSchedule(S.week).ph;
  [0,1,2,3,4].forEach(p=>{
    const pi=PHASES[p];
    const phc=document.createElement('div');phc.className='phcard'+(p===curPh?' cur':'');
    phc.innerHTML=`<div class="phctp">
      <span class="phnm sf">${pi.name}${p===curPh?' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/></svg>':''}</span>
      <span class="phrg mf">${pi.range}</span>
    </div>
    <div class="phds">${pi.desc}</div>`;
    div.appendChild(phc);
  });

  // History
  div.innerHTML+='<div class="seclbl mf" style="margin-top:1.25rem">HISTORY FROM PT SHEET</div>';
  const hcard=document.createElement('div');hcard.className='hcard';
  [...HIST].reverse().forEach(h=>{
    const row=document.createElement('div');row.className='hrow';
    row.innerHTML=`<span class="hsess">${GYM[h.sess]?.name||h.sess}</span>
      <span class="hdate mf">${fmtDate(h.date)}<span class="hloc"> ${h.loc}</span></span>`;
    hcard.appendChild(row);
  });
  div.appendChild(hcard);

  // ---- Apple Health Import ----
  const rst=document.createElement('button');rst.className='rstbtn mf';rst.textContent='Reset all progress';
    // Challenge progress
  div.appendChild(mkChallengeProgress());

  // Measurements (above targets)
  const measWeek=S._measWeek!==undefined?S._measWeek:S.week;
  div.appendChild(mkMeasurementsSection(measWeek));

  // Targets
  div.appendChild(mkTargetsSection());

  // Week 12 comparison (actual vs targets)
  div.appendChild(mkWeek12Comparison());

  // Charts
  div.appendChild(mkChartsSection());

  // Steps progress
  div.appendChild(mkStepsProgress());

  // Continuation prompt at week 12
  if(S.week>=12) div.appendChild(mkContinuationPrompt());

  // Week Profile list
  const wpEl=document.createElement('div');
  wpEl.innerHTML='<div class="seclbl mf" style="margin-top:1.25rem">WEEK PROFILE</div>';
  const wpCard=document.createElement('div');wpCard.className='wk-profile-card';
  for(let w=0;w<=Math.max(24,S.week);w++){
    const lbl=getWeekLabel(w);
    const schd=getSchedule(w).d;
    let gym=0,run=0,yoga=0,golf=0,walk=0;
    DAYS.forEach(d=>{
      const key='w'+w+'-'+d;if(!S.completions[key]?.done)return;
      const aid=(S.overrides&&S.overrides[key])||schd[d];
      if(aid.startsWith('gym'))gym++;else if(aid==='run')run++;
      else if(aid==='yoga')yoga++;else if(aid==='golf')golf++;else if(aid==='walk')walk++;
    });
    (S.extras||[]).filter(e=>e.week===w&&e.done).forEach(e=>{
      const a=e.activityId;
      if(a.startsWith('gym'))gym++;else if(a==='run')run++;
      else if(a==='yoga')yoga++;else if(a==='golf')golf++;else if(a==='walk')walk++;
    });
    const row=document.createElement('div');row.className='wk-profile-row';
    const parts=[];
    if(gym)parts.push(gym+'× gym');if(run)parts.push(run+'× run');
    if(yoga)parts.push(yoga+'× yoga');if(golf)parts.push(golf+'× golf');
    if(walk)parts.push(walk+'× walk');
    const isFut=isWeekFuture(w);
    row.innerHTML=`
      <span class="wk-profile-num mf" style="width:3.5rem">W${String(w).padStart(2,'0')} <span style="color:#3d3d3d;font-size:.45rem">${fmtWeekRange(w)}</span></span>
      ${lbl?`<span class="wk-profile-badge" style="color:${lbl.color};background:${lbl.bg}">${lbl.emoji} ${lbl.label}</span>`:'<span class="wk-profile-badge" style="color:#525252;background:rgba(38,38,38,.4)">Upcoming</span>'}
      <span class="wk-profile-detail">${isFut?'':(parts.join(' · ')||'No sessions yet')}</span>`;
    wpCard.appendChild(row);
  }
  wpEl.appendChild(wpCard);div.appendChild(wpEl);

rst.onclick=()=>{if(confirm('Reset all completions? Cannot be undone.')){S.completions={};save();render();}};
  div.appendChild(rst);

  return div;
}

// =========================================================
// INSTALL HINT (shown only when not in standalone)
// =========================================================
function maybeShowInstall(){
  if(window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches)return;
  const hint=document.createElement('div');hint.className='ihint';
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid=/android/i.test(navigator.userAgent);
  if(isIOS)
    hint.innerHTML='<b>Add to Home Screen</b> for offline gym use:<br>Tap the Share icon → "Add to Home Screen"';
  else if(isAndroid)
    hint.innerHTML='<b>Install as app</b> for offline gym use:<br>Tap the menu → "Add to Home screen" or "Install app"';
  else
    hint.innerHTML='<b>Save this file</b> — it works completely offline once saved to your phone.';
  document.getElementById('app').appendChild(hint);
}

// =========================================================
// INIT
// =========================================================
// Auto-set to current week on first load (S.week===0 means fresh/default)
(function(){
  try{
    if(S.week===0){
      const now=new Date();now.setHours(0,0,0,0);
      for(let w=1;w<=52;w++){
        const ws=weekStartDate(w),we=weekEndDate(w);
        ws.setHours(0,0,0,0);we.setHours(23,59,59,999);
        if(now>=ws&&now<=we){S.week=w;save();break;}
      }
    }
  }catch(e){}
})();
render();
setTimeout(maybeShowInstall,500);
</script>
</body>
</html>
